<!doctype html><meta charset="utf-8"><title>katcheck</title><body><pre id="o">démarrage…</pre><script>
const o=document.getElementById("o");const B={1:1,2:2,3:11};
async function sha1(s){const b=await crypto.subtle.digest("SHA-1",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function S(r){return [r.title??null,r.periodInfo??null,r.copticDate??null,(r.sections||[]).map(s=>[s.id,s.title??null,(s.subSections||[]).map(u=>[u.id,u.title??null,u.introduction??null,(u.readings||[]).map(x=>[x.id,x.title??null,x.introduction??null,x.conclusion??null,x.html??null,x.storyId??null,(x.passages||[]).map(p=>[p.bookId,p.bookTranslation??null,p.chapter,p.ref,p.verses.map(v=>v.number+" "+v.text).join("|")])])])])]}
(async()=>{const E=await (await fetch("expected.json?"+Date.now())).json();const P=new URLSearchParams(location.search);
 let keys=Object.keys(E);const f=P.get("f");if(f)keys=keys.filter(k=>k.includes(f));const step=+(P.get("step")||1);keys=keys.filter((k,i)=>i%step===0);
 const bad=[],err=[];let done=0;const live={};
 async function one(k){const [l,d]=k.split("|");for(let t=0;t<3;t++){try{const r=await fetch(`https://api.katameros.app/readings/gregorian/${d}?languageId=${l}&bibleId=${B[l]}`);
   let h=null;if(r.status!==204){const j=await r.json();h=await sha1(JSON.stringify(S(j)));if(P.get("dump")===k)live.j=JSON.stringify(S(j));}
   if(h!==E[k])bad.push(k);return}catch(e){if(t==2)err.push(k)}}}
 let i=0;async function w(){while(i<keys.length){const k=keys[i++];await one(k);done++;if(done%25==0)o.textContent=`${done}/${keys.length} différences:${bad.length} erreurs:${err.length}`}}
 await Promise.all(Array.from({length:6},w));
 o.textContent=`FINI ${done}/${keys.length}\nDIFF ${bad.length}: ${bad.slice(0,150).join(" ")}\nERR ${err.length}: ${err.slice(0,30).join(" ")}`+(live.j?"\nDUMP "+live.j:"");
})();</script>
