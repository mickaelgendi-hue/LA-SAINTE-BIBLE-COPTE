const VDJ=[["john",3,16,"Car Dieu a tant aimé le monde qu'il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu'il ait la vie éternelle.","Car Dieu a tant aimé le monde qu'il a donné son Fils unique, afin que quiconque croit en lui ne périsse pas, mais qu'il ait la vie éternelle."],["luke",2,14,"Gloire à Dieu dans les lieux très hauts, Et paix sur la terre parmi les hommes qu'il agrée!"],["philippians",4,13,"Je puis tout par celui qui me fortifie.","Je peux tout par celui qui me fortifie."],["psalms",4,9,"Pour moi, je m'endormirai et me reposerai dans la paix; parce que toi, Seigneur, par une grâce singulière, tu m'as établi dans l'espérance."],["matthew",5,4,"Heureux les affligés, car ils seront consolés!","Heureux les malheureux, car ils seront consolés!"],["ephesians",6,10,"Au reste, fortifiez-vous dans le Seigneur, et par sa force toute-puissante."],["psalms",22,4,"Lors même que je cheminerais au milieu des ombres de la mort, je ne craindrais aucun mal, parce que tu es avec moi. Ta houlette et ton bâton m'ont rassuré.","Lors même que je cheminerais au milieu des ombres de la mort, je ne craindrais aucun mal, parce que tu es avec moi. Ton bâton de berger et ton bâton m'ont rassuré."],["philippians",1,6,"Je suis persuadé que celui qui a commencé en vous cette bonne œuvre la rendra parfaite pour le jour de Jésus-Christ."],["1-chronicles",16,34,"Rendez hommage au Seigneur, parce qu'il est bon et que sa miséricorde est éternelle."],["1-corinthians",10,13,"Aucune tentation ne vous est survenue qui n'ait été humaine, et Dieu, qui est fidèle, ne permettra pas que vous soyez tentés au-delà de vos forces; mais avec la tentation il préparera aussi le moyen d'en sortir, afin que vous puissiez la supporter."],["1-john",4,18,"La crainte n'est pas dans l'amour, mais l'amour parfait bannit la crainte; car la crainte suppose un châtiment, et celui qui craint n'est pas parfait dans l'amour.","La crainte n'est pas dans l'amour, mais l'amour parfait bannit la crainte; car la crainte suppose une punition, et celui qui craint n'est pas parfait dans l'amour."],["philippians",4,8,"Au reste, frères, que tout ce qui est vrai, tout ce qui est honorable, tout ce qui est juste, tout ce qui est pur, tout ce qui est aimable, tout ce qui mérite l'approbation, ce qui est vertueux et digne de louange, soit l'objet de vos pensées."],["1-john",1,5,"La nouvelle que nous avons apprise de lui, et que nous vous annonçons, c'est que Dieu est lumière, et qu'il n'y a point en lui de ténèbres.","La nouvelle que nous avons apprise de lui, et que nous vous annonçons, c'est que Dieu est lumière, et qu'il n'y a pas en lui de ténèbres."],["hebrews",12,2,"ayant les regards sur Jésus, le chef et le consommateur de la foi, qui, en vue de la joie qui lui était réservée, a souffert la croix, méprisé l'ignominie, et s'est assis à la droite du trône de Dieu.","ayant les regards sur Jésus, le chef et le consommateur de la foi, qui, en vue de la joie qui lui était réservée, a souffert la croix, méprisé la honte, et s'est assis à la droite du trône de Dieu."],["2-timothy",1,7,"Car ce n'est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d'amour et de sagesse."],["matthew",1,23,"Voici, la vierge sera enceinte, elle enfantera un fils, Et on lui donnera le nom d'Emmanuel, ce qui signifie Dieu avec nous.","Voici, la vierge sera enceinte, elle mettra au monde un fils, Et on lui donnera le nom d'Emmanuel, ce qui signifie Dieu avec nous."],["exodus",14,14,"Le Seigneur combattra pour vous, pendant que vous resterez tranquilles."],["luke",2,11,"c'est qu'aujourd'hui, dans la ville de David, il vous est né un Sauveur, qui est le Christ, le Seigneur."],["john",8,12,"Jésus leur parla de nouveau, et dit: Je suis la lumière du monde; celui qui me suit ne marchera pas dans les ténèbres, mais il aura la lumière de la vie."],["colossians",3,14,"Mais par-dessus toutes ces choses revêtez-vous de la charité, qui est le lien de la perfection."],["romans",12,21,"Ne te laisse pas vaincre par le mal, mais surmonte le mal par le bien."],["psalms",89,14,"Nous avons, dès l'aurore, été remplis de ta miséricorde, et nous avons tressailli, et nous avons été pleins de délices tous les jours de notre vie."],["2-corinthians",12,9,"et il m'a dit: Ma grâce te suffit, car ma puissance s'accomplit dans la faiblesse. Je me glorifierai donc bien plus volontiers de mes faiblesses, afin que la puissance de Christ repose sur moi."],["psalms",29,6,"Car la colère naît de son indignation, mais la vie est en sa volonté; le soir, il y aura des pleurs, et à l'aurore l'allégresse.","Car la colère naît de son indignation, mais la vie est en sa volonté; le soir, il y aura des pleurs, et à l'aurore la joie."],["deuteronomy",8,3,"Il t'a affligé, il t'a affamé et il t'a nourri de la manne, que n'avaient point connue tes pères, afin de t'apprendre que l'homme ne vit pas seulement de pain, mais que l'homme vivra de toute parole sortie de la bouche de Dieu.","Il t'a affligé, il t'a affamé et il t'a nourri de la manne, que n'avaient pas connue tes pères, afin de t'apprendre que l'homme ne vit pas seulement de pain, mais que l'homme vivra de toute parole sortie de la bouche de Dieu."],["1-peter",1,3,"Béni soit Dieu, le Père de notre Seigneur Jésus-Christ, qui, selon sa grande miséricorde, nous a régénérés, pour une espérance vivante, par la résurrection de Jésus-Christ d'entre les morts,"],["ephesians",4,2,"en toute humilité et douceur, avec patience, vous supportant les uns les autres avec charité,"],["isaiah",43,2,"Si tu traverses les eaux, je suis avec toi; et les fleuves ne pourront te submerger; et si tu passes à travers la flamme, tu ne seras point brûlé, le feu ne te brûlera pas.","Si tu traverses les eaux, je suis avec toi; et les fleuves ne pourront te submerger; et si tu passes à travers la flamme, tu ne seras pas brûlé, le feu ne te brûlera pas."],["proverbs",31,30,"Les grâces sont trompeuses, et la beauté de la femme est vanité; mais la femme intelligente sera bénie, et celle qui craint le Seigneur sera louée."],["leviticus",19,18,"Ta main n'exercera pas la vengeance; tu ne t'irriteras point contre les enfants de ton peuple; tu aimeras ton prochain comme toi-même: je suis le Seigneur.","Ta main n'exercera pas la vengeance; tu ne t'irriteras pas contre les enfants de ton peuple; tu aimeras ton prochain comme toi-même: je suis le Seigneur."],["daniel",2,20,"Disant: Que le nom du Seigneur soit béni, maintenant et dans tous les siècles, parce que toute sagesse et toute intelligence lui appartiennent."],["john",17,3,"Or, la vie éternelle, c'est qu'ils te connaissent, toi, le seul vrai Dieu, et celui que tu as envoyé, Jésus-Christ.","Et la vie éternelle, c'est qu'ils te connaissent, toi, le seul vrai Dieu, et celui que tu as envoyé, Jésus-Christ."],["exodus",20,12,"Honore ton père et ta mère, afin que tu sois heureux et que tu vives longtemps sur la terre fortunée que te donnera le Seigneur ton Dieu."],["ephesians",4,32,"Soyez bons les uns envers les autres, compatissants, vous pardonnant réciproquement, comme Dieu vous a pardonné en Christ."],["baruch",3,36,"C'est lui qui est notre Dieu, Et nul autre ne lui est comparable."],["psalms",118,105,"Ta loi est la lampe de mes pieds et la lumière de mes sentiers."],["psalms",22,6,"Et ta miséricorde me suivra tous les jours de ma vie; et ma demeure sera la maison du Seigneur dans toute la durée des jours."],["wisdom",1,1,"Aimez la justice, vous qui jugez la terre; ayez le cœur bon en pensant au Seigneur; cherchez-Le dans la simplicité du cœur."],["matthew",26,41,"Veillez et priez, afin que vous ne tombiez pas dans la tentation; l'esprit est bien disposé, mais la chair est faible."],["hebrews",13,2,"N'oubliez pas l'hospitalité; car, en l'exerçant, quelques-uns ont logé des anges, sans le savoir."],["1-peter",5,6,"Humiliez-vous donc sous la puissante main de Dieu, afin qu'il vous élève au temps convenable;"],["psalms",26,14,"Attends le Seigneur, sois homme; que ton cœur se fortifie, et attends le Seigneur."],["romans",8,18,"J'estime que les souffrances du temps présent ne sauraient être comparées à la gloire à venir qui sera révélée pour nous."],["john",1,5,"La lumière luit dans les ténèbres, et les ténèbres ne l'ont point reçue.","La lumière brille dans les ténèbres, et les ténèbres ne l'ont pas reçue."],["1-corinthians",2,9,"Mais, comme il est écrit, ce sont des choses que l'œil n'a point vues, que l'oreille n'a point entendues, et qui ne sont point montées au cœur de l'homme, des choses que Dieu a préparées pour ceux qui l'aiment.","Mais, comme il est écrit, ce sont des choses que l'œil n'a pas vues, que l'oreille n'a pas entendues, et qui ne sont pas montées au cœur de l'homme, des choses que Dieu a préparées pour ceux qui l'aiment."],["hebrews",12,1,"Nous donc aussi, puisque nous sommes environnés d'une si grande nuée de témoins, rejetons tout fardeau, et le péché qui nous enveloppe si facilement, et courons avec persévérance dans la carrière qui nous est ouverte,","Nous donc aussi, puisque nous sommes entourés d'une si grande nuage de témoins, descendants tout fardeau, et le péché qui nous enveloppe si facilement, et courons avec persévérance dans la carrière qui nous est ouverte,"],["revelation",22,20,"Celui qui atteste ces choses dit: Oui, je viens bientôt. Amen! Viens, Seigneur Jésus!"],["luke",12,34,"Car là où est votre trésor, là aussi sera votre cœur."],["1-thessalonians",5,11,"C'est pourquoi exhortez-vous réciproquement, et édifiez-vous les uns les autres, comme en réalité vous le faites.","C'est pourquoi encouragez-vous réciproquement, et édifiez-vous les uns les autres, comme en réalité vous le faites."],["2-timothy",3,16,"Toute Écriture est inspirée de Dieu, et utile pour enseigner, pour convaincre, pour corriger, pour instruire dans la justice,"],["revelation",1,8,"Je suis l'alpha et l'oméga, dit le Seigneur Dieu, celui qui est, qui était, et qui vient, le Tout-Puissant."],["john",5,24,"En vérité, en vérité, je vous le dis, celui qui écoute ma parole, et qui croit à celui qui m'a envoyé, a la vie éternelle et ne vient point en jugement, mais il est passé de la mort à la vie.","En vérité, en vérité, je vous le dis, celui qui écoute ma parole, et qui croit à celui qui m'a envoyé, a la vie éternelle et ne vient pas en jugement, mais il est passé de la mort à la vie."],["romans",5,8,"Mais Dieu prouve son amour envers nous, en ce que, lorsque nous étions encore des pécheurs, Christ est mort pour nous."],["psalms",45,2,"O Dieu, notre force et notre refuge, tu es notre champion dans les afflictions qui nous ont violemment assaillis;","O Dieu, notre force et notre refuge, tu es notre champion dans les souffrances qui nous ont violemment assaillis;"],["romans",10,9,"Si tu confesses de ta bouche le Seigneur Jésus, et si tu crois dans ton cœur que Dieu l'a ressuscité des morts, tu seras sauvé."],["john",14,27,"Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble point, et ne s'alarme point.","Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble pas, et ne s'alarme pas."],["psalms",103,24,"Que tes œuvres sont grandes, Seigneur; tu as fait toutes choses avec sagesse; la terre est pleine de tes créatures."],["proverbs",18,10,"Le Nom du Seigneur est d'une force toute-puissante; les justes qui courent à Lui sont glorifiés."],["romans",8,1,"Il n'y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ."],["psalms",99,4,"Pénétrez dans ses portes avec des actions de grâces; dans ses parvis avec des chants. Louez-le, célébrez son nom."],["matthew",18,20,"Car là où deux ou trois sont assemblés en mon nom, je suis au milieu d'eux."],["micah",6,8,"Ô homme, faut-il te dire ce qui est bon? Est-ce que le Seigneur demande de toi quelque chose, sinon que tu pratiques la justice, que tu aimes la miséricorde, et que tu sois prêt à cheminer avec le Seigneur ton Dieu?"],["psalms",117,24,"Voici le jour qu'a fait le Seigneur; tressaillons et réjouissons-nous en ce jour."],["2-timothy",4,7,"J'ai combattu le bon combat, j'ai achevé la course, j'ai gardé la foi."],["john",14,6,"Jésus lui dit: Je suis le chemin, la vérité, et la vie. Nul ne vient au Père que par moi."],["deuteronomy",6,5,"Tu aimeras le Seigneur ton Dieu de tout ton esprit, de toute ton âme, de toute ta force."],["deuteronomy",31,8,"Le Seigneur, qui marche parmi nous, ne t'abandonnera pas, et il ne t'a pas délaissé; n'aie ni crainte, ni faiblesse.","Le Seigneur, qui marche parmi nous, ne t'abandonnera pas, et il ne t'a pas abandonné; n'aie ni crainte, ni faiblesse."],["zechariah",9,9,"Réjouis-toi grandement, Sion, Ma fille, annonce à haute voix, Jérusalem, Ma fille: Voilà que ton Roi vient à toi, juste et sauveur, et Il est plein de douleur, Il est monté sur un âne, et sur un ânon, petit de l'ânesse.","Réjouis-toi grandement, Sion, Ma fille, annonce à haute voix, Jérusalem, Ma fille: Voilà que ton Roi vient à toi, juste et sauveur, et Il est plein de douleur, Il est monté sur un âne, et sur un petit âne, petit de l'ânesse."],["romans",6,23,"Car le salaire du péché, c'est la mort; mais le don gratuit de Dieu, c'est la vie éternelle en Jésus-Christ notre Seigneur."],["philippians",4,7,"Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ."],["1-corinthians",3,16,"Ne savez-vous pas que vous êtes le temple de Dieu, et que l'Esprit de Dieu habite en vous?"],["psalms",106,1,"Alléluiah! Rendez gloire au Seigneur, parce qu'il est bon, parce que sa miséricorde est éternelle."],["numbers",6,25,"Que le Seigneur fasse luire sur toi son visage, et qu'il ait pitié de toi,","Que le Seigneur fasse briller sur toi son visage, et qu'il ait pitié de toi,"],["isaiah",43,1,"Et maintenant voici ce que dit le Seigneur: Qui t'a créé, Jacob? qui t'a formé, Israël? Ne crains pas, car je t'ai racheté; je t'ai donné ton nom, tu es à moi."],["luke",24,6,"Il n'est point ici, mais il est ressuscité. Souvenez-vous de quelle manière il vous a parlé, lorsqu'il était encore en Galilée,","Il n'est pas ici, mais il est ressuscité. Souvenez-vous de quelle manière il vous a parlé, lorsqu'il était encore en Galilée,"],["acts",16,31,"Paul et Silas répondirent: Crois au Seigneur Jésus, et tu seras sauvé, toi et ta famille."],["ezekiel",36,26,"Je vous donnerai un nouveau cœur, et je mettrai en vous un esprit nouveau; j'ôterai de votre sein votre cœur de roche, et j'y placerai un cœur de chair.","Je vous donnerai un nouveau cœur, et je mettrai en vous un esprit nouveau; j'enlèverai de votre sein votre cœur de roche, et j'y placerai un cœur de chair."],["romans",14,8,"Car si nous vivons, nous vivons pour le Seigneur; et si nous mourons, nous mourons pour le Seigneur. Soit donc que nous vivions, soit que nous mourions, nous sommes au Seigneur."],["ephesians",3,20,"Or, à celui qui peut faire, par la puissance qui agit en nous, infiniment au-delà de tout ce que nous demandons ou pensons,","Et à celui qui peut faire, par la puissance qui agit en nous, infiniment au-delà de tout ce que nous demandons ou pensons,"],["matthew",5,9,"Heureux ceux qui procurent la paix, car ils seront appelés fils de Dieu!"],["1-corinthians",15,57,"Mais grâces soient rendues à Dieu, qui nous donne la victoire par notre Seigneur Jésus-Christ!"],["psalms",15,8,"Je n'ai cessé de voir devant moi le Seigneur; car il se tient à ma droite, pour que je ne sois pas ébranlé.","Je n'ai cessé de voir devant moi le Seigneur; car il se tient à ma droite, pour que je ne sois pas secoué."],["luke",23,34,"Jésus dit: Père, pardonne-leur, car ils ne savent ce qu'ils font. Ils se partagèrent ses vêtements, en tirant au sort."],["luke",15,7,"De même, je vous le dis, il y aura plus de joie dans le ciel pour un seul pécheur qui se repent, que pour quatre-vingt-dix-neuf justes qui n'ont pas besoin de repentance."],["psalms",18,15,"Alors les paroles de ma bouche te plairont, et les pensées de mon cœur seront toujours agréables devant toi. Seigneur, tu es mon aide et mon Rédempteur."],["psalms",33,9,"Goûtez et voyez combien le Seigneur est doux; heureux l'homme qui espère en lui."],["john",6,68,"Simon Pierre lui répondit: Seigneur, à qui irions-nous? Tu as les paroles de la vie éternelle."],["genesis",1,27,"Et Dieu créa l'homme; il le créa à l'image de Dieu; il les créa mâle et femelle."],["hebrews",10,23,"Retenons fermement la profession de notre espérance, car celui qui a fait la promesse est fidèle."],["romans",12,2,"Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l'intelligence, afin que vous discerniez quelle est la volonté de Dieu, ce qui est bon, agréable et parfait."],["psalms",36,4,"Délecte-toi dans le Seigneur, et il t'accordera ce que ton cœur aura demandé."],["psalms",30,25,"Soyez hommes; et que votre cœur se fortifie, vous tous qui espérez en Dieu."],["matthew",6,9,"Voici donc comment vous devez prier: Notre Père qui es aux cieux! Que ton nom soit sanctifié;"],["romans",8,31,"Que dirons-nous donc à l'égard de ces choses? Si Dieu est pour nous, qui sera contre nous?"],["mark",12,30,"et: Tu aimeras le Seigneur, ton Dieu, de tout ton cœur, de toute ton âme, de toute ta pensée, et de toute ta force."],["hebrews",13,8,"Jésus-Christ est le même hier, aujourd'hui, et éternellement."],["psalms",62,2,"Dieu, ô mon Dieu, je veille pour toi dès l'aurore; mon âme a soif de toi; avec quelle ardeur ma chair te désire!"],["john",10,11,"Je suis le bon berger. Le bon berger donne sa vie pour ses brebis."],["john",13,34,"Je vous donne un commandement nouveau: Aimez-vous les uns les autres; comme je vous ai aimés, vous aussi, aimez-vous les uns les autres."],["hebrews",4,12,"Car la parole de Dieu est vivante et efficace, plus tranchante qu'une épée quelconque à deux tranchants, pénétrante jusqu'à partager âme et esprit, jointures et mœlles; elle juge les sentiments et les pensées du cœur."],["2-thessalonians",3,16,"Que le Seigneur de la paix vous donne lui-même la paix en tout temps, de toute manière! Que le Seigneur soit avec vous tous!"],["hebrews",13,5,"Ne vous livrez pas à l'amour de l'argent; contentez-vous de ce que vous avez; car Dieu lui-même a dit: Je ne te délaisserai point, et je ne t'abandonnerai point.","Ne vous livrez pas à l'amour de l'argent; contentez-vous de ce que vous avez; car Dieu lui-même a dit: Je ne te délaisserai pas, et je ne t'abandonnerai pas."],["2-corinthians",4,18,"parce que nous regardons, non point aux choses visibles, mais à celles qui sont invisibles; car les choses visibles sont passagères, et les invisibles sont éternelles."],["luke",6,36,"Soyez donc miséricordieux, comme votre Père est miséricordieux."],["1-corinthians",13,4,"La charité est patiente, elle est pleine de bonté; la charité n'est point envieuse; la charité ne se vante point, elle ne s'enfle point d'orgueil,","La charité est patiente, elle est pleine de bonté; la charité n'est pas envieuse; la charité ne se vante pas, elle ne s'enfle pas d'orgueil,"],["2-corinthians",1,4,"qui nous console dans toutes nos afflictions, afin que, par la consolation dont nous sommes l'objet de la part de Dieu, nous puissions consoler ceux qui se trouvent dans quelque affliction!","qui nous console dans toutes nos souffrances, afin que, par la consolation dont nous sommes l'objet de la part de Dieu, nous puissions consoler ceux qui se trouvent dans quelque souffrance!"],["luke",1,46,"Et Marie dit: Mon âme exalte le Seigneur,","Et Marie dit: Mon âme célèbre le Seigneur,"],["philippians",4,5,"Que votre douceur soit connue de tous les hommes. Le Seigneur est proche."],["revelation",3,20,"Voici, je me tiens à la porte, et je frappe. Si quelqu'un entend ma voix et ouvre la porte, j'entrerai chez lui, je souperai avec lui, et lui avec moi."],["psalms",56,2,"Aie pitié de moi, ô mon Dieu, aie pitié de moi, car mon âme s'est confiée en toi; j'espérerai à l'ombre de tes ailes, jusqu'à ce que l'iniquité soit passée.","Aie pitié de moi, ô mon Dieu, aie pitié de moi, car mon âme s'est confiée en toi; j'espérerai à l'ombre de tes ailes, jusqu'à ce que la faute soit passée."],["song-of-songs",8,7,"Des torrents d'eau ne pourront point éteindre l'amour, ni les fleuves le submerger. Si un homme donne toute sa vie par amour, les autres hommes auront pour lui le dernier mépris.","Des torrents d'eau ne pourront pas éteindre l'amour, ni les fleuves le submerger. Si un homme donne toute sa vie par amour, les autres hommes auront pour lui le dernier mépris."],["john",16,33,"Je vous ai dit ces choses, afin que vous ayez la paix en moi. Vous aurez des tribulations dans le monde; mais prenez courage, j'ai vaincu le monde.","Je vous ai dit ces choses, afin que vous ayez la paix en moi. Vous aurez des épreuves dans le monde; mais prenez courage, j'ai vaincu le monde."],["colossians",3,2,"Affectionnez-vous aux choses d'en haut, et non à celles qui sont sur la terre."],["galatians",2,20,"J'ai été crucifié avec Christ; et si je vis, ce n'est plus moi qui vis, c'est Christ qui vit en moi; si je vis maintenant dans la chair, je vis dans la foi au Fils de Dieu, qui m'a aimé et qui s'est livré lui-même pour moi."],["isaiah",7,14,"C'est pourquoi le Seigneur lui-même vous donnera un signe. Voilà que la Vierge concevra dans son sein, et elle enfantera un fils, et tu lui donneras le nom d'Emmanuel.","C'est pourquoi le Seigneur lui-même vous donnera un signe. Voilà que la Vierge concevra dans son sein, et elle mettra au monde un fils, et tu lui donneras le nom d'Emmanuel."],["psalms",39,2,"J'ai attendu le Seigneur dans une vive attente, et il a fait attention à moi, et il a exaucé mon oraison,","J'ai attendu le Seigneur dans une vive attente, et il a fait attention à moi, et il a écouté ma prière,"],["matthew",3,17,"Et voici, une voix fit entendre des cieux ces paroles: Celui-ci est mon Fils bien-aimé, en qui j'ai mis toute mon affection."],["james",4,8,"Approchez-vous de Dieu, et il s'approchera de vous. Nettoyez vos mains, pécheurs; purifiez vos cœurs, hommes irrésolus."],["psalms",120,2,"Le secours me viendra du Seigneur, qui a créé le ciel et la terre."],["hebrews",11,6,"Or sans la foi il est impossible de lui être agréable; car il faut que celui qui s'approche de Dieu croie que Dieu existe, et qu'il est le rémunérateur de ceux qui le cherchent.","Et sans la foi il est impossible de lui être agréable; car il faut que celui qui s'approche de Dieu croie que Dieu existe, et qu'il est le rémunérateur de ceux qui le cherchent."],["1-corinthians",1,18,"Car la prédication de la croix est une folie pour ceux qui périssent; mais pour nous qui sommes sauvés, elle est une puissance de Dieu."],["1-peter",5,7,"et déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous."],["psalms",94,6,"Venez, prosternons-nous devant lui pour l'adorer; et pleurons devant le Seigneur qui nous a faits."],["matthew",5,5,"Heureux les débonnaires, car ils hériteront la terre!"],["job",1,21,"Nu je suis sorti des entrailles de ma mère, nu je partirai d'ici; le Seigneur n'avait donné, le Seigneur m'a ôté, il est advenu comme il a plu au Seigneur; béni soit le nom du Seigneur.","Nu je suis sorti des entrailles de ma mère, nu je partirai d'ici; le Seigneur n'avait donné, le Seigneur m'a enlevé, il est arrivé comme il a plu au Seigneur; béni soit le nom du Seigneur."],["matthew",16,24,"Alors Jésus dit à ses disciples: Si quelqu'un veut venir après moi, qu'il renonce à lui-même, qu'il se charge de sa croix, et qu'il me suive."],["philippians",2,5,"Ayez en vous les sentiments qui étaient en Jésus-Christ,"],["matthew",4,4,"Jésus répondit: Il est écrit: L'homme ne vivra pas de pain seulement, mais de toute parole qui sort de la bouche de Dieu."],["luke",11,9,"Et moi, je vous dis: Demandez, et l'on vous donnera; cherchez, et vous trouverez; frappez, et l'on vous ouvrira."],["revelation",2,10,"Ne crains pas ce que tu vas souffrir. Voici, le diable jettera quelques-uns de vous en prison, afin que vous soyez éprouvés, et vous aurez une tribulation de dix jours. Sois fidèle jusqu'à la mort, et je te donnerai la couronne de vie.","Ne crains pas ce que tu vas souffrir. Voici, le diable jettera quelques-uns de vous en prison, afin que vous soyez éprouvés, et vous aurez une épreuve de dix jours. Sois fidèle jusqu'à la mort, et je te donnerai la couronne de vie."],["matthew",5,44,"Mais moi, je vous dis: Aimez vos ennemis, bénissez ceux qui vous maudissent, faites du bien à ceux qui vous haïssent, et priez pour ceux qui vous maltraitent et qui vous persécutent,"],["galatians",3,28,"Il n'y a plus ni Juif ni Grec, il n'y a plus ni esclave ni libre, il n'y a plus ni homme ni femme; car tous vous êtes un en Jésus-Christ."],["john",15,13,"Il n'y a pas de plus grand amour que de donner sa vie pour ses amis."],["matthew",25,40,"Et le roi leur répondra: Je vous le dis en vérité, toutes les fois que vous avez fait ces choses à l'un de ces plus petits de mes frères, c'est à moi que vous les avez faites."],["1-samuel",2,2,"Car nul n'est saint comme le Seigneur, nul n'est juste comme mon Dieu, nul n'est saint, hormis vous."],["romans",13,10,"L'amour ne fait point de mal au prochain: l'amour est donc l'accomplissement de la loi.","L'amour ne fait pas de mal au prochain: l'amour est donc l'accomplissement de la loi."],["philippians",3,14,"je cours vers le but, pour remporter le prix de la vocation céleste de Dieu en Jésus-Christ."],["matthew",22,37,"Jésus lui répondit: Tu aimeras le Seigneur, ton Dieu, de tout ton cœur, de toute ton âme, et de toute ta pensée."],["1-john",1,9,"Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute iniquité.","Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute faute."],["ezekiel",34,16,"Je chercherai celle qui sera perdue; je ramènerai celle qui sera égarée; j'entourerai de bandes celle qui sera blessée; je fortifierai les faibles; je veillerai sur les fortes, et je les ferai paître selon la justice."],["1-chronicles",16,11,"Cherchez le Seigneur et soyez forts; cherchez toujours son visage."],["habakkuk",3,18,"Pour moi, je tressaillirai dans le Seigneur; je mettrai ma joie en Dieu, mon Sauveur."],["matthew",7,12,"Tout ce que vous voulez que les hommes fassent pour vous, faites-le de même pour eux, car c'est la loi et les prophètes."],["matthew",10,31,"Ne craignez donc point: vous valez plus que beaucoup de passereaux.","Ne craignez donc pas: vous valez plus que beaucoup de moineaux."],["matthew",5,3,"Heureux les pauvres en esprit, car le royaume des cieux est à eux!"],["amos",5,24,"Et Mon jugement roulera comme une pluie violente, et Ma justice comme un torrent où l'on ne peut naviguer."],["hebrews",11,1,"Or la foi est une ferme assurance des choses qu'on espère, une démonstration de celles qu'on ne voit pas.","Et la foi est une ferme assurance des choses qu'on espère, une démonstration de celles qu'on ne voit pas."],["psalms",146,3,"Il guérit les hommes contrits en leur cœur; il bande leurs plaie."],["zephaniah",3,17,"Le Seigneur ton Dieu est avec toi; le Tout-Puissant te sauvera: Il te rendra la joie; Il te rajeunira de Son amour; en toi Il sera ravi de joie, comme en un jour de fête."],["isaiah",49,15,"Est-ce qu'une mère oublie son enfant? Est-ce qu'elle n'a point compassion du fruit de ses entrailles? Et lors même que la mère les oublierait, moi je ne t'oublierai jamais, dit le Seigneur.","Est-ce qu'une mère oublie son enfant? Est-ce qu'elle n'a pas compassion du fruit de ses entrailles? Et lors même que la mère les oublierait, moi je ne t'oublierai jamais, dit le Seigneur."],["romans",12,12,"Réjouissez-vous en espérance. Soyez patients dans l'affliction. Persévérez dans la prière.","Réjouissez-vous en espérance. Soyez patients dans la souffrance. Persévérez dans la prière."],["ephesians",6,11,"Revêtez-vous de toutes les armes de Dieu, afin de pouvoir tenir ferme contre les ruses du diable."],["isaiah",60,1,"Resplendis, Jérusalem, resplendis de lumière; car ta lumière est venue, et la gloire du Seigneur s'est levée sur toi."],["john",21,17,"Il lui dit pour la troisième fois: Simon, fils de Jonas, m'aimes-tu? Pierre fut attristé de ce qu'il lui avait dit pour la troisième fois: M'aimes-tu? Et il lui répondit: Seigneur, tu sais toutes choses, tu sais que je t'aime. Jésus lui dit: Pais mes brebis."],["james",4,7,"Soumettez-vous donc à Dieu; résistez au diable, et il fuira loin de vous."],["psalms",24,4,"Montre-moi tes voies, fais-moi connaître tes sentiers."],["matthew",7,7,"Demandez, et l'on vous donnera; cherchez, et vous trouverez; frappez, et l'on vous ouvrira."],["james",1,2,"Mes frères, regardez comme un sujet de joie complète les diverses épreuves auxquelles vous pouvez être exposés,"],["philippians",4,19,"Et mon Dieu pourvoira à tous vos besoins selon sa richesse, avec gloire, en Jésus-Christ."],["sirach",2,6,"Aie foi en Dieu, et il te relèvera; rends tes voies droites, et espère en lui."],["john",14,1,"Que votre cœur ne se trouble point. Croyez en Dieu, et croyez en moi.","Que votre cœur ne se trouble pas. Croyez en Dieu, et croyez en moi."],["revelation",21,5,"Et celui qui était assis sur le trône dit: Voici, je fais toutes choses nouvelles. Et il dit: Écris; car ces paroles sont certaines et véritables."],["psalms",61,2,"Mon âme n'est-elle pas soumise à Dieu, puisque mon salut vient de lui?"],["acts",2,38,"Pierre leur dit: Repentez-vous, et que chacun de vous soit baptisé au nom de Jésus-Christ, pour le pardon de vos péchés; et vous recevrez le don du Saint-Esprit."],["romans",8,38,"Car j'ai l'assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,"],["daniel",3,52,"Soyez béni, Seigneur Dieu de nos pères; soyez loué et infiniment exalté dans tous les siècles! Que béni soit votre nom saint et glorieux; qu'il soit célébré, qu'il soit exalté dans tous les siècles.","Soyez béni, Seigneur Dieu de nos pères; soyez loué et infiniment élevé dans tous les siècles! Que béni soit votre nom saint et glorieux; qu'il soit célébré, qu'il soit élevé dans tous les siècles."],["1-thessalonians",5,18,"Rendez grâces en toutes choses, car c'est à votre égard la volonté de Dieu en Jésus-Christ."],["1-john",5,14,"Nous avons auprès de lui cette assurance, que si nous demandons quelque chose selon sa volonté, il nous écoute."],["psalms",26,1,"Le Seigneur est ma lumière et mon salut: qui craindrai-je? Le Seigneur protège ma vie: de qui aurai-je peur?"],["romans",5,5,"Or, l'espérance ne trompe point, parce que l'amour de Dieu est répandu dans nos cœurs par le Saint-Esprit qui nous a été donné.","Et l'espérance ne trompe pas, parce que l'amour de Dieu est répandu dans nos cœurs par le Saint-Esprit qui nous a été donné."],["1-john",4,19,"Pour nous, nous l'aimons, parce qu'il nous a aimés le premier."],["romans",15,13,"Que le Dieu de l'espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous abondiez en espérance, par la puissance du Saint-Esprit!"],["matthew",5,8,"Heureux ceux qui ont le cœur pur, car ils verront Dieu!"],["psalms",50,12,"Crée en moi un cœur pur, ô mon Dieu, et rétablis un esprit droit en mes entrailles."],["exodus",15,2,"Il m'a sauvé, il a été mon secours et mon protecteur; c'est mon Dieu, et je le glorifierai; c'est le Dieu de mon père, et je l'exalterai;","Il m'a sauvé, il a été mon secours et mon protecteur; c'est mon Dieu, et je le glorifierai; c'est le Dieu de mon père, et je l'élèverai;"],["john",1,14,"Et la parole a été faite chair, et elle a habité parmi nous, pleine de grâce et de vérité; et nous avons contemplé sa gloire, une gloire comme la gloire du Fils unique venu du Père."],["psalms",102,2,"Ô mon âme, bénis le Seigneur, et n'oublie aucune de ses louanges."],["1-corinthians",6,19,"Ne savez-vous pas que votre corps est le temple du Saint-Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez point à vous-mêmes?","Ne savez-vous pas que votre corps est le temple du Saint-Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez pas à vous-mêmes?"],["micah",7,18,"Qui donc est Dieu comme Toi, qui ôtes les péchés, et passes sous silence les impiétés de ce qui reste de Ton héritage! Le Seigneur n'a point maintenu le témoignage de Sa colère; Il Se complaît en Sa miséricorde;","Qui donc est Dieu comme Toi, qui enlèves les péchés, et passes sous silence les méchancetés de ce qui reste de Ton héritage! Le Seigneur n'a pas maintenu le témoignage de Sa colère; Il Se plaît en Sa miséricorde;"],["proverbs",9,10,"La crainte du Seigneur est le commencement de la sagesse, et le conseil des saints est l'intelligence; car connaître la loi, c'est l'œuvre d'un bon esprit."],["john",4,24,"Dieu est Esprit, et il faut que ceux qui l'adorent l'adorent en esprit et en vérité."],["2-corinthians",5,17,"Si quelqu'un est en Christ, il est une nouvelle créature. Les choses anciennes sont passées; voici, toutes choses sont devenues nouvelles."],["psalms",135,1,"Alléluiah! Rendez gloire au Seigneur; car il est bon, et sa miséricorde est éternelle."],["psalms",122,1,"J'ai levé mes yeux vers toi, qui demeures au ciel.","J'ai levé mes yeux vers toi, qui demeures au ciel."],["acts",4,12,"Il n'y a de salut en aucun autre; car il n'y a sous le ciel aucun autre nom qui ait été donné parmi les hommes, par lequel nous devions être sauvés."],["2-samuel",22,2,"Et il dit, en ce cantique: Seigneur, mon rocher, ma forteresse, mon sauveur!","Et il dit, en ce chant: Seigneur, mon rocher, ma forteresse, mon sauveur!"],["2-chronicles",7,14,"Et si mon peuple, pour qui mon nom est invoqué, rentre en soi-même, s'il prie, s'il désire ma présence, s'il se détourne de la mauvaise voie, je l'entendrai du haut du ciel; je serai miséricordieux pour ses péchés, et je guérirai sa terre."],["matthew",6,33,"Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus."],["psalms",31,8,"Je te donnerai l'intelligence et je t'affermirai dans la voie où tu dois marcher; j'aurai toujours les yeux fixés sur toi."],["galatians",6,2,"Portez les fardeaux les uns des autres, et vous accomplirez ainsi la loi de Christ."],["sirach",1,14,"Le commencement de la sagesse est de craindre Dieu; elle est formée avec les fidèles dans le sein de leur mère."],["luke",23,43,"Jésus lui répondit: Je te le dis en vérité, aujourd'hui tu seras avec moi dans le paradis."],["1-thessalonians",5,17,"Priez sans cesse."],["genesis",28,15,"Je suis avec toi pour te garder en toute voie où tu marcheras; je te ramènerai en cette terre, et je ne t'abandonnerai point que je n'aie accompli les choses que je t'ai dites.","Je suis avec toi pour te garder en toute voie où tu marcheras; je te ramènerai en cette terre, et je ne t'abandonnerai pas que je n'aie accompli les choses que je t'ai dites."],["james",5,16,"Confessez donc vos péchés les uns aux autres, et priez les uns pour les autres, afin que vous soyez guéris. La prière fervente du juste a une grande efficace."],["john",15,5,"Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire.","Je suis le cep, vous êtes les branches. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire."],["wisdom",3,1,"L'âme des justes est dans la main de Dieu, et nulle torture ne les atteindra."],["philippians",1,21,"car Christ est ma vie, et la mort m'est un gain."],["mark",9,23,"Jésus lui dit: Si tu peux!… Tout est possible à celui qui croit."],["proverbs",3,6,"Discerne-la en toutes tes voies, pour marcher droit dans tes sentiers."],["john",15,12,"C'est ici mon commandement: Aimez-vous les uns les autres, comme je vous ai aimés."],["proverbs",17,17,"Aie en tout temps un ami; que tes frères te soient secourables dans tes nécessités: c'est pour cela qu'ils sont nés."],["genesis",1,31,"Et Dieu regarda toutes les choses qu'il avait créées; et les trouva excellemment bonnes. Et il y eut un soir, et il y eut un matin, et ce fut un sixième jour."],["colossians",3,13,"Supportez-vous les uns les autres, et, si l'un a sujet de se plaindre de l'autre, pardonnez-vous réciproquement. De même que Christ vous a pardonné, pardonnez-vous aussi."],["1-kings",8,61,"Puissent nos cœurs être parfaits devant le Seigneur notre Dieu, marcher saintement dans ses préceptes, et observer ses commandements, comme aujourd'hui.","Puissent nos cœurs être parfaits devant le Seigneur notre Dieu, marcher saintement dans ses commandements, et observer ses commandements, comme aujourd'hui."],["1-john",2,17,"Et le monde passe, et sa convoitise aussi; mais celui qui fait la volonté de Dieu demeure éternellement.","Et le monde passe, et son mauvais désir aussi; mais celui qui fait la volonté de Dieu demeure éternellement."],["john",3,30,"Il faut qu'il croisse, et que je diminue."],["revelation",21,4,"Il essuiera toute larme de leurs yeux, et la mort ne sera plus, et il n'y aura plus ni deuil, ni cri, ni douleur, car les premières choses ont disparu."],["acts",20,35,"Je vous ai montré de toutes manières que c'est en travaillant ainsi qu'il faut soutenir les faibles, et se rappeler les paroles du Seigneur, qui a dit lui-même: Il y a plus de bonheur à donner qu'à recevoir."],["ephesians",2,10,"Car nous sommes son ouvrage, ayant été créés en Jésus-Christ pour de bonnes œuvres, que Dieu a préparées d'avance, afin que nous les pratiquions."],["john",13,35,"A ceci tous connaîtront que vous êtes mes disciples, si vous avez de l'amour les uns pour les autres."],["romans",3,23,"Car tous ont péché et sont privés de la gloire de Dieu;"],["galatians",5,1,"C'est pour la liberté que Christ nous a affranchis. Demeurez donc fermes, et ne vous laissez pas mettre de nouveau sous le joug de la servitude."],["1-samuel",16,7,"Et le Seigneur dit à Samuel: Ne fais pas attention à son extérieur ni à sa grande taille; je l'ai rejeté. Car Dieu ne voit pas comme l'homme; l'homme regarde la figure, Dieu regarde le cœur."],["revelation",22,13,"Je suis l'alpha et l'oméga, le premier et le dernier, le commencement et la fin."],["psalms",102,13,"Et comme un père a compassion de ses fils, ainsi le Seigneur a compassion de ceux qui le craignent."],["psalms",55,4,"Mais ils sentiront la crainte, et moi j'espérerai en toi."],["john",14,23,"Jésus lui répondit: Si quelqu'un m'aime, il gardera ma parole, et mon Père l'aimera; nous viendrons à lui, et nous ferons notre demeure chez lui."],["matthew",5,6,"Heureux ceux qui ont faim et soif de la justice, car ils seront rassasiés!"],["mark",11,24,"C'est pourquoi je vous dis: Tout ce que vous demanderez en priant, croyez que vous l'avez reçu, et vous le verrez s'accomplir."],["john",11,25,"Jésus lui dit: Je suis la résurrection et la vie. Celui qui croit en moi vivra, quand même il serait mort;"],["luke",2,10,"Mais l'ange leur dit: Ne craignez point; car je vous annonce une bonne nouvelle, qui sera pour tout le peuple le sujet d'une grande joie:","Mais l'ange leur dit: Ne craignez pas; car je vous annonce une bonne nouvelle, qui sera pour tout le peuple le sujet d'une grande joie:"],["jude",1,21,"maintenez-vous dans l'amour de Dieu, en attendant la miséricorde de notre Seigneur Jésus-Christ pour la vie éternelle."],["jonah",2,3,"Et il dit: J'ai crié dans ma tribulation au Seigneur mon Dieu, et Il m'a exaucé; mon cri est parti des entrailles de l'enfer, et Tu as écouté ma voix;","Et il dit: J'ai crié dans mon épreuve au Seigneur mon Dieu, et Il m'a écouté; mon cri est parti des entrailles de l'enfer, et Tu as écouté ma voix;"],["1-peter",2,9,"Vous, au contraire, vous êtes une race élue, un sacerdoce royal, une nation sainte, un peuple acquis, afin que vous annonciez les vertus de celui qui vous a appelés des ténèbres à son admirable lumière,","Vous, au contraire, vous êtes une race élue, une fonction de prêtre royal, une nation sainte, un peuple acquis, afin que vous annonciez les vertus de celui qui vous a appelés des ténèbres à son admirable lumière,"],["psalms",45,11,"Restez en paix, et voyez que je suis Dieu. Je serai glorifié parmi les nations; je serai exalté sur la terre.","Restez en paix, et voyez que je suis Dieu. Je serai glorifié parmi les nations; je serai élevé sur la terre."],["psalms",32,22,"Seigneur, répands sur nous ta miséricorde, autant que nous l'avons espéré de toi."],["hebrews",4,16,"Approchons-nous donc avec assurance du trône de la grâce, afin d'obtenir miséricorde et de trouver grâce, pour être secourus dans nos besoins."],["psalms",142,8,"Fais que dès l'aurore j'entende ta miséricorde; car j'ai espéré en toi. Fais-moi connaître, Seigneur, la voie où je dois marcher; car j'ai élevé vers toi mon âme."],["psalms",83,11,"Car un seul jour dans tes parvis est meilleur qu'un millier de jours; j'ai mieux aimé être humble dans la saison de Dieu que d'habiter sous les tentes des pécheurs;"],["psalms",22,1,"Le Seigneur est mon pasteur, et je ne manquerai de rien.","Le Seigneur est mon berger, et je ne manquerai de rien."],["psalms",90,2,"Il dira au Seigneur: tu es mon champion et mon refuge, ô mon Dieu. J'espèrerai en lui;"],["isaiah",41,10,"Ne crains pas, car je suis avec toi; ne t'égare pas, car je suis ton Dieu; c'est moi qui t'ai fortifié, moi qui t'ai secouru, et t'ai affermi par la justice de ma droite."],["psalms",145,5,"Heureux celui qui a pour champion le Dieu de Jacob, son espérance dans le Seigneur son Dieu,"],["john",6,35,"Jésus leur dit: Je suis le pain de vie. Celui qui vient à moi n'aura jamais faim, et celui qui croit en moi n'aura jamais soif."],["galatians",5,22,"Mais le fruit de l'Esprit, c'est l'amour, la joie, la paix, la patience, la bonté, la bénignité, la fidélité, la douceur, la tempérance;"],["isaiah",58,11,"Et Dieu sera toujours avec toi; et tu seras rassasié selon les désirs de ton âme; et tes os seront pleins de moelle; ils seront comme un verger arrosé, comme une fontaine où l'eau ne tarit jamais."],["joshua",1,9,"Voici ce que je te commande: Sois fort et agis en homme; n'aie point de faiblesse, point de crainte, car le Seigneur ton Dieu sera avec toi partout ou tu iras.","Voici ce que je te commande: Sois fort et agis en homme; n'aie pas de faiblesse, pas de crainte, car le Seigneur ton Dieu sera avec toi partout ou tu iras."],["matthew",22,39,"Et voici le second, qui lui est semblable: Tu aimeras ton prochain comme toi-même."],["psalms",90,11,"Car il a donné des ordres à ses anges, pour qu'ils te gardent en toutes tes voies."],["1-corinthians",16,14,"Que tout ce que vous faites se fasse avec charité!"],["colossians",3,23,"Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes,"],["psalms",83,2,"Que tes tabernacles sont aimables. Seigneur, Dieu des armées!","Que tes tentes sacrées sont aimables. Seigneur, Dieu des armées!"],["luke",6,37,"Ne jugez point, et vous ne serez point jugés; ne condamnez point, et vous ne serez point condamnés; absolvez, et vous serez absous.","Ne jugez pas, et vous ne serez pas jugés; ne condamnez pas, et vous ne serez pas condamnés; absolvez, et vous serez absous."],["1-john",3,18,"Petits enfants, n'aimons pas en paroles et avec la langue, mais en actions et avec vérité."],["ecclesiastes",3,1,"Il y a temps pour tout, et toute chose sous le ciel a son moment."],["isaiah",40,31,"Mais ceux qui attendent le Seigneur trouveront des forces nouvelles; il leur poussera des ailes comme aux aiglons; ils courront, et ne seront point fatigués; ils marcheront, et n'auront pas faim.","Mais ceux qui attendent le Seigneur trouveront des forces nouvelles; il leur poussera des ailes comme aux aiglons; ils courront, et ne seront pas fatigués; ils marcheront, et n'auront pas faim."],["ephesians",1,7,"En lui nous avons la rédemption par son sang, la rémission des péchés, selon la richesse de sa grâce,","En lui nous avons la rédemption par son sang, le pardon des péchés, selon la richesse de sa grâce,"],["matthew",17,20,"C'est à cause de votre incrédulité, leur dit Jésus. Je vous le dis en vérité, si vous aviez de la foi comme un grain de sénevé, vous diriez à cette montagne: Transporte-toi d'ici là, et elle se transporterait; rien ne vous serait impossible."],["joel",2,13,"Déchirez vos cœurs, et non vos vêtements. Et convertissez-vous au Seigneur votre Dieu, parce qu'Il est plein de clémence et de compassion, patient, abondant en miséricorde, et repentant des maux qu'Il fait en punissant."],["ephesians",2,8,"Car c'est par la grâce que vous êtes sauvés, par le moyen de la foi. Et cela ne vient pas de vous, c'est le don de Dieu."],["psalms",120,8,"Le Seigneur te gardera, que tu entres ou que tu sortes, dès maintenant et dans les siècles des siècles."],["matthew",5,10,"Heureux ceux qui sont persécutés pour la justice, car le royaume des cieux est à eux!"],["psalms",117,1,"Alléluiah! Rendez gloire au Seigneur, parce qu'il est bon, et que sa miséricorde est éternelle."],["matthew",11,29,"Prenez mon joug sur vous et recevez mes instructions, car je suis doux et humble de cœur; et vous trouverez du repos pour vos âmes."],["philippians",4,6,"Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces.","Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des prières, avec des actions de grâces."],["joel",3,1,"Et ensuite, voici ce qui arrivera: Je répandrai Mon Esprit sur toute chair; et vos fils prophétiseront, et vos anciens auront des songes, et vos jeunes hommes des visions.","Et ensuite, voici ce qui arrivera: Je répandrai Mon Esprit sur toute chair; et vos fils prophétiseront, et vos anciens auront des rêves, et vos jeunes hommes des visions."],["psalms",50,3,"Aie pitié de moi, Seigneur, selon ta grande miséricorde; et selon l'immensité de ta compassion, efface mon iniquité.","Aie pitié de moi, Seigneur, selon ta grande miséricorde; et selon l'immensité de ta compassion, efface ma faute."],["1-corinthians",15,55,"O mort, où est ta victoire? O mort, où est ton aiguillon?"],["proverbs",3,3,"Que la miséricorde et la foi ne te quittent point; mais attache-les à ton cou, et tu trouveras grâce.","Que la miséricorde et la foi ne te quittent pas; mais attache-les à ton cou, et tu trouveras grâce."],["1-john",4,8,"Celui qui n'aime pas n'a pas connu Dieu, car Dieu est amour."],["james",1,12,"Heureux l'homme qui supporte patiemment la tentation; car, après avoir été éprouvé, il recevra la couronne de vie, que le Seigneur a promise à ceux qui l'aiment."],["1-corinthians",13,13,"Maintenant donc ces trois choses demeurent: la foi, l'espérance, la charité; mais la plus grande de ces choses, c'est la charité."],["psalms",41,12,"O mon âme, pourquoi es-tu triste, et pourquoi me troubles-tu? Espère en Dieu; car je lui rendrai grâces, à lui le salut, à lui mon Dieu."],["psalms",125,5,"Ceux qui sèment dans les larmes récolteront dans l'allégresse.","Ceux qui sèment dans les larmes récolteront dans la joie."],["psalms",144,9,"Le Seigneur est doux pour ceux qui l'attendent, et ses miséricordes sont encore au-dessus de toutes ses œuvres."],["psalms",95,1,"Chantez au Seigneur un cantique nouveau; que toute la terre chante au Seigneur!","Chantez au Seigneur un chant nouveau; que toute la terre chante au Seigneur!"],["psalms",117,14,"Le Seigneur est ma force et ma louange; c'est lui qui m'a sauvé."],["1-timothy",6,12,"Combats le bon combat de la foi, saisis la vie éternelle, à laquelle tu as été appelé, et pour laquelle tu as fait une belle confession en présence d'un grand nombre de témoins."],["2-corinthians",9,7,"Que chacun donne comme il l'a résolu en son cœur, sans tristesse ni contrainte; car Dieu aime celui qui donne avec joie."],["numbers",6,24,"Que le Seigneur te bénisse et le garde."],["psalms",118,11,"J'ai renfermé dans le secret de mon cœur toutes tes paroles pour ne point pécher contre toi.","J'ai renfermé dans le secret de mon cœur toutes tes paroles pour ne pas pécher contre toi."],["isaiah",61,1,"L'Esprit du Seigneur est sur moi; c'est pourquoi il m'a consacré de son onction; il m'a envoyé pour évangéliser les pauvres, guérir les cœurs contrits, annoncer aux captifs la délivrance, et aux aveugles la vue;"],["luke",19,10,"Car le Fils de l'homme est venu chercher et sauver ce qui était perdu."],["acts",1,8,"Mais vous recevrez une puissance, le Saint-Esprit survenant sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu'aux extrémités de la terre."],["1-corinthians",13,7,"elle excuse tout, elle croit tout, elle espère tout, elle supporte tout."],["romans",8,28,"Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son dessein.","Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son projet."],["titus",3,5,"il nous a sauvés, non à cause des œuvres de justice que nous aurions faites, mais selon sa miséricorde, par le baptême de la régénération et le renouvellement du Saint-Esprit,"],["james",1,19,"Sachez-le, mes frères bien-aimés. Ainsi, que tout homme soit prompt à écouter, lent à parler, lent à se mettre en colère;"],["2-corinthians",5,7,"car nous marchons par la foi et non par la vue,"],["psalms",41,2,"Comme le cerf désire les fontaines des eaux, ainsi mon âme te désire, ô mon Dieu!"],["john",6,37,"Tous ceux que le Père me donne viendront à moi, et je ne mettrai pas dehors celui qui vient à moi;"],["hosea",6,6,"parce que Je préfère la miséricorde aux sacrifices, et la connaissance de Dieu aux holocaustes.","parce que Je préfère la miséricorde aux sacrifices, et la connaissance de Dieu aux sacrifices brûlés."],["psalms",129,4,"Car la miséricorde est en toi; à cause de ton nom, je t'ai attendu, Seigneur. Mon âme a mis son attente en ta parole."],["colossians",2,6,"Ainsi donc, comme vous avez reçu le Seigneur Jésus-Christ, marchez en lui,"],["1-peter",3,15,"Mais sanctifiez dans vos cœurs Christ le Seigneur, étant toujours prêts à vous défendre, avec douceur et respect, devant quiconque vous demande raison de l'espérance qui est en vous,","Mais consacrez dans vos cœurs Christ le Seigneur, étant toujours prêts à vous défendre, avec douceur et respect, devant quiconque vous demande raison de l'espérance qui est en vous,"],["psalms",18,2,"Les cieux racontent la gloire du Seigneur, et le firmament fait connaître l'œuvre de ses mains."],["isaiah",9,5,"Car un petit enfant nous est né, et un fils nous a été donné; la principauté repose sur son épaule, et il est appelé de ce nom, l'Ange du grand conseil. Par lui j'amènerai la paix sur les princes, par lui la santé et la paix."],["acts",3,19,"Repentez-vous donc et convertissez-vous, pour que vos péchés soient effacés,"],["wisdom",7,26,"C'est la splendeur de la lumière éternelle, le miroir sans tache de la puissance de Dieu, et l'image de Sa bonté."],["luke",10,27,"Il répondit: Tu aimeras le Seigneur, ton Dieu, de tout ton cœur, de toute ton âme, de toute ta force, et de toute ta pensée; et ton prochain comme toi-même."],["psalms",85,5,"Seigneur, tu es bienveillant et doux, et tes miséricordes sont abondantes envers ceux qui t'invoquent."],["luke",1,47,"Et mon esprit se réjouit en Dieu, mon Sauveur,"],["philippians",4,4,"Réjouissez-vous toujours dans le Seigneur; je le répète, réjouissez-vous."],["psalms",112,3,"De l'Orient à l'Occident, le nom du Seigneur est digne de louange."],["luke",12,7,"Et même les cheveux de votre tête sont tous comptés. Ne craignez donc point: vous valez plus que beaucoup de passereaux.","Et même les cheveux de votre tête sont tous comptés. Ne craignez donc pas: vous valez plus que beaucoup de moineaux."],["psalms",102,1,"Ô mon âme, bénis le Seigneur, et que tout ce qui est en moi bénisse son saint nom."],["psalms",36,5,"Révèle au Seigneur ta voie; espère en lui, et il agira."],["1-peter",5,10,"Le Dieu de toute grâce, qui vous a appelés en Jésus-Christ à sa gloire éternelle, après que vous aurez souffert un peu de temps, vous perfectionnera lui-même, vous affermira, vous fortifiera, vous rendra inébranlables."],["proverbs",4,23,"Veille de toute ton attention sur ton cœur; car de là sort le principe de la vie."],["john",1,1,"Au commencement était la Parole, et la Parole était avec Dieu, et la Parole était Dieu."],["luke",6,31,"Ce que vous voulez que les hommes fassent pour vous, faites-le de même pour eux."],["1-peter",1,8,"lui que vous aimez sans l'avoir vu, en qui vous croyez sans le voir encore, vous réjouissant d'une joie ineffable et glorieuse,"],["isaiah",55,8,"Car mes conseils ne sont pas comme vos conseils, ni mes voies comme vos voies, dit le Seigneur."],["john",14,2,"Il y a plusieurs demeures dans la maison de mon Père. Si cela n'était pas, je vous l'aurais dit. Je vais vous préparer une place."],["psalms",150,6,"Que tout ce qui respire loue le Seigneur."],["john",14,15,"Si vous m'aimez, gardez mes commandements."],["psalms",110,10,"La crainte du Seigneur est le commencement de la sagesse; l'intelligence en est donnée à tous ceux qui la pratiquent; on le louera dans tous les siècles des siècles."],["isaiah",40,8,"Mais la parole de notre Dieu subsistera dans tous les siècles."],["2-timothy",2,13,"si nous sommes infidèles, il demeure fidèle, car il ne peut se renier lui-même."],["1-timothy",4,12,"Que personne ne méprise ta jeunesse; mais sois un modèle pour les fidèles, en parole, en conduite, en charité, en foi, en pureté."],["proverbs",15,1,"La colère perd même les sages: une réponse soumise détourne la fureur; un mot odieux l'excite."],["acts",17,28,"car en lui nous avons la vie, le mouvement, et l'être. C'est ce qu'ont dit aussi quelques-uns de vos poètes: De lui nous sommes la race…"],["romans",8,26,"De même aussi l'Esprit nous aide dans notre faiblesse, car nous ne savons pas ce qu'il nous convient de demander dans nos prières. Mais l'Esprit lui-même intercède par des soupirs inexprimables;"],["james",2,17,"Il en est ainsi de la foi: si elle n'a pas les œuvres, elle est morte en elle-même."],["psalms",138,14,"Je te rendrai gloire, parce que tes prodiges ont un éclat terrible; tes œuvres sont merveilleuses, et mon âme le sait bien.","Je te rendrai gloire, parce que tes miracles ont un éclat terrible; tes œuvres sont merveilleuses, et mon âme le sait bien."],["psalms",33,19,"Le Seigneur est près de ceux dont le cœur est affligé; il sauvera les humbles d'esprit."],["mark",16,15,"Puis il leur dit: Allez par tout le monde, et prêchez la bonne nouvelle à toute la création."],["psalms",126,1,"Si le Seigneur n'édifie la maison, ceux qui l'édifient travaillent en vain. Si le Seigneur ne garde la ville, celui qui la garde veille en vain."],["sirach",6,14,"Un ami fidèle est une protection puissante; celui qui le trouve a trouvé un trésor."],["isaiah",12,2,"Voici mon Dieu et mon Sauveur; je mettrai en lui ma confiance, et je serai sans crainte; parce que le Seigneur est ma gloire, il est ma louange, il est mon salut."],["psalms",17,2,"Et il a dit: Seigneur, je t'aimerai, toi qui es ma force."],["matthew",5,16,"Que votre lumière luise ainsi devant les hommes, afin qu'ils voient vos bonnes œuvres, et qu'ils glorifient votre Père qui est dans les cieux."],["psalms",33,5,"J'ai cherché le Seigneur, et il m'a exaucé; il m'a tiré de toutes mes afflictions.","J'ai cherché le Seigneur, et il m'a écouté; il m'a tiré de toutes mes souffrances."],["psalms",91,2,"Il est bon de proclamer le Seigneur, et de chanter ton nom, Dieu Très- Haut,"],["numbers",6,26,"Qu'il lève sur toi sa face, et qu'il t'accorde la paix."],["deuteronomy",31,6,"Sois fort et agis en homme, n'aie ni crainte ni faiblesse; ne te laisse pas frapper de stupeur devant elles, car le Seigneur ton Dieu, qui marche parmi nous, ne t'a point abandonné ni délaissé.","Sois fort et agis en homme, n'aie ni crainte ni faiblesse; ne te laisse pas frapper d'étonnement devant elles, car le Seigneur ton Dieu, qui marche parmi nous, ne t'a pas abandonné ni abandonné."],["matthew",5,7,"Heureux les miséricordieux, car ils obtiendront miséricorde!"],["1-peter",4,8,"Avant tout, ayez les uns pour les autres une ardente charité, car La charité couvre une multitude de péchés."],["isaiah",55,6,"Cherchez le Seigneur, et, quand vous l'aurez trouvé, invoquez-le. Et lorsqu'il sera près de vous,"],["luke",18,27,"Jésus répondit: Ce qui est impossible aux hommes est possible à Dieu."],["psalms",89,12,"Manifeste-nous donc ta droite, et instruis nos cœurs dans la sagesse."],["2-corinthians",1,3,"Béni soit Dieu, le Père de notre Seigneur Jésus-Christ, le Père des miséricordes et le Dieu de toute consolation,"],["james",1,17,"toute grâce excellente et tout don parfait descendent d'en haut, du Père des lumières, chez lequel il n'y a ni changement ni ombre de variation."],["ecclesiastes",12,13,"Écoute la conclusion, le résumé de ce discours; crains Dieu, et garde Ses commandements, car c'est là tout l'homme."],["tobit",12,8,"Précieuse est la prière unie au jeûne, à l'aumône et à la justice. Mieux vaut la médiocrité avec la justice que l'abondance avec l'iniquité; mieux vaut faire l'aumône qu'amasser de l'or.","Précieuse est la prière unie au jeûne, au don aux pauvres et à la justice. Mieux vaut la médiocrité avec la justice que l'abondance avec la faute; mieux vaut faire un don aux pauvres qu'amasser de l'or."],["matthew",5,14,"Vous êtes la lumière du monde. Une ville située sur une montagne ne peut être cachée;"],["genesis",1,1,"Au commencement Dieu créa le ciel et la terre."],["john",20,29,"Parce que tu m'as vu, tu as cru. Heureux ceux qui n'ont pas vu, et qui ont cru!"],["mark",1,15,"Il disait: Le temps est accompli, et le royaume de Dieu est proche. Repentez-vous, et croyez à la bonne nouvelle."],["1-john",3,1,"Voyez quel amour le Père nous a témoigné, pour que nous soyons appelés enfants de Dieu! Et nous le sommes. Si le monde ne nous connaît pas, c'est qu'il ne l'a pas connu."],["ruth",1,16,"Et Ruth dit: Ne me parle plus de m'éloigner de toi et de t'abandonner, parce qu'où tu iras, j'irai; où tu demeureras, je demeurerai; ton peuple est mon peuple, ton Dieu est mon Dieu;"],["exodus",33,14,"Et le Seigneur répondit: Moi-même je marcherai devant toi et je te ferai trouver le repos."],["genesis",50,20,"Vous m'avez voulu du mal; mais Dieu m'a voulu du bien, afin qu'advînt ce qui est aujourd'hui et qu'un peuple nombreux fût nourri.","Vous m'avez voulu du mal; mais Dieu m'a voulu du bien, afin qu'advînt ce qui est aujourd'hui et qu'un peuple nombreux soit nourri."],["1-thessalonians",5,16,"Soyez toujours joyeux."],["psalms",15,11,"Tu m'as fait connaître les voies de la vie; tu me rempliras de joie par ton aspect; des délices éternelles sont à ta droite."],["galatians",6,9,"Ne nous lassons pas de faire le bien; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas."],["2-peter",3,9,"Le Seigneur ne tarde pas dans l'accomplissement de la promesse, comme quelques-uns le croient; mais il use de patience envers vous, ne voulant pas qu'aucun périsse, mais voulant que tous arrivent à la repentance."],["colossians",1,13,"qui nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du Fils de son amour,"],["proverbs",3,5,"Mets ta confiance en Dieu de tout ton cœur, et ne t'enorgueillis point de ta sagesse.","Mets ta confiance en Dieu de tout ton cœur, et ne t'enorgueillis pas de ta sagesse."],["psalms",72,26,"Ma chair et mon cœur ont défailli, ô Dieu de mon cœur, et Dieu est mon partage pour toujours.","Ma chair et mon cœur ont faibli, ô Dieu de mon cœur, et Dieu est mon partage pour toujours."],["matthew",28,20,"et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu'à la fin du monde."],["james",1,5,"Si quelqu'un d'entre vous manque de sagesse, qu'il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée."],["mark",10,27,"Jésus les regarda, et dit: Cela est impossible aux hommes, mais non à Dieu: car tout est possible à Dieu."],["matthew",6,34,"Ne vous inquiétez donc pas du lendemain; car le lendemain aura soin de lui-même. A chaque jour suffit sa peine."],["nahum",1,7,"Le Seigneur est doux pour ceux qui L'attendent au jour de la tribulation; Il connaît ceux qui Le révèrent.","Le Seigneur est doux pour ceux qui L'attendent au jour de l'épreuve; Il connaît ceux qui Le révèrent."],["matthew",11,28,"Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos."],["philippians",2,3,"Ne faites rien par esprit de parti ou par vaine gloire, mais que l'humilité vous fasse regarder les autres comme étant au-dessus de vous-mêmes.","Ne faites rien par esprit de parti ou par inutile gloire, mais que l'humilité vous fasse regarder les autres comme étant au-dessus de vous-mêmes."],["psalms",54,23,"Confie au Seigneur toutes tes inquiétudes, et lui-même te nourrira; il ne laissera pas le juste en une perpétuelle fluctuation."],["jeremiah",17,7,"Béni l'homme qui a mis sa confiance dans le Seigneur, le Seigneur sera son espoir."],["psalms",118,18,"Ote le voile de mes yeux, et je comprendrai les merveilles de ta loi."],["sirach",2,1,"Mon fils, si tu entreprends de servir le Seigneur, prépare ton âme à l'épreuve."],["isaiah",53,5,"Mais il avait été blessé pour nos péchés, il était brisé pour nos crimes; le châtiment qui devait nous rendre la paix est tombé sur lui; nous avons été guéris par ses meurtrissures.","Mais il avait été blessé pour nos péchés, il était brisé pour nos crimes; la punition qui devait nous rendre la paix est tombé sur lui; nous avons été guéris par ses blessures."],["psalms",33,2,"En tout temps je bénirai le Seigneur; sa louange sera en tout temps dans ma bouche."],["sirach",3,30,"L'eau éteint le feu le plus ardent, et l'aumône expie les péchés.","L'eau éteint le feu le plus ardent, et le don aux pauvres expie les péchés."],["malachi",3,6,"Car Je suis le Seigneur votre Dieu, et Je ne change pas."],["hosea",14,10,"Qui est sage et comprendra ces choses? Qui est savant et les connaîtra? Les voies du Seigneur sont étroites; les justes y marchent, les impies y trébucheront.","Qui est sage et comprendra ces choses? Qui est savant et les connaîtra? Les voies du Seigneur sont étroites; les justes y marchent, les méchants y trébucheront."],["ephesians",5,2,"et marchez dans la charité, à l'exemple de Christ, qui nous a aimés, et qui s'est livré lui-même à Dieu pour nous comme une offrande et un sacrifice de bonne odeur."],["matthew",19,26,"Jésus les regarda, et leur dit: Aux hommes cela est impossible, mais à Dieu tout est possible."],["luke",22,42,"disant: Père, si tu voulais éloigner de moi cette coupe! Toutefois, que ma volonté ne se fasse pas, mais la tienne."],["psalms",144,18,"Le Seigneur est proche de ceux qui l'invoquent, de tous ceux qui l'invoquent en vérité."],["psalms",133,2,"Durant les nuits, levez vos mains vers le sanctuaire et bénissez le Seigneur."],["1-john",4,16,"Et nous, nous avons connu l'amour que Dieu a pour nous, et nous y avons cru. Dieu est amour; et celui qui demeure dans l'amour demeure en Dieu, et Dieu demeure en lui."],["luke",1,37,"Car rien n'est impossible à Dieu."]];
function parisDay(d){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d||new Date()),g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g("year"),g("month")-1,g("day"))/864e5;}
const VDJ_BASE=Date.UTC(2026,10,22)/864e5;
function vdjToday(d){const n=VDJ.length,i=(((parisDay(d)-VDJ_BASE)%n)+n)%n;return VDJ[i];}
function bookBySlug(sl){for(const s of SECTIONS)for(const b of s.books)if(b.en.toLowerCase().replace(/ /g,"-")===sl)return b;return null;}
function vdjHTML(){const e=vdjToday(),b=bookBySlug(e[0]);if(!b)return"";const nm=e[0]==="psalms"?"Psaume":b.name,t=isOrig()||!e[4]?e[3]:e[4];
  return `<button class="vdj" id="vdj" data-day="${parisDay()}" aria-label="Verset du jour : ${esc(nm)} ${e[1]}:${e[2]}. Ouvrir le chapitre"><div class="vl">Verset du jour</div><div class="vr">${esc(nm)} ${e[1]}:${e[2]}</div><div class="vt">${esc(t)}</div><span class="vgo">📖 Lire le chapitre</span></button>`;}
function bindVdj(){const el=document.getElementById("vdj");if(!el)return;el.onclick=()=>{const e=vdjToday(),b=bookBySlug(e[0]);if(b)gotoVerse(b.en,e[1],e[2]);};}
function vdjCheck(){const el=document.getElementById("vdj");if(el&&+el.dataset.day!==parisDay()){el.outerHTML=vdjHTML();bindVdj();}}
let vdjTimer=null;
function vdjSchedule(){clearTimeout(vdjTimer);const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),g=t=>+p.find(x=>x.type===t).value;
  const left=(86400-(g("hour")*3600+g("minute")*60+g("second")))*1000+300;vdjTimer=setTimeout(()=>{vdjCheck();vdjSchedule();},Math.min(left,3600e3));}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){vdjCheck();vdjSchedule();}});
setInterval(vdjCheck,60e3);

async function litDownload(id){const b=litBook(id);if(!b||litDl[id])return;

  litDl[id]={pct:0};litRefreshStatus();let fail=0;
  try{const c=await caches.open(LIT_CACHE),tot=b.c.reduce((s,x)=>s+x[3],0);let done=0;
    for(const x of b.c){const u=litP()+x[0];
      if(!(await c.match(u))){try{const r=await fetch(u,{cache:"reload"});if(r.ok)await c.put(u,r);else fail++;}catch(e){fail++;}}
      done+=x[3];litDl[id].pct=Math.round(done/tot*100);const el=document.querySelector(`[data-litpct="${id}"]`);if(el)el.textContent=litDl[id].pct+"%";

function rnd(seed){let x=seed;return()=>{x=(x*16807)%2147483647;return x/2147483647;};}
function wrapLines(ctx,t,maxW){const w=t.split(/\s+/),L=[];let cur="";for(const x of w){const tryL=cur?cur+" "+x:x;if(ctx.measureText(tryL).width>maxW&&cur){L.push(cur);cur=x;}else cur=tryL;}if(cur)L.push(cur);return L;}
function drawVdj(cv,fk,sk){

    const r=rnd(7);for(let i=0;i<9;i++){const x=r()*W,y=H*(.15+r()*.85),rx=W*(.18+r()*.25),ry=rx*(.28+r()*.15),gg=c.createRadialGradient(x,y,0,x,y,rx);gg.addColorStop(0,"rgba(255,255,255,.5)");gg.addColorStop(1,"rgba(255,255,255,0)");c.save();c.translate(x,y);c.scale(1,ry/rx);c.translate(-x,-y);c.fillStyle=gg;c.beginPath();c.arc(x,y,rx,0,7);c.fill();c.restore();}}
  else if(sk==="nuit"){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1430");g.addColorStop(.6,"#1b2b5c");g.addColorStop(1,"#34407a");c.fillStyle=g;c.fillRect(0,0,W,H);
    const r=rnd(11),n=Math.round(W*H/9000);for(let i=0;i<n;i++){c.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;c.beginPath();c.arc(r()*W,r()*H,(.6+r()*1.8)*W/1080,0,7);c.fill();}}
  else{let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#fbf4e6");g.addColorStop(1,"#ecd9b5");c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle="rgba(176,137,62,.55)";c.lineWidth=Math.max(4,W*.006);const m=Math.min(W,H)*.035;c.strokeRect(m,m,W-2*m,H-2*m);}
  const [x0,y0,x1,y1]=F.a.map((v,i)=>v*(i%2?H:W)),aw=x1-x0,ah=y1-y0,{ref,text}=vdjInfo(),u=Math.min(W,H)/1080;
  const ink=dark?"#ffffff":"#6e1a24",sub=dark?"rgba(255,255,255,.92)":"#8a5a2b";
  c.textBaseline="alphabetic";c.textAlign="left";
  if(dark){c.shadowColor="rgba(5,20,60,.45)";c.shadowBlur=18*u;c.shadowOffsetY=3*u;}
  const lab=34*u,rs=48*u;c.font=`600 ${lab}px "Source Sans 3",sans-serif`;
  let size=Math.min(96*u*(W>H?1.15:1),aw/9),lines,lh;
  for(;size>18*u;size*=.94){c.font=`600 ${size}px "Cormorant Garamond",Georgia,serif`;lines=wrapLines(c,"« "+text+" »",aw);lh=size*1.22;if(lab*1.6+rs*1.7+lines.length*lh<=ah)break;}

  c.font=`600 ${size}px "Cormorant Garamond",Georgia,serif`;for(const l of lines){c.fillText(l,x0,y);y+=lh;}
  c.shadowColor="transparent";c.fillStyle=dark?"rgba(255,255,255,.8)":"#8a5a2b";c.textAlign="center";c.font=`600 ${26*u}px "Source Sans 3",sans-serif`;
  c.fillText("✠ La Sainte Bible copte",W/2,H-Math.min(W,H)*.06-(fk==="ios"||fk==="android"?H*.03:0));
}

  <li><b>Pendant la lecture, touche un verset</b> (ou plusieurs) : tu peux l'enregistrer dans « Mes versets » ❤️, le surligner en couleur ou le copier. La loupe 🔍 en haut permet de chercher un chapitre ou une phrase.</li>
  <li>Au début de chaque <b>étape</b>, tu as son but ; au début de chaque <b>livre</b>, une présentation (de quoi il parle, comment le lire, ce qu'il représente pour les Coptes) ; avant chaque <b>chapitre</b>, un résumé de ce qui va se passer.</li>
  <li>« Lire le chapitre » ouvre une page de lecture avec le texte complet. En bas, « Chapitre suivant » valide automatiquement le chapitre lu et t'emmène au suivant, même d'un jour à l'autre. Ta progression reste enregistrée dans ce navigateur.</li>
  <li>Avec « Mots d'aujourd'hui », les mots anciens ou difficiles sont remplacés par des mots courants qui gardent le sens du message : « iniquité » → « faute », « glaive » → « épée », « nuée » → « nuage », « ne… point » → « ne… pas »…</li>
  <li>Si tu rates un jour, ce n'est pas grave : reprends simplement là où tu en es.</li></ul></div>
  <div class="card guide"><h2>Le texte que tu lis</h2>
  <p><b>Ancien Testament : la Septante.</b> C'est la traduction grecque de l'Ancien Testament faite à Alexandrie, en Égypte, avant Jésus-Christ. C'est la Bible citée par les apôtres et celle sur laquelle repose la tradition de l'Église copte. Tu la lis dans la traduction française de Pierre Giguet (1872), en version révisée.</p>
  <p><b>Nouveau Testament : la Louis Segond (1910)</b>, la traduction française la plus répandue, faite sur le texte grec original.</p>
  <p>Ces deux traductions sont anciennes : certains mots peuvent sembler vieillis. Les explications avant chaque chapitre sont là pour t'aider.</p></div>
  <div class="card guide"><h2>Ce que contient le parcours</h2>
  <p>Tous les livres de la Bible copte : les livres que l'on trouve dans toutes les Bibles, plus <b>Tobie, Judith, Sagesse, Siracide, Baruch (avec la Lettre de Jérémie), 1 et 2 Maccabées</b>, les passages grecs d'<b>Esther</b>, <b>Daniel 13 et 14</b> (Suzanne, Bel et le dragon), le cantique des trois jeunes gens et le <b>Psaume 151</b>.</p>
  <p>La Septante complète contient aussi quelques textes (1 Esdras, 3 et 4 Maccabées, les Odes…) qui ne font pas partie de la liste des livres lus par l'Église copte : ils ne sont pas dans le parcours.</p></div>
  <div class="card guide"><h2>Pourquoi les numéros diffèrent parfois</h2>
  <p><b>Psaumes</b> : la Septante (et l'Agpeya) ont souvent un numéro de moins que les Bibles traduites de l'hébreu. « Aie pitié de moi, ô Dieu » est le Psaume 50 ici, 51 ailleurs. L'app indique les deux.</p>
  <p><b>Jérémie</b> : dans la Septante, les chapitres 25 à 51 sont dans un autre ordre et le texte est un peu plus court.</p>
  <p><b>Rois</b> : la Septante appelle les livres de Samuel et des Rois les « quatre livres des Règnes », et les Chroniques les « Paralipomènes ».</p></div>
  <div class="card guide"><h2>Les lectures de la messe copte</h2>
  <p>À chaque messe on lit : le <b>Boulos</b> (une lettre de Paul), le <b>Katholikon</b> (Jacques, Pierre, Jean ou Jude), le <b>Praxis</b> (Actes), puis le <b>Psaume</b> et l'<b>Évangile</b>. Avec ce parcours, tu connaîtras tous ces livres.</p></div>

const cStem=w=>w.length>6?w.slice(0,6):w.replace(/(es|s|x|e)$/,"");
const C_WEAK=new Set(["jesus","christ","israel","peuple","homme","hommes","fils","roi","grand","grande"]);
function cKeys(s){const all=[...new Set(cNorm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!C_STOP.has(w)))];const strong=all.filter(w=>!C_WEAK.has(w));return [...new Set((strong.length?strong:all).map(cStem))];}
function cPoints(text){return text.replace(/\s*\([^)]*\)/g,"").split(/\s*[;:.!?]\s+|\s*;\s*|,\s+(?:puis|et|mais)\s+/).map(s=>s.trim().replace(/[.;:,]+$/,"")).filter(s=>s.length>8);}
const C_OPEN=["Merci d'avoir pris ce temps pour écrire 🙏","C'est beau de mettre la Parole de Dieu dans tes propres mots 🙏","Merci pour ce que tu as écrit, chaque mot compte 🙏","Quelle bonne habitude d'écrire après ta lecture 🙏"];
function comprisFeedback(user,it){
  const pts=cPoints(it.text), uk=new Set(cKeys(user)), seen=[],more=[];
  pts.forEach(p=>{const k=cKeys(p); const hit=k.filter(x=>uk.has(x)).length; (hit>0&&(hit>=Math.min(2,k.length)||hit/k.length>=.34)?seen:more).push(p);});
  const words=user.trim().split(/\s+/).filter(Boolean).length, open=C_OPEN[(user.length+pts.length)%C_OPEN.length];
  let h=`<p class="cf-open">${open}</p>`;
  if(words<4) h+=`<p>Même une seule phrase, c'est déjà un vrai pas. Tu pourras en ajouter quand tu voudras.</p>`;
  if(seen.length) h+=`<p class="cf-k">✓ Ce que tu as bien retenu</p><ul>${seen.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
  if(more.length) h+=`<p class="cf-k">${seen.length?"➕ Pour compléter ce que tu as compris":"📖 Les points importants de ce chapitre, pour t'aider"}</p><ul>${more.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;

  return h;
}

function downloadIcs(){

async function setRemind(on){
  if(on&&notifSupport()&&Notification.permission!=="granted"){let r;try{r=await Notification.requestPermission();}catch(e){r="denied";}
    if(r!=="granted"){toast("Notifications refusées : utilise le rappel du calendrier");return false;}}

    :"L'application t'envoie une notification à l'heure choisie (si ta lecture du jour n'est pas faite). Elle marche quand l'application est ouverte ou en arrière-plan ; si elle est complètement fermée, seul le rappel du calendrier est sûr de sonner. Sur iPhone, il faut d'abord ajouter l'application à l'écran d'accueil.";
  document.getElementById("remTime").onchange=e=>{state.remind=Object.assign({},state.remind,{time:e.target.value||"20:00",last:""});save();remSync();toast("Heure du rappel : "+remTime());};

    if(Notification.permission!=="granted"){try{await Notification.requestPermission();}catch(e){}}
    if(Notification.permission!=="granted"){toast("Notifications refusées");bindReminder();return;}
    if(!(await showReminder(true)))toast("La notification n'a pas pu s'afficher");};
}

function showOnb(){onbStep=0;document.getElementById("onb").hidden=false;renderOnb();}

document.getElementById("onbNext").onclick=()=>{if(onbStep<ONB.length-1){onbStep++;renderOnb();}else closeOnb();};
