const FONT_FILES=["cormorant-garamond-latin-500-normal", "cormorant-garamond-latin-600-normal", "cormorant-garamond-latin-700-normal", "source-sans-3-latin-400-normal", "source-sans-3-latin-600-normal", "eb-garamond-latin-400-normal", "lora-latin-400-normal", "atkinson-hyperlegible-latin-400-normal", "nunito-latin-400-normal", "opendyslexic-latin-400-normal", "merriweather-latin-400-normal","crimson-pro-latin-400-normal","libre-baskerville-latin-400-normal","spectral-latin-400-normal","alegreya-latin-400-normal","playfair-display-latin-400-normal","cinzel-latin-400-normal","im-fell-english-latin-400-normal","unifrakturmaguntia-latin-400-normal","inter-latin-400-normal","open-sans-latin-400-normal","montserrat-latin-400-normal","raleway-latin-400-normal","quicksand-latin-400-normal","lexend-latin-400-normal","comic-neue-latin-400-normal","dancing-script-latin-400-normal","satisfy-latin-400-normal","caveat-latin-400-normal","kalam-latin-400-normal","patrick-hand-latin-400-normal","indie-flower-latin-400-normal","courier-prime-latin-400-normal"];
const OFF_CACHE="bible-copte-v12";
const DATA_PREFIX="";
function bookFiles(){const s=new Set();SECTIONS.forEach(x=>x.books.forEach(b=>s.add(DATA_PREFIX+b.en.toLowerCase().replace(/ /g,"-")+".json")));return [...s];}
let offlineOK=false;
try{ if("serviceWorker" in navigator && "caches" in window && (location.protocol==="https:"||location.hostname==="localhost") && !/claude|anthropic|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").then(()=>{offlineOK=true;}).catch(()=>{});
  offlineOK=true;
}}catch(e){}
async function offlineCount(){
  try{const c=await caches.open(OFF_CACHE);let n=0;for(const f of bookFiles()){if(await c.match(f))n++;}return n;}catch(e){return -1;}
}
async function offlineCard(){
  const box=document.getElementById("offbox"); if(!box) return;
  if(!offlineOK){box.innerHTML='<p class="small muted" style="margin:0">La lecture sans connexion fonctionne quand l\'app est ouverte depuis son adresse GitHub (ou installée sur l\'écran d\'accueil).</p>';return;}
  if(dlRun&&!box.closest("#offHome")){box.innerHTML=`<p style="margin:0 0 10px">Téléchargement de toute la Bible en cours…</p><button class="btn main" id="dlBtn" disabled>Téléchargement en cours…</button><div class="bar" style="margin-top:10px" id="dlBar"><i style="width:0"></i></div><p class="small muted" id="dlTxt" style="margin:6px 0 0"></p>`;return;}
  const tot=bookFiles().length, n=await offlineCount();
  if(!box.isConnected) return;
  if(n===tot){const home=box.closest("#offHome");
    if(home){box.innerHTML=`<p style="margin:0"><b>✓ Toute la Bible est téléchargée.</b> Tu peux lire sans connexion.</p>`;if(home.dataset.shown)setTimeout(()=>{home.style.transition="opacity .4s";home.style.opacity="0";setTimeout(()=>home.style.display="none",450);},2500);else home.style.display="none";return;}
    box.innerHTML=`<p style="margin:0 0 10px"><b>✓ Toute la Bible est téléchargée.</b> Tu peux lire sans connexion.</p><button class="btn ghost" id="dlBtn">🔄 Mettre à jour le téléchargement</button><div class="bar" style="margin-top:10px;display:none" id="dlBar"><i style="width:0"></i></div><p class="small muted" id="dlTxt" style="margin:6px 0 0"></p>`;
    box.querySelector("#dlBtn").onclick=downloadAll;return;}
  {const home=box.closest("#offHome");if(home)home.dataset.shown="1";}
  box.innerHTML=`<p style="margin:0 0 10px">Télécharge toute la Bible sur cet appareil (environ 7 Mo) pour lire même sans internet.${n>0?` <span class="muted small">(${n} livres sur ${tot} déjà téléchargés)</span>`:""}</p>
    <button class="btn main" id="dlBtn">⬇️ Tout télécharger</button><div class="bar" style="margin-top:10px;display:none" id="dlBar"><i style="width:0"></i></div><p class="small muted" id="dlTxt" style="margin:6px 0 0"></p>`;
  box.querySelector("#dlBtn").onclick=downloadAll;
}
let dlRun=null;
function dlUI(i,n,msg){const btn=document.getElementById("dlBtn"),bar=document.getElementById("dlBar"),txt=document.getElementById("dlTxt");
  if(btn){btn.disabled=!msg;btn.textContent=msg?"Réessayer":"Téléchargement en cours…";}
  if(bar){bar.style.display="block";bar.firstElementChild.style.width=(n?i/n*100:0)+"%";}
  if(txt)txt.textContent=msg||`${i} / ${n}`;}
async function downloadAll(){
  const home=document.getElementById("offHome");
  state.offChoice="oui";save();
  if(home){home.style.transition="opacity .35s,transform .35s";home.style.opacity="0";home.style.transform="scale(.97)";setTimeout(()=>home.remove(),360);
    toast("⬇️ Téléchargement lancé : tu peux continuer, je te préviens quand c'est fini");}
  if(dlRun)return dlRun;
  dlRun=(async()=>{
  const files=["./","index.html","manifest.json","logo.svg","favicon-32.png","apple-touch-icon.png","logo-192.png","logo-512.png"].concat(FONT_FILES.map(f=>""+f+".woff2")).concat(["voix.js","pdf.min.mjs","pdf.worker.min.mjs","coptic.woff2",DATA_PREFIX+"peres.json"]).concat(bookFiles());
  let fail=0;dlUI(0,files.length);
  try{
    const c=await caches.open(OFF_CACHE);
    for(let i=0;i<files.length;i++){
      try{const r=await fetch(files[i],{cache:"reload"}); if(r.ok){await c.put(files[i],r);} else fail++;}catch(e){fail++;}
      dlUI(i+1,files.length);
    }
  }catch(e){fail++;}
  dlRun=null;
  if(fail){const m=`${fail} fichier(s) n'ont pas pu être téléchargés. Vérifie ta connexion et réessaie dans ⚙️ Paramètres.`;dlUI(0,0,m);toast("⚠️ Téléchargement incomplet : réessaie dans Paramètres");}
  else {toast("✓ Toute la Bible est disponible sans connexion");offlineCard();}
  })();
  return dlRun;
}
// ---------- UI utils ----------
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600);}
function confirmBox(t,b,yes){const m=document.getElementById("modal");document.getElementById("mt").textContent=t;document.getElementById("mb").textContent=b;m.classList.add("on");
  document.getElementById("mno").onclick=()=>m.classList.remove("on");document.getElementById("myes").onclick=()=>{m.classList.remove("on");yes();};}
// ---------- Router ----------
function route(){
  hideGloss(); if(typeof ttsStop==='function'&&TTS.on) ttsStop(); if(document.getElementById('notepanel').classList.contains('open')) closeNotes();
  if(typeof clearSel==='function'&&!/^#lire-/.test(location.hash)){curRead=null;clearSel();}
  const h=(location.hash||"").slice(1);
  let m;
  if((m=h.match(/^jour-(\d+)$/))) viewDay(+m[1]);
  else if((m=h.match(/^lire-(\d+)-(\d+)$/))) viewRead(+m[1],+m[2]);
  else if((m=h.match(/^etape-(\d+)$/))) viewStep(+m[1]);
  else if(h==="plan") viewPlan();
  else if(h==="guide") viewGuide();
  else if(h==="liturgie") viewLiturgie();
  else if(h==="lit-spirituels") viewSpirit();
  else if(/^lit-[a-z-]+-\d+$/.test(h)){const m=/^lit-([a-z-]+)-(\d+)$/.exec(h);viewLitRead(m[1],+m[2]);}
  else if(/^lit-[a-z-]+$/.test(h)) viewLitBook(h.slice(4));
  else if(h==="verset-image") viewVdjImage();
  else if(h==="parametres") viewSettings();
  else if(h==="recherche") viewSearch();
  else if(h==="favoris") viewFavs();
  else viewHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
if(!state.onboarded) showOnb();
