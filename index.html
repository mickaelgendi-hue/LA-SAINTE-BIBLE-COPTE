S(4,"Ecclésiaste, Cantique et Isaïe","Voir les prophéties et t'encourager dans les difficultés",28,
"Tu connais maintenant l'histoire des rois : tu vas entendre les prophètes qui leur ont parlé. Tu passes de la réflexion sur le sens de la vie (Ecclésiaste) au chant de l'amour (Cantique), puis au grand prophète Isaïe, qui annonce le Messie plus clairement que tous les autres.");
B("Ecclésiaste","Ecclesiastes",
"Un sage (attribué à Salomon) cherche le sens de la vie « sous le soleil » : plaisirs, travail, richesses… tout est « vanité », comme une buée qui passe. Sa conclusion : craindre Dieu et garder ses commandements.",
"Ne te décourage pas devant son ton pessimiste : il montre honnêtement que sans Dieu, rien ne comble. Lis la fin (12,13) en premier pour avoir la clé.",
"",
["« Vanité des vanités, tout est vanité » ; rien de nouveau sous le soleil.",
"Plaisirs, grands travaux et richesses ne comblent pas le cœur.",
"« Il y a un temps pour tout » : naître et mourir, pleurer et rire.",
"Oppression, rivalité ; « deux valent mieux qu'un ».",
"Prudence dans les promesses à Dieu ; l'argent ne rassasie jamais.",
"Avoir des biens sans pouvoir en profiter.",
"Sagesse dans l'épreuve ; la fin d'une chose vaut mieux que son début.",
"Le mystère de la justice de Dieu.",
"Le même sort pour tous : profite de la vie que Dieu te donne.",
"Un peu de folie fait de gros dégâts ; sagesse pratique.",
"« Jette ton pain sur la surface des eaux » ; profite de ta jeunesse devant Dieu.",
"« Souviens-toi de ton Créateur aux jours de ta jeunesse » ; crains Dieu et garde ses commandements."]);
B("Cantique des Cantiques","Song of Songs",
"Un poème d'amour entre un bien-aimé et sa bien-aimée. L'amour humain est beau et voulu par Dieu.",
"La tradition de l'Église lit ce livre à deux niveaux : l'amour du couple, et l'amour entre Dieu et son peuple, le Christ et l'Église, le Christ et chaque âme. Lis-le comme une prière d'amour envers Dieu.",
"L'Église copte applique aussi beaucoup d'images du Cantique à la Vierge Marie dans ses chants (« jardin fermé, source scellée », 4,12).",
["La bien-aimée désire son bien-aimé.",
"« Je suis la rose de Saron » ; l'appel du printemps.",
"Elle cherche son bien-aimé la nuit ; le cortège de Salomon.",
"Le bien-aimé célèbre sa beauté ; « jardin fermé, source scellée ».",
"Elle hésite, il s'éloigne ; elle le cherche et le décrit.",
"Les retrouvailles.",
"Nouvelle louange de la bien-aimée.",
"« L'amour est fort comme la mort » ; les grandes eaux ne peuvent l'éteindre."]);
B("Isaïe","Isaiah",
"Isaïe a prophétisé à Jérusalem vers 740-700 avant Jésus-Christ. Il dénonce le péché du peuple mais annonce surtout le Messie : la vierge qui enfante (7), l'enfant Prince de la paix (9), le Serviteur souffrant (53). On l'appelle « le cinquième Évangile ».",
"Trois parties : ch. 1-39 = avertissements et jugement ; ch. 40-55 = consolation (« Consolez mon peuple ») ; ch. 56-66 = espérance future. Note chaque annonce du Christ : tu les reconnaîtras grâce aux Évangiles déjà lus.",
"Isaïe 19 annonce : « Béni soit l'Égypte, mon peuple » et un autel au milieu de l'Égypte. La tradition copte y voit la venue de la Sainte Famille et la naissance de l'Église d'Égypte (le monastère d'El-Muharraq est vu comme ce lieu « au milieu de l'Égypte »).",
["Israël rebelle ; Dieu rejette le culte hypocrite : « vos péchés seraient-ils comme l'écarlate… ».",
"Toutes les nations monteront à la montagne du Seigneur ; les épées changées en charrues.",
"Jugement sur Jérusalem et ses dirigeants.",
"Le Germe du Seigneur ; Sion purifiée.",
"Le chant de la vigne ; six malheurs.",
"Vision de Dieu : « Saint, Saint, Saint » (chanté à chaque messe) ; la braise sur les lèvres d'Isaïe.",
"« La vierge enfantera un fils, Emmanuel » (Dieu avec nous).",
"L'Assyrie va déferler ; Dieu, pierre d'achoppement.",
"« Un enfant nous est né… Prince de la paix. »",
"L'Assyrie, instrument de Dieu, sera jugée ; un reste reviendra.",
"Le rejeton de Jessé, rempli de l'Esprit ; le loup habitera avec l'agneau.",
"Chant de reconnaissance pour le salut.",
"Oracle contre Babylone.",
"La chute du roi de Babylone (« astre brillant, fils de l'aurore »).",
"Oracle sur Moab.",
"Moab (suite).",
"Damas et Israël du nord.",
"Oracle sur l'Éthiopie.",
"Oracle sur l'Égypte : « Béni soit l'Égypte, mon peuple » ; le Seigneur entre en Égypte, un autel au milieu du pays.",
"Isaïe marche dépouillé : signe contre l'Égypte et l'Éthiopie.",
"Chute de Babylone ; Édom ; l'Arabie.",
"Jérusalem ; Éliakim reçoit la clé de David.",
"Oracle sur Tyr.",
"Le jugement de toute la terre.",
"Un festin pour tous les peuples ; Dieu essuiera les larmes, la mort sera engloutie.",
"Chant de confiance : « tes morts revivront ».",
"La vigne du Seigneur protégée.",
"Avertissement ; la pierre angulaire posée en Sion.",
"Malheur à Jérusalem ; « ce peuple m'honore des lèvres, mais son cœur est loin de moi ».",
"Ne cherchez pas refuge en Égypte ; « dans le calme et la confiance sera votre force ».",
"Malheur à ceux qui comptent sur les chevaux de l'Égypte plutôt que sur Dieu.",
"Un roi juste ; l'Esprit répandu.",
"Le Seigneur délivre Sion.",
"Jugement sur les nations.",
"Le désert fleurira ; les aveugles verront, les boiteux sauteront.",
"Le roi d'Assyrie menace Jérusalem.",
"Prière du roi Ézéchias ; Jérusalem délivrée miraculeusement.",
"Ézéchias malade puis guéri ; l'ombre recule.",
"Ézéchias montre ses trésors à Babylone ; l'exil est annoncé.",
"« Consolez mon peuple » ; « une voix crie dans le désert » ; ceux qui espèrent reprennent des forces comme l'aigle.",
"« Ne crains pas, car je suis avec toi. »",
"Premier chant du Serviteur : « il ne brisera pas le roseau froissé ».",
"« Je t'ai appelé par ton nom, tu es à moi. »",
"Dieu est unique ; le ridicule des idoles.",
"Cyrus, choisi par Dieu ; « tout genou fléchira devant moi ».",
"Les idoles doivent être portées ; Dieu, lui, porte son peuple.",
"Chute de Babylone.",
"Dieu purifie Israël comme on affine l'argent.",
"Deuxième chant du Serviteur : lumière des nations ; « une mère peut-elle oublier son enfant ? ».",
"Troisième chant : le Serviteur ne se dérobe pas aux insultes.",
"Écoutez-moi ; Dieu console Sion.",
"« Qu'ils sont beaux les pieds du messager de bonnes nouvelles » ; début du 4e chant.",
"Le Serviteur souffrant : « il a été blessé pour nos péchés… par ses blessures nous sommes guéris ». La Passion du Christ, 700 ans avant.",
"Sion, la femme stérile, aura de nombreux enfants.",
"« Vous tous qui avez soif, venez » ; « mes pensées ne sont pas vos pensées ».",
"Les étrangers accueillis ; « ma maison sera une maison de prière pour tous les peuples ».",
"Dieu habite avec le cœur humble.",
"Le vrai jeûne : partager son pain, libérer les opprimés.",
"Les péchés nous séparent de Dieu ; le Rédempteur viendra.",
"« Lève-toi, resplendis ! » La gloire de Dieu sur Sion, les nations viennent à sa lumière.",
"« L'Esprit du Seigneur est sur moi… » (lu par Jésus à Nazareth, Luc 4).",
"« Ma joie est en elle » : Dieu se réjouit de son peuple.",
"Le vainqueur ; prière du peuple.",
"« Si tu déchirais les cieux… » ; nous sommes l'argile, tu es le potier.",
"De nouveaux cieux et une nouvelle terre.",
"« Le ciel est mon trône » ; toutes les nations verront ma gloire."]);

S(5,"Jérémie, Lamentations, Baruch, Ézéchiel","Expérimenter la repentance et voir la miséricorde de Dieu et sa justice",37,
"Deux prophètes de la grande catastrophe : la destruction de Jérusalem et l'exil à Babylone (587 av. J.-C.). Dieu avertit, punit, mais promet un cœur nouveau et une nouvelle alliance. C'est une école de repentance et d'espérance. Le livre de Baruch, présent dans la Bible copte, y trouve sa place après Jérémie.");
B("Jérémie","Jeremiah",
"Jérémie, jeune prêtre timide, est appelé à annoncer pendant 40 ans un message que personne ne veut entendre : Jérusalem va tomber. Il est rejeté, emprisonné, jeté dans une citerne. On l'appelle « le prophète qui pleure ».",
"Le livre n'est pas dans l'ordre chronologique : ne t'inquiète pas si tu te perds. Repère les « confessions » de Jérémie, où il crie sa souffrance à Dieu (ch. 11-20), et le sommet : la nouvelle alliance (ch. 38). Dans la Septante, les chapitres 25 à 51 ne sont pas dans le même ordre que dans les Bibles traduites de l'hébreu (les oracles contre les nations viennent plus tôt) et le texte est un peu plus court : c'est normal.",
"Jérémie a fini sa vie en Égypte (ch. 50-51) ; selon la tradition, il y est mort martyr. Dans la Bible copte, le livre de Baruch, son secrétaire, suit Jérémie et les Lamentations.",
["Appel de Jérémie : « avant de te former, je te connaissais » ; l'amandier et la marmite.",
"Israël a abandonné la source d'eau vive.",
"Appel au retour de l'épouse infidèle.",
"« Circoncisez votre cœur » ; l'invasion approche.",
"Pas un seul juste dans Jérusalem ?",
"« Paix, paix ! » disent-ils, et il n'y a pas de paix.",
"Discours au Temple : le Temple ne protège pas si l'on ne change pas de vie.",
"Le peuple ne revient pas ; « n'y a-t-il pas de baume en Galaad ? ».",
"Les larmes de Jérémie ; se glorifier seulement de connaître Dieu.",
"Les idoles vaines et le vrai Dieu.",
"L'alliance rompue ; complot contre Jérémie.",
"« Pourquoi les méchants réussissent-ils ? »",
"La ceinture pourrie ; les cruches.",
"Sécheresse ; prière du prophète.",
"Plainte de Jérémie ; Dieu le rassure.",
"Jérémie ne doit pas se marier : signe du malheur qui vient.",
"« Béni l'homme qui se confie dans le Seigneur » : comme un arbre près de l'eau.",
"Chez le potier : Dieu peut refaçonner son peuple.",
"La cruche brisée : signe du jugement.",
"Jérémie frappé et attaché ; « il y a dans mon cœur comme un feu dévorant ».",
"Réponse au roi Sédécias : la ville sera prise.",
"Avertissements aux rois de Juda.",
"Les mauvais bergers ; le Germe juste de David ; les faux prophètes.",
"Les deux paniers de figues.",
"Soixante-dix ans d'exil annoncés.",
"Jérémie menacé de mort, puis épargné.",
"Le joug : se soumettre à Babylone.",
"Le faux prophète Hanania brise le joug et meurt.",
"Lettre aux exilés : « recherchez la paix de la ville » ; « des projets de paix pour vous donner un avenir ».",
"Promesse de restauration.",
"La nouvelle alliance écrite dans les cœurs ; Rachel pleure ses enfants.",
"Jérémie achète un champ en pleine guerre : signe d'espérance.",
"Promesses de guérison ; le Germe de David.",
"Libération des esclaves, puis trahison.",
"La fidélité des Récabites.",
"Le roi brûle le rouleau ; Jérémie le fait réécrire.",
"Jérémie emprisonné.",
"Jeté dans une citerne, sauvé par Ébed-Mélek l'Éthiopien.",
"Chute de Jérusalem.",
"Jérémie libéré, reste au pays avec Guedalia.",
"Assassinat de Guedalia.",
"Le peuple demande conseil : Dieu dit de ne pas fuir en Égypte.",
"Ils partent quand même en Égypte, emmenant Jérémie.",
"Jérémie avertit les Juifs d'Égypte contre l'idolâtrie.",
"Parole de réconfort à Baruch.",
"Oracle sur l'Égypte.",
"Oracle sur les Philistins.",
"Oracle sur Moab.",
"Ammon, Édom, Damas, Élam.",
"Chute de Babylone.",
"Babylone (suite).",
"Récit de la chute de Jérusalem."]);
B("Lamentations","Lamentations",
"Cinq poèmes de deuil sur Jérusalem détruite, attribués à Jérémie. La douleur est immense, mais au milieu jaillit l'espérance : « Ses compassions se renouvellent chaque matin » (3,22-23).",
"Lis-les lentement, comme une prière dans les moments de deuil ou de chute. Le ch. 3 est le cœur du livre.",
"",
["Jérusalem seule comme une veuve.",
"La colère de Dieu sur Sion.",
"Au fond de la douleur : « ses compassions se renouvellent chaque matin, grande est ta fidélité ».",
"Les horreurs du siège.",
"Prière : « fais-nous revenir à toi, et nous reviendrons »."]);
B("Baruch","Baruch",
"Baruch était le secrétaire du prophète Jérémie (tu l'as croisé dans Jérémie 43 et 51). Ce livre contient une prière de repentance des exilés, un éloge de la Sagesse et des paroles de consolation pour Jérusalem. Le ch. 6 est la « Lettre de Jérémie » contre les idoles.",
"Lis-le comme la suite de Jérémie et des Lamentations : après la douleur, la repentance puis la consolation. Le verset 3,38 (la Sagesse « est apparue sur la terre et a vécu parmi les hommes ») a été lu par les Pères comme une annonce de l'Incarnation.",
"Baruch fait partie de la Bible copte, juste après Jérémie, mais il est absent des Bibles protestantes.",
["Le livre est lu aux exilés à Babylone ; début de la confession des péchés.",
"Prière de repentance : « nous avons péché, nous n'avons pas écouté ta voix ».",
"Éloge de la Sagesse : elle « est apparue sur la terre et a vécu parmi les hommes ».",
"La Sagesse, c'est la loi de Dieu ; Jérusalem console ses enfants exilés.",
"« Jérusalem, quitte ta robe de deuil, revêts la splendeur de la gloire de Dieu ! »",
"La Lettre de Jérémie : les idoles ne sont que du bois et de l'or, ne les craignez pas."],"Ba");
B("Ézéchiel","Ezekiel",
"Ézéchiel, prêtre déporté à Babylone, reçoit des visions impressionnantes : la gloire de Dieu, son départ du Temple, puis son retour. Il annonce un cœur nouveau, la vie rendue aux ossements secs et un Temple nouveau.",
"Les visions peuvent paraître étranges : ne bloque pas sur les détails. Ch. 1-24 = jugement sur Jérusalem ; 25-32 = les nations ; 33-48 = espérance. Les sommets : ch. 34 (le bon berger), 36 (cœur nouveau), 37 (les ossements).",
"La « porte fermée » par où seul le Seigneur passe (44,1-2) est chantée dans la Théotokie copte comme image de la virginité perpétuelle de Marie.",
["Vision de la gloire de Dieu : les quatre êtres vivants et le trône.",
"Appel d'Ézéchiel.",
"Il mange le rouleau ; Dieu l'établit sentinelle d'Israël.",
"Actions symboliques du siège de Jérusalem.",
"Les cheveux coupés : le sort de Jérusalem.",
"Contre les montagnes des idoles.",
"La fin arrive.",
"Les abominations dans le Temple.",
"Une marque sur ceux qui pleurent le péché.",
"La gloire de Dieu quitte le Temple.",
"Promesse d'un cœur nouveau ; la gloire quitte la ville.",
"Le signe de l'exil.",
"Contre les faux prophètes.",
"Noé, Daniel et Job.",
"Le bois de la vigne inutile.",
"Jérusalem, épouse infidèle, et la fidélité de Dieu.",
"Les aigles et le cèdre.",
"Chacun est responsable : « je ne prends pas plaisir à la mort du méchant, mais à ce qu'il se convertisse et vive ».",
"Lamentation sur les princes.",
"L'histoire des révoltes d'Israël.",
"L'épée du Seigneur.",
"Les péchés de Jérusalem ; personne pour se tenir sur la brèche.",
"Deux sœurs infidèles.",
"La marmite ; mort de la femme d'Ézéchiel.",
"Ammon, Moab, Édom, Philistins.",
"Oracle sur Tyr.",
"Lamentation sur Tyr, le grand navire.",
"Le roi de Tyr ; Sidon.",
"Oracle sur l'Égypte.",
"L'Égypte (suite).",
"Le pharaon comme un cèdre abattu.",
"Lamentation sur le pharaon.",
"La sentinelle ; la nouvelle de la chute de Jérusalem.",
"Les mauvais bergers ; « Moi-même je ferai paître mes brebis ».",
"Contre Édom.",
"« Je vous donnerai un cœur nouveau et je mettrai en vous un esprit nouveau. »",
"Les ossements desséchés reprennent vie.",
"Gog et Magog.",
"Défaite de Gog.",
"Vision du nouveau Temple.",
"Le Temple (suite).",
"Les salles des prêtres.",
"La gloire de Dieu revient au Temple.",
"La porte fermée, par où seul le Seigneur passe ; les prêtres.",
"Partage du territoire ; offrandes.",
"Le culte du prince.",
"Le fleuve qui sort du Temple et donne la vie partout où il coule.",
"Partage entre les tribus ; la ville s'appelle « Le Seigneur est là »."]);

S(6,"Daniel et les 12 petits prophètes","La loyauté de Dieu, son armure pour nous et la justice sociale",27,
"Daniel montre la fidélité à Dieu en terre étrangère. Les 12 « petits » prophètes (petits par la taille, pas par l'importance) parlent de justice pour les pauvres, de repentance et de l'amour obstiné de Dieu. Dans la Bible copte, Daniel a 14 chapitres.");
B("Daniel","Daniel",
"Daniel et ses trois amis, déportés à Babylone, restent fidèles à Dieu malgré les menaces : la fournaise, la fosse aux lions. La seconde partie contient des visions sur l'avenir et le « Fils de l'homme » venant sur les nuées.",
"Ch. 1-6 = récits faciles et encourageants ; ch. 7-12 = visions plus difficiles (ne cherche pas à tout décoder). Jésus s'est appelé lui-même « Fils de l'homme » en référence à Daniel 7.",
"La Bible copte suit la version grecque de Daniel : le ch. 3 contient la prière d'Azarias et le cantique des trois jeunes gens (chanté comme 3e Hoos dans la Tasbeha), et le livre a deux chapitres de plus, Suzanne (13) et Bel et le dragon (14), absents des Bibles protestantes : tu les lis ici.",
["Daniel et ses amis à Babylone refusent la nourriture du roi et restent fidèles.",
"Le rêve de Nabuchodonosor : la statue et la pierre qui devient une montagne.",
"La fournaise : les trois jeunes gens sauvés, un quatrième marche avec eux. Dans la Bible copte : leur prière et leur long cantique de louange.",
"Le rêve de l'arbre ; Nabuchodonosor humilié puis reconnaissant Dieu.",
"Le festin de Balthazar : l'écriture mystérieuse sur le mur.",
"Daniel dans la fosse aux lions.",
"Vision des quatre bêtes ; le Fils de l'homme vient sur les nuées.",
"Le bélier et le bouc.",
"La prière de repentance de Daniel ; les soixante-dix semaines.",
"Vision au bord du Tigre.",
"Les rois du nord et du sud.",
"La fin des temps ; la résurrection des morts.",
"Suzanne, faussement accusée, sauvée par la sagesse du jeune Daniel (Bible copte).",
"Bel et le dragon : Daniel démasque les fausses idoles ; il est sauvé dans la fosse aux lions (Bible copte)."]);
B("Osée","Hosea",
"Dieu demande à Osée d'épouser une femme infidèle et de continuer à l'aimer : image vivante de l'amour de Dieu pour son peuple qui le trahit.",
"Lis-le comme une histoire d'amour blessé. Le ch. 11 montre Dieu comme un père tendre.",
"Osée 11,1 « D'Égypte j'ai appelé mon fils » est cité par Matthieu pour le retour de la Sainte Famille d'Égypte.",
["Osée épouse Gomer ; les noms symboliques de ses enfants.",
"Israël, épouse infidèle, sera reconquise par amour.",
"Osée rachète sa femme.",
"Il n'y a plus de connaissance de Dieu dans le pays.",
"Jugement sur les prêtres et les rois.",
"« Je veux la miséricorde et non les sacrifices. »",
"Israël, comme un gâteau mal cuit.",
"« Ils sèment le vent, ils récolteront la tempête. »",
"L'exil est annoncé.",
"« Semez la justice, récoltez la bonté. »",
"« D'Égypte j'ai appelé mon fils » ; l'amour paternel de Dieu.",
"Jacob ; appel au retour.",
"« Ô mort, où sont tes fléaux ? »",
"Appel au retour : Dieu guérit et aime gratuitement."]);
B("Joël","Joel",
"Une invasion de sauterelles devient l'image du « jour du Seigneur ». Joël appelle au jeûne et à la repentance, puis annonce le don de l'Esprit.",
"Pierre cite Joël 3 (2,28 dans d'autres Bibles) le jour de la Pentecôte (Actes 2) : relis ce passage après.",
"« Déchirez vos cœurs et non vos vêtements » (2,13) : un texte de jeûne et de repentance, dans l'esprit des jeûnes coptes.",
["Invasion de sauterelles : appel au jeûne.",
"Le jour du Seigneur ; « déchirez vos cœurs » ; « je répandrai mon Esprit » (la Pentecôte).",
"Jugement des nations ; Dieu habite en Sion."]);
B("Amos","Amos",
"Un berger envoyé dénoncer les riches qui écrasent les pauvres. Le prophète de la justice sociale.",
"Retiens 5,24 : « Que le droit coule comme l'eau, et la justice comme un torrent ». Dieu n'accepte pas une religion sans justice.",
"",
["Jugements sur les nations voisines.",
"Juda et Israël aussi sont jugés.",
"Quand Dieu parle, comme un lion rugit.",
"« Vous n'êtes pas revenus à moi. »",
"« Que le droit coule comme l'eau. »",
"Malheur à ceux qui vivent dans le luxe sans souci des autres.",
"Visions ; Amos face au prêtre Amatsia.",
"La corbeille de fruits ; une famine de la Parole de Dieu.",
"Restauration de la maison de David."]);
B("Abdias","Obadiah",
"Le plus court livre de l'Ancien Testament : jugement sur Édom, qui s'est réjoui du malheur de son frère Juda.",
"Leçon simple : ne jamais se réjouir du malheur des autres.",
"",
["Jugement d'Édom pour sa trahison envers son frère ; le royaume sera au Seigneur."]);
B("Jonas","Jonah",
"Jonas fuit la mission de Dieu, est avalé par un grand poisson, puis prêche à Ninive, qui se repent. Mais Jonas est fâché que Dieu pardonne !",
"Le vrai sujet n'est pas le poisson, mais la miséricorde de Dieu pour tous. Jésus a fait des trois jours de Jonas dans le poisson le signe de sa propre résurrection.",
"Les Coptes jeûnent 3 jours en souvenir de la repentance de Ninive (le « jeûne de Ninive »), deux semaines avant le Grand Carême, et lisent le livre de Jonas pendant ces jours.",
["Jonas fuit ; la tempête ; il est avalé par le poisson.",
"Prière de Jonas dans le ventre du poisson.",
"Ninive se repent et jeûne ; Dieu pardonne.",
"Colère de Jonas ; la leçon du ricin : Dieu aime tous les peuples."]);
B("Michée","Micah",
"Contemporain d'Isaïe, Michée défend les petits contre les puissants et annonce que le Messie naîtra à Bethléem.",
"Garde 6,8 comme résumé de la vie avec Dieu : « pratiquer la justice, aimer la miséricorde et marcher humblement avec ton Dieu ».",
"",
["Jugement sur Samarie et Jérusalem.",
"Malheur à ceux qui oppriment.",
"Des dirigeants corrompus.",
"La paix messianique : les épées changées en charrues.",
"« Bethléem… de toi sortira celui qui doit régner » (la naissance de Jésus).",
"« Pratiquer la justice, aimer la miséricorde, marcher humblement avec ton Dieu. »",
"Espérance : Dieu jettera nos péchés au fond de la mer."]);
B("Nahum","Nahum",
"Annonce de la chute de Ninive, capitale cruelle de l'Assyrie (qui s'était repentie au temps de Jonas, puis était retombée).",
"Message : Dieu est patient, mais il ne laisse pas l'injustice impunie pour toujours. Il est un refuge pour ceux qui se confient en lui (1,7).",
"",
["Dieu est lent à la colère, mais juste ; un refuge au jour de la détresse.",
"La chute de Ninive.",
"Malheur à la ville sanguinaire."]);
B("Habacuc","Habakkuk",
"Habacuc ose demander à Dieu : « Pourquoi laisses-tu le mal ? » Dieu répond, et le prophète finit dans la confiance.",
"Un modèle pour prier avec nos questions. Le verset clé « le juste vivra par sa foi » (2,4) est repris par Paul.",
"",
["Pourquoi Dieu laisse-t-il le mal ? Première réponse de Dieu.",
"« Le juste vivra par sa foi. »",
"Prière : même si tout manque, « je me réjouirai dans le Seigneur »."]);
B("Sophonie","Zephaniah",
"Annonce du jour du Seigneur, puis d'un petit reste humble et d'un Dieu qui se réjouit de son peuple.",
"Lis lentement 3,17 : Dieu « exulte de joie à ton sujet ».",
"",
["Le jour du Seigneur approche.",
"Cherchez le Seigneur, vous les humbles.",
"Dieu se réjouira de toi avec des chants de joie."]);
B("Aggée","Haggai",
"Après le retour d'exil, le peuple a construit ses maisons mais laissé le Temple en ruine. Aggée l'appelle à remettre Dieu à la première place.",
"Question pour toi : qu'est-ce qui passe avant Dieu dans ma vie ?",
"",
["« Est-ce le temps d'habiter vos maisons pendant que ma maison est en ruine ? »",
"La gloire future du Temple sera plus grande."]);
B("Zacharie","Zechariah",
"Prophète du retour d'exil, avec de nombreuses visions et des annonces très précises de Jésus : le roi monté sur un âne, les trente pièces d'argent, celui qu'on a transpercé.",
"Ch. 1-8 = visions pour encourager la reconstruction ; ch. 9-14 = annonces du Messie. Note chaque passage cité dans la Passion.",
"",
["« Revenez à moi et je reviendrai à vous. »",
"Dieu sera une muraille de feu autour de Jérusalem.",
"Le grand prêtre Josué purifié ; le Germe.",
"Le chandelier : « ni par la puissance, ni par la force, mais par mon Esprit ».",
"Le rouleau volant ; la femme dans le panier.",
"Les chars ; la couronne du grand prêtre.",
"Le vrai jeûne : justice et miséricorde.",
"Jérusalem restaurée ; joie.",
"« Voici ton roi qui vient, humble, monté sur un âne » (les Rameaux).",
"Dieu rassemble son peuple.",
"Le berger rejeté, payé trente pièces d'argent.",
"« Ils regarderont vers celui qu'ils ont transpercé. »",
"Une source de purification ; « frappe le berger et les brebis seront dispersées ».",
"Le jour du Seigneur : il régnera sur toute la terre."]);
B("Malachie","Malachi",
"Le dernier prophète de l'Ancien Testament : il reproche un culte sans cœur et annonce le messager qui préparera la venue du Seigneur (Jean-Baptiste).",
"L'Ancien Testament se termine sur l'attente d'Élie : la page suivante de ta Bible, c'est Matthieu et Jean-Baptiste.",
"L'Église voit dans l'« offrande pure » offerte parmi toutes les nations (1,11) une annonce de l'Eucharistie.",
["Dieu aime son peuple ; des sacrifices sans cœur ; une offrande pure parmi toutes les nations.",
"Les prêtres infidèles ; la fidélité dans le mariage.",
"« J'envoie mon messager pour préparer le chemin » ; la dîme.",
"Le soleil de justice se lèvera ; Élie viendra."]);

S(7,"Esdras, Néhémie, Esther, Job","Développer ton état d'esprit face à la souffrance, la persévérance et le courage",18,
"Après l'exil, le peuple revient. Esdras et Néhémie rebâtissent malgré l'opposition. Esther risque sa vie pour son peuple. Job reste attaché à Dieu au cœur d'une souffrance qu'il ne comprend pas. Quatre leçons de courage.");
B("Esdras","Ezra",
"Après 70 ans d'exil, le roi perse Cyrus permet aux Juifs de rentrer. Ils rebâtissent le Temple malgré l'opposition. Plus tard, le prêtre Esdras vient enseigner la loi de Dieu.",
"Ch. 1-6 = reconstruction du Temple ; ch. 7-10 = Esdras et le renouveau spirituel. Voir comment Dieu touche le cœur des rois païens pour aider son peuple.",
"",
["Le roi Cyrus permet le retour des exilés.",
"Liste des familles qui reviennent.",
"L'autel rebâti ; fondations du Temple : joie et larmes.",
"Opposition ; les travaux s'arrêtent.",
"Les prophètes Aggée et Zacharie relancent les travaux.",
"Le Temple est achevé ; la Pâque célébrée.",
"Esdras, scribe de la loi, arrive à Jérusalem.",
"Le voyage d'Esdras ; jeûne pour demander la protection de Dieu.",
"Prière de confession d'Esdras.",
"Le peuple se repent."]);
B("Néhémie","Nehemiah",
"Néhémie, haut fonctionnaire du roi de Perse, obtient de rebâtir les murailles de Jérusalem. Il prie, organise et tient bon face aux moqueries et menaces : la muraille est finie en 52 jours.",
"Un modèle de foi en action : remarque comme Néhémie prie avant chaque décision.",
"",
["Néhémie apprend l'état de Jérusalem, pleure et prie.",
"Le roi l'envoie ; il inspecte les murailles la nuit.",
"Chacun reconstruit sa partie.",
"Opposition : travailler d'une main, tenir son arme de l'autre.",
"Néhémie défend les pauvres exploités.",
"Complots déjoués ; la muraille achevée en 52 jours.",
"Liste des familles revenues.",
"Esdras lit la loi au peuple : « la joie du Seigneur est votre force ».",
"Grande prière de confession.",
"Le peuple s'engage par écrit.",
"Les habitants de Jérusalem.",
"Dédicace joyeuse de la muraille.",
"Les réformes de Néhémie."]);
B("Esther","Esther",
"Esther, jeune juive devenue reine de Perse, risque sa vie pour sauver son peuple d'un massacre organisé par Haman. Dieu agit en coulisse.",
"Dans la version hébraïque, Dieu n'est jamais nommé ; dans la Septante, que tu lis ici, on entend aussi les prières de Mardochée et d'Esther. La question de Mardochée est pour toi aussi : « Qui sait si ce n'est pas pour un moment comme celui-ci que tu es là ? » (4,14).",
"La Bible copte suit la version grecque d'Esther, plus longue : elle contient le songe de Mardochée, les prières de Mardochée et d'Esther, et les textes des décrets du roi.",
["Le banquet du roi Assuérus ; la reine Vasthi destituée. (Septante : le livre s'ouvre sur un songe de Mardochée.)",
"Esther devient reine ; Mardochée déjoue un complot.",
"Haman obtient un décret pour exterminer les Juifs (Septante : texte de la lettre du roi).",
"Mardochée : « qui sait si ce n'est pas pour un moment comme celui-ci ? » ; trois jours de jeûne. (Septante : les prières de Mardochée et d'Esther.)",
"Esther se présente au roi au péril de sa vie, Dieu adoucit le cœur du roi ; Haman prépare une potence.",
"Le roi ne dort pas et honore Mardochée.",
"Esther dénonce Haman, qui est pendu.",
"Un nouveau décret protège les Juifs (Septante : texte de la lettre du roi).",
"Le peuple délivré ; la fête de Pourim.",
"La grandeur de Mardochée. (Septante : explication de son songe et note finale sur la traduction du livre.)"]);
B("Job","Job",
"Job, homme juste, perd tout : ses biens, ses enfants, sa santé. Ses amis disent qu'il a dû pécher ; Job crie son innocence et réclame une réponse de Dieu. Dieu lui répond enfin, du milieu de la tempête.",
"Ch. 1-2 et 42 = récit ; ch. 3-37 = longs dialogues en poésie (les amis ont souvent tort, même quand ils disent de belles phrases). Ne lis pas trop vite : le livre apprend que l'on peut crier à Dieu sans le quitter.",
"Le livre de Job est lu dans l'Église copte pendant la Semaine Sainte : Job y est vu comme une image du Christ souffrant et innocent.",
["Job, juste et riche, est éprouvé : il perd tout mais bénit Dieu.",
"Job frappé d'ulcères ; ses trois amis viennent et se taisent sept jours.",
"Job maudit le jour de sa naissance.",
"Éliphaz : un innocent a-t-il jamais péri ?",
"Éliphaz : heureux celui que Dieu corrige.",
"Job : mes amis m'ont déçu.",
"Job : la vie n'est qu'un souffle ; il se plaint à Dieu.",
"Bildad : Dieu ne fausse pas la justice.",
"Job : comment être juste devant Dieu ? Il voudrait un arbitre.",
"Job : pourquoi m'as-tu fait naître ?",
"Tsophar : repens-toi.",
"Job : la sagesse et la puissance de Dieu.",
"Job : « même s'il me tue, j'espérerai en lui ».",
"Job : l'homme né de la femme ; l'espoir d'une vie après la mort.",
"Éliphaz : tu détruis la piété.",
"Job : « vous êtes tous des consolateurs pénibles » ; mon témoin est au ciel.",
"Job : mon esprit se brise.",
"Bildad : le sort du méchant.",
"Job : « Je sais que mon Rédempteur est vivant ».",
"Tsophar : la joie du méchant est brève.",
"Job : pourtant les méchants réussissent.",
"Éliphaz accuse Job de fautes cachées.",
"Job : si seulement je savais où le trouver !",
"Job : les injustices du monde.",
"Bildad : comment l'homme serait-il pur devant Dieu ?",
"Job : la grandeur de Dieu dépasse tout.",
"Job maintient son innocence.",
"Où trouver la sagesse ? « La crainte du Seigneur, voilà la sagesse. »",
"Job se souvient de son bonheur passé.",
"Sa misère présente.",
"Le grand serment d'innocence de Job.",
"Élihou, un jeune homme, prend la parole.",
"Élihou : Dieu parle par les songes et par la souffrance.",
"Élihou : Dieu ne fait pas le mal.",
"Élihou : Dieu est au-dessus de nous.",
"Élihou : Dieu instruit par l'épreuve.",
"Élihou : la majesté de Dieu dans l'orage.",
"Dieu répond du milieu de la tempête : « Où étais-tu quand je fondais la terre ? »",
"Les animaux sauvages et la sagesse de Dieu.",
"Job se tait ; Béhémoth.",
"Léviathan.",
"Job se repent ; Dieu lui rend le double de ce qu'il avait."]);

S(0,"Tobie, Judith, Sagesse, Siracide, Maccabées","Les livres de la Bible copte : fidélité, sagesse et courage jusqu'au martyre",44,
"Ces livres font partie de la Bible copte (et orthodoxe), mais pas des Bibles protestantes. Tobie et Judith racontent la fidélité à Dieu dans l'épreuve ; Sagesse et Siracide complètent les Proverbes ; les Maccabées racontent la résistance du peuple face à la persécution, juste avant la venue du Christ. C'est le pont entre l'Ancien et le Nouveau Testament.");
B("Tobie","Tobit",
"Tobit, juif fidèle exilé à Ninive, devient aveugle. Son fils Tobie part en voyage, accompagné sans le savoir par l'archange Raphaël. Il épouse Sara, la délivre d'un démon et revient guérir son père.",
"Une histoire de famille pleine de tendresse : prière, aumône, respect des parents, mariage béni par Dieu. Note comment Dieu répond aux prières de Tobit et de Sara le même jour (ch. 3).",
"L'archange Raphaël est très vénéré dans l'Église copte, qui lui consacre des fêtes et des églises. La prière de Tobie et Sara (ch. 8) inspire la bénédiction des mariés.",
["Tobit, fidèle en exil à Ninive, enterre les morts malgré le danger.",
"Tobit devient aveugle.",
"Prières de Tobit et de Sara, désespérés ; Dieu envoie l'ange Raphaël.",
"Conseils de Tobit à son fils : l'aumône ; « ce que tu n'aimes pas, ne le fais à personne ».",
"Tobie part avec un compagnon : l'ange Raphaël, déguisé.",
"Le poisson du Tigre ; Raphaël parle de Sara.",
"Arrivée chez Ragouël ; mariage de Tobie et de Sara.",
"La prière des jeunes époux ; le démon est chassé.",
"Raphaël va chercher l'argent.",
"Les noces ; l'inquiétude des parents.",
"Le retour : Tobit retrouve la vue.",
"Raphaël se fait connaître : « je suis l'un des sept anges qui se tiennent devant le Seigneur ».",
"Le cantique de louange de Tobit.",
"Derniers conseils et mort de Tobit."],"Tb");
B("Judith","Judith",
"Le général Holopherne assiège la ville de Béthulie et le peuple veut se rendre. Judith, une veuve pieuse, prie, jeûne, puis entre dans le camp ennemi et sauve son peuple.",
"Un récit pour montrer que Dieu sauve par les faibles. Remarque que Judith commence par prier et jeûner avant d'agir (ch. 8-9).",
"",
["Le roi Nabuchodonosor fait la guerre.",
"Holopherne est envoyé conquérir l'Occident.",
"Les peuples se soumettent.",
"Israël se prépare et prie.",
"Akhior raconte l'histoire d'Israël à Holopherne.",
"Akhior est livré aux habitants de Béthulie.",
"Siège de Béthulie : le peuple veut se rendre.",
"Judith, veuve pieuse, reproche aux chefs de mettre Dieu à l'épreuve.",
"La prière de Judith.",
"Judith va au camp d'Holopherne.",
"Judith devant Holopherne.",
"Judith prie et jeûne dans le camp ennemi.",
"Judith tue Holopherne et revient à Béthulie.",
"Panique des Assyriens.",
"Victoire ; Judith est bénie par tout le peuple.",
"Le cantique de Judith."],"Jdt");
B("Sagesse","Wisdom",
"Écrit en grec à Alexandrie, en Égypte, peu avant Jésus-Christ. Il parle de l'immortalité de l'âme, de la sagesse de Dieu et de l'histoire de la sortie d'Égypte.",
"Le ch. 2 décrit le juste persécuté avec des mots qui annoncent la Passion de Jésus. Le ch. 3 est lu aux funérailles : « les âmes des justes sont dans la main de Dieu ».",
"Ce livre est né en Égypte, à Alexandrie, la ville de saint Marc. Les Pères d'Alexandrie, comme saint Athanase et saint Cyrille, l'ont beaucoup cité.",
["Aimez la justice ; Dieu n'a pas fait la mort.",
"Les impies : « profitons de la vie et persécutons le juste » (une annonce de la Passion).",
"« Les âmes des justes sont dans la main de Dieu. »",
"Le juste mort jeune n'a pas perdu sa vie.",
"Le jugement : les impies reconnaissent leur erreur.",
"Les rois doivent chercher la sagesse.",
"La sagesse, reflet de la lumière éternelle.",
"Salomon désire la sagesse comme une épouse.",
"Prière de Salomon pour recevoir la sagesse.",
"La sagesse dans l'histoire, d'Adam à Moïse.",
"La sagesse au désert ; « tu aimes tout ce qui existe ».",
"La patience et la miséricorde de Dieu.",
"La folie de ceux qui adorent la nature au lieu du Créateur.",
"Origine et folie des idoles.",
"Israël fidèle ; le potier qui fabrique des idoles.",
"Les plaies d'Égypte et les dons faits à Israël ; la manne.",
"Les ténèbres sur l'Égypte.",
"La nuit de la Pâque : « ta Parole toute-puissante s'élança du ciel ».",
"La mer Rouge ; la création renouvelée."],"Sg");
B("Siracide","Sirach",
"Aussi appelé « Ecclésiastique ». Jésus Ben Sira, sage de Jérusalem, rassemble des conseils sur la vie avec Dieu, la famille, l'amitié, la parole, l'argent. Son petit-fils l'a traduit en grec en Égypte.",
"Comme les Proverbes : prends une phrase par chapitre pour ta journée. Les ch. 44-50 font l'éloge des grands personnages que tu as rencontrés, d'Hénoch à Néhémie : un beau résumé de ta lecture.",
"Le prologue dit que le livre a été traduit en grec en Égypte. Le Siracide fait partie des lectures de prophéties de l'Église copte.",
["Toute sagesse vient du Seigneur ; la crainte du Seigneur.",
"« Mon fils, si tu viens servir le Seigneur, prépare-toi à l'épreuve. »",
"Honorer son père et sa mère ; l'humilité.",
"Aider le pauvre ; la sagesse éduque ses enfants.",
"Ne pas compter sur ses richesses ; ne pas tarder à revenir à Dieu.",
"L'amitié : « un ami fidèle est un puissant soutien, qui le trouve a trouvé un trésor ».",
"Conseils : humilité, famille, prêtres, pauvres.",
"Prudence dans les relations.",
"Conseils sur les voisins et les puissants.",
"Contre l'orgueil ; le vrai honneur.",
"Ne pas juger sur l'apparence ; tout vient de Dieu.",
"Faire le bien avec discernement.",
"Riches et pauvres ; choisir ses fréquentations.",
"Le bon usage des biens ; heureux qui médite la sagesse.",
"La liberté de l'homme : Dieu a mis devant toi l'eau et le feu.",
"Dieu voit tout et juge.",
"Dieu crée l'homme et lui donne sa loi ; appel à revenir.",
"Grandeur et miséricorde de Dieu ; la maîtrise de soi.",
"Maîtriser sa langue ; vraie et fausse sagesse.",
"Savoir se taire et parler au bon moment.",
"Fuir le péché comme un serpent.",
"Le paresseux ; l'amitié qu'on peut encore sauver.",
"Prière pour garder sa bouche et son cœur ; les serments.",
"Éloge de la Sagesse qui vient habiter en Israël.",
"Ce qui réjouit et ce qui attriste ; la famille.",
"La bonne épouse.",
"Le péché dans le commerce ; garder les secrets.",
"Pardonner pour être pardonné ; les dégâts de la langue.",
"Prêter, faire l'aumône, se porter garant.",
"Éduquer ses enfants ; la santé et la joie du cœur.",
"Les richesses ; la mesure à table et dans le vin.",
"Conduite au banquet ; craindre Dieu.",
"Dieu a fait toutes choses deux par deux.",
"La vanité des rêves ; Dieu refuse les sacrifices injustes.",
"Le vrai sacrifice ; Dieu écoute la prière du pauvre.",
"Prière pour Israël ; choisir son épouse.",
"Les vrais et les faux conseillers.",
"Honorer le médecin ; le deuil ; les métiers.",
"Le sage qui étudie l'Écriture ; louange des œuvres de Dieu.",
"Les misères de la vie ; ce qui vaut mieux que tout.",
"La mort ; la honte et la bonne réputation.",
"La gloire de Dieu dans la création.",
"Le soleil, la lune et les étoiles chantent sa gloire.",
"Éloge des ancêtres : Hénoch, Noé, Abraham, Isaac, Jacob.",
"Moïse, Aaron, Phinées.",
"Josué, Caleb, les juges, Samuel.",
"Nathan, David, Salomon.",
"Élie, Élisée, Ézéchias, Isaïe.",
"Josias, Jérémie, Ézéchiel, les douze prophètes, Néhémie.",
"Le grand prêtre Simon ; bénédiction.",
"Prière d'action de grâce de Ben Sira ; « venez à mon école »."],"Si");
B("1 Maccabées","1 Maccabees",
"Vers 170 avant Jésus-Christ, le roi grec Antiochus profane le Temple et interdit la foi juive. Le prêtre Mattathias et ses fils, dont Judas surnommé « Maccabée » (le marteau), se lèvent et libèrent Jérusalem.",
"Un livre d'histoire qui fait le lien entre Malachie et les Évangiles. Le ch. 4 raconte la purification du Temple : c'est la fête de la Dédicace où Jésus était présent (Jean 10,22).",
"",
["Antiochus Épiphane profane le Temple et persécute ceux qui restent fidèles.",
"Mattathias refuse de sacrifier aux idoles et se révolte.",
"Judas Maccabée prend la tête de la résistance.",
"Victoire ; le Temple est purifié et dédié à nouveau.",
"Campagnes contre les peuples voisins.",
"Mort d'Antiochus ; le sacrifice d'Éléazar.",
"Victoire sur Nicanor.",
"Alliance avec Rome.",
"Mort de Judas ; son frère Jonathan lui succède.",
"Jonathan devient grand prêtre.",
"Jonathan et les rois de Syrie.",
"Jonathan capturé par ruse.",
"Simon succède à Jonathan, qui est tué.",
"La paix sous Simon.",
"Le roi Antiochus VII.",
"Mort de Simon ; son fils Jean lui succède."],"1M");
B("2 Maccabées","2 Maccabees",
"Raconte une partie de la même histoire que 1 Maccabées, mais avec un regard spirituel : les martyrs, la prière pour les morts, la foi en la résurrection.",
"Le ch. 7 (la mère et ses sept fils martyrs) est un des textes les plus forts sur la foi en la résurrection avant Jésus.",
"Le livre commence par des lettres adressées aux Juifs d'Égypte. Le ch. 12 (prière et sacrifice pour les défunts) est à la base de la prière de l'Église pour les morts, très présente dans la liturgie copte.",
["Lettres aux Juifs d'Égypte sur la fête de la purification du Temple.",
"Jérémie cache l'arche et l'autel de l'encens (tradition).",
"Héliodore est frappé en voulant piller le Temple.",
"Le grand prêtre Jason impose les mœurs grecques.",
"Antiochus pille le Temple.",
"La persécution ; le martyre du vieil Éléazar.",
"Martyre d'une mère et de ses sept fils : « le Roi du monde nous ressuscitera ».",
"Victoires de Judas.",
"Mort d'Antiochus.",
"Purification du Temple.",
"Victoire sur Lysias.",
"Judas fait prier et offrir un sacrifice pour les soldats morts.",
"Campagne d'Antiochus Eupator.",
"Nicanor ; le courage de Razis.",
"Vision de Jérémie qui prie pour le peuple ; victoire sur Nicanor."],"2M");

S(11,"Lettres à Thessalonique, Timothée, Tite, Philémon","La persévérance, l'amour fraternel et le retour de Jésus",7,
"Des lettres plus courtes et très pratiques : attendre le retour du Christ en restant actif, et conseils de Paul à ses disciples Timothée et Tite pour guider l'Église.");
B("1 Thessaloniciens","1 Thessalonians",
"Une des premières lettres de Paul, à une jeune Église persécutée. Il les encourage et répond à leurs questions sur ceux qui sont morts avant le retour du Christ.",
"Lettre chaleureuse et simple. Retiens 5,16-18 : « Soyez toujours joyeux, priez sans cesse, rendez grâce en toute chose ».",
"",
["La foi, l'amour et l'espérance des Thessaloniciens.",
"Paul a pris soin d'eux comme une mère et un père.",
"Timothée apporte de bonnes nouvelles.",
"Vivre dans la sainteté ; la résurrection et le retour du Seigneur.",
"Le jour du Seigneur viendra comme un voleur ; « priez sans cesse »."]);
B("2 Thessaloniciens","2 Thessalonians",
"Certains croyaient que le jour du Seigneur était déjà arrivé et arrêtaient de travailler. Paul corrige : il faut persévérer et travailler.",
"Attendre le Christ ne veut pas dire rester les bras croisés.",
"",
["Persévérer dans les persécutions.",
"L'homme impie doit venir avant le retour du Christ.",
"« Si quelqu'un ne veut pas travailler, qu'il ne mange pas non plus. »"]);
B("1 Timothée","1 Timothy",
"Conseils de Paul à son disciple Timothée, responsable de l'Église d'Éphèse : la prière, les qualités des évêques et des diacres, les dangers de l'argent.",
"Les ch. 3 et 5 montrent l'organisation de l'Église dès le début (évêques, prêtres, diacres), comme dans l'Église copte aujourd'hui.",
"",
["Les fausses doctrines ; « le Christ est venu sauver les pécheurs, dont je suis le premier ».",
"Prier pour tous ; un seul médiateur entre Dieu et les hommes.",
"Qualités des évêques et des diacres ; le grand mystère de la piété.",
"Mises en garde ; « que personne ne méprise ta jeunesse ».",
"Les veuves et les prêtres.",
"L'amour de l'argent est la racine de tous les maux ; « combats le bon combat de la foi »."]);
B("2 Timothée","2 Timothy",
"La dernière lettre de Paul, en prison à Rome, juste avant son martyre. Son testament spirituel à Timothée.",
"Lis-la comme les dernières paroles d'un père. Le ch. 3 dit que « toute l'Écriture est inspirée de Dieu » : c'est exactement ce que tu fais en lisant chaque jour.",
"",
["Ne pas avoir honte de l'Évangile ; Dieu nous donne un esprit de force et d'amour.",
"Le bon soldat du Christ.",
"Des temps difficiles ; « toute l'Écriture est inspirée de Dieu ».",
"« J'ai combattu le bon combat, j'ai achevé la course, j'ai gardé la foi. »"]);
B("Tite","Titus",
"Conseils à Tite, chargé d'organiser l'Église en Crète : choisir de bons responsables et enseigner une vie droite à chacun.",
"Court et concret : la grâce de Dieu nous apprend à vivre autrement (2,11-12).",
"",
["Les qualités des responsables de l'Église.",
"Un enseignement pour chaque âge ; la grâce de Dieu s'est manifestée.",
"Sauvés par le bain de la nouvelle naissance (le baptême)."]);
B("Philémon","Philemon",
"Petite lettre personnelle : Paul demande à Philémon d'accueillir Onésime, son esclave fugitif devenu chrétien, « comme un frère bien-aimé ».",
"Une leçon de pardon et de fraternité : en Christ, les barrières sociales tombent.",
"",
["Paul intercède pour Onésime, esclave devenu frère bien-aimé."]);

S(12,"Hébreux, lettres catholiques et Apocalypse","La foi, la nature divine de Jésus et la fin du monde",14,
"Dernière étape ! Hébreux montre Jésus, vrai Dieu et grand prêtre. Les lettres de Jacques, Pierre, Jean et Jude donnent des conseils pour vivre la foi. L'Apocalypse termine la Bible par la victoire de l'Agneau et la Jérusalem céleste.");
B("Hébreux","Hebrews",
"Une lettre adressée à des chrétiens d'origine juive tentés de revenir en arrière. Elle montre que Jésus est supérieur à tout : aux anges, à Moïse, aux prêtres de l'Ancien Testament. Son sacrifice unique accomplit tous les sacrifices.",
"Maintenant que tu as lu le Lévitique, tout prend sens ! Le ch. 11 (les héros de la foi) résume ce que tu as lu de la Genèse à Samuel.",
"L'Église copte compte Hébreux parmi les 14 lettres de saint Paul et la lit dans le « Boulos » de la messe.",
["Le Fils, image de la gloire de Dieu, supérieur aux anges.",
"Jésus s'est fait semblable à nous pour nous sauver.",
"Jésus supérieur à Moïse ; « aujourd'hui, si vous entendez sa voix ».",
"Le repos de Dieu ; la Parole vivante ; un grand prêtre qui comprend nos faiblesses.",
"Le Christ, prêtre selon l'ordre de Melchisédek.",
"Persévérer ; l'espérance, ancre de l'âme.",

function BK(en){for(const s of SECTIONS)for(const b of s.books)if(b.en===en)return b;}
(function(){
  const ps=BK("Psalms"),H=[null,...ps.ch],n=[];
  for(let k=1;k<=151;k++){
    let t;

    else if(k===9) t="Action de grâce pour la justice de Dieu, puis : pourquoi Dieu semble-t-il loin quand le méchant triomphe ? (les Ps 9 et 10 des Bibles hébraïques forment ici un seul psaume)";
    else if(k<=112) t=H[k+1];
    else if(k===113) t="La sortie d'Égypte : la mer voit et s'enfuit ; puis « Non pas à nous, Seigneur, mais à ton nom la gloire » (Ps 114 et 115 hébreux réunis).";
    else if(k===114) t="« J'aime le Seigneur, car il entend la voix de ma prière » : un homme délivré de la mort.";
    else if(k===115) t="« J'ai cru, c'est pourquoi j'ai parlé » ; « que rendrai-je au Seigneur ? » ; la coupe du salut.";
    else if(k<=145) t=H[k+1];
    else if(k===146) t="Louez le Seigneur : il guérit les cœurs brisés et compte les étoiles.";
    else t="Jérusalem, loue le Seigneur : il envoie sa parole sur la terre.";
    n.push(t);
  }
  ps.ch=n;
  const je=BK("Jeremiah"),J=[null,...je.ch],m=[];
  const map={26:46,27:50,28:51,29:47,31:48};
  for(let k=1;k<=52;k++){
    if(k<=24||k===52) m.push(J[k]);
    else if(k===25) m.push("Soixante-dix ans de captivité annoncés ; puis oracle contre Élam.");
    else if(map[k]) m.push(J[map[k]]);
    else if(k===30) m.push("Oracles sur Édom, Ammon, les tribus d'Arabie et Damas.");
    else if(k===32) m.push("La coupe du vin de la colère de Dieu, que toutes les nations doivent boire.");
    else if(k<=50) m.push(J[k-7]);
    else m.push(J[44]+" Parole de réconfort à Baruch.");
  }
  je.ch=m;
  BK("Joel").ch=["L'invasion de sauterelles : appel au jeûne.",
    "Le jour du Seigneur ; « déchirez vos cœurs et non vos vêtements » ; Dieu rendra ce que les sauterelles ont mangé.",

    "Les prêtres infidèles ; la fidélité dans le mariage.",
    "« J'envoie mon messager pour préparer le chemin » ; la dîme ; le soleil de justice se lèvera ; Élie viendra."];
  const ex=BK("Exodus");
  ex.ch[35]="Les artisans se mettent au travail ; le peuple donne plus que nécessaire ; fabrication des vêtements des prêtres.";
  ex.ch[36]="Les tentures, le voile et le parvis du tabernacle.";
  ex.ch[37]="L'arche, la table, le chandelier, les autels et le bassin.";
  ex.ch[38]="Le compte de l'or, de l'argent et du bronze ; tout l'ouvrage est présenté à Moïse.";
  const alt={"1 Samuel":"1er livre des Règnes","2 Samuel":"2e livre des Règnes","1 Kings":"3e livre des Règnes","2 Kings":"4e livre des Règnes","1 Chronicles":"1er livre des Paralipomènes","2 Chronicles":"2e livre des Paralipomènes","Sirach":"Ecclésiastique","Song of Songs":"Cantique des Cantiques","Ezra":"2 Esdras (1re partie)","Nehemiah":"2 Esdras (2e partie)"};
  for(const k in alt) BK(k).alt=alt[k];
})();

<script>
// ---------- Plan ----------
let DAYS=[]; // {g, sec, items:[{book,c}]}
SECTIONS.forEach(s=>{s.origDays=s.days; s.all=[]; s.books.forEach(b=>b.ch.forEach((t,i)=>s.all.push({book:b,c:i+1,text:t}))); s.total=s.all.length;});
const TOTAL_CH=SECTIONS.reduce((a,s)=>a+s.total,0);
const ORIG_DAYS=SECTIONS.reduce((a,s)=>a+s.origDays,0);
function sectionDays(s,plan){
  if(!plan||plan.mode==="orig") return s.origDays;
  if(plan.mode==="cpd") return Math.ceil(s.total/plan.n);
  const D=plan.days; return Math.min(s.total,Math.max(1,Math.round(s.total/TOTAL_CH*D)));
}
function buildPlan(plan){
  DAYS=[];
  SECTIONS.forEach((s,si)=>{
    s.days=sectionDays(s,plan); s.firstDay=DAYS.length+1;
    const all=s.all,d=s.days;
    for(let i=0;i<d;i++){
      const items=plan&&plan.mode==="cpd"?all.slice(i*plan.n,(i+1)*plan.n):all.slice(Math.floor(i*all.length/d),Math.floor((i+1)*all.length/d));
      if(items.length) DAYS.push({g:DAYS.length+1,si,local:i+1,items});
    }
    s.days=DAYS.length-s.firstDay+1; s.lastDay=DAYS.length;
  });
}
// ---------- State ----------
const KEY="parcours-biblique-copte-v1";
let state={read:{}};
const isOrig=()=>state.orig!==false;

const ck=it=>it.book.en+"|"+it.c;
const isRead=it=>!!state.read[ck(it)];
const dayCount=d=>d.items.filter(isRead).length;
const dayDone=d=>dayCount(d)===d.items.length;
const nextDay=()=>DAYS.find(d=>!dayDone(d))||DAYS[DAYS.length-1];

// ---------- Helpers ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function rangeLabel(items){
  const parts=[];let cur=null;
  items.forEach(it=>{ if(cur&&cur.b===it.book){cur.e=it.c;} else {cur={b:it.book,s:it.c,e:it.c};parts.push(cur);} });
  return parts.map(p=>p.b.ch.length===1?p.b.name:(p.s===p.e?`${p.b.name} ${p.s}`:`${p.b.name} ${p.s}-${p.e}`)).join(" · ");
}
function heb(k){
  if(k<=8||(k>=148&&k<=150)) return String(k);
  if(k===9) return "9-10"; if(k<=112) return String(k+1);
  if(k===113) return "114-115"; if(k===114||k===115) return "116";
  if(k<=145) return String(k+1); if(k<=147) return "147"; return "";
}
const NT=new Set(["Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"]);

const cache={};
function getBook(en){
  const url=DATA_PREFIX+en.toLowerCase().replace(/ /g,"-")+".json";
  if(!cache[en]) cache[en]=fetch(url).then(r=>{if(!r.ok) throw new Error(r.status); return r.json();})
    .catch(async e=>{try{const c=await caches.open(OFF_CACHE);const r=await c.match(url);if(r) return r.json();}catch(_){} delete cache[en]; throw e;});
  return cache[en];
}

function stepCard(s){

  <div class="modebar"><button class="notebtn${cnote(b.en,it.c)?" has":""}" id="noteOpen" aria-label="Mes notes">📝 Notes</button><button class="notebtn" id="ttsOpen" aria-label="Écouter le chapitre" style="margin-right:auto;margin-left:6px">🔊 Écouter</button><button class="pillbtn ${isOrig()?"on":""}" data-m="1">Texte d'origine</button><button class="pillbtn ${isOrig()?"":"on"}" data-m="0">Mots d'aujourd'hui</button></div>
  <p class="small muted" style="margin:6px 0 0">Touche un mot <span class="gw">souligné</span> pour voir son explication.</p>

  <div class="card compris" id="compris"></div>
  <div class="card notecard" id="notePrev" ${cnote(b.en,it.c)?"":"hidden"}><div class="k">📝 Ma note sur ${esc(title)}</div><p id="notePrevT">${esc(cnote(b.en,it.c))}</p><button class="btn ghost" id="noteEdit2">Modifier</button></div>
  <button class="btn main" id="nextBtn" style="margin-top:14px">${nextIt?`✓ Lu · Chapitre suivant : ${esc(nextLbl)} →`:"✓ J'ai fini toute la Bible !"}</button>
  ${isLast&&nd?`<p class="small muted" style="text-align:center;margin:6px 0 0">C'est le dernier chapitre du jour ${g}. Le suivant commence le jour ${g+1}.</p>`:""}
  <div class="pager">${prevHref?`<a class="btn ghost" href="${prevHref}">← Précédent</a>`:""}<a class="btn ghost" href="#jour-${g}">Jour ${g}</a></div>`;

    const nt=NT.has(b.en), vs=ch[it.c-1]||[];
    document.getElementById("rt").innerHTML=vs.map(([n,t,m])=>{const k=vk(b.en,it.c,n),h=(state.hl||{})[k];return `<p class="vs${h?" hl-"+h:""}" data-v="${n}"><sup>${n}</sup>${glossify(isOrig()||!m?t:m)}${isFav(b.en,it.c,n)?'<span class="fav">❤️</span>':""}</p>`}).join("")+
      `<div class="src">${nt?SRC_NT:SRC_OT}${isOrig()?"":" Les mots anciens ou difficiles sont remplacés par des mots courants qui gardent le sens du message (« Texte d'origine » pour la traduction exacte)."}</div>`;
    curRead={b,c:it.c,vs};
    if(restoreY!=null){window.scrollTo(0,restoreY);restoreY=null;}
    document.querySelectorAll("#rt p.vs").forEach(p=>p.onclick=e=>{const g=e.target.closest&&e.target.closest(".gw");if(g){showGloss(g);return;}toggleSel(+p.dataset.v,p);});
    if(pendingVerse){const p=document.querySelector(`#rt p[data-v="${pendingVerse}"]`);pendingVerse=null;if(p){p.scrollIntoView({block:"center"});p.classList.add("flash");}}
  }).catch(()=>{document.getElementById("rt").innerHTML='<p class="err">Le texte n\'a pas pu se charger. Vérifie ta connexion, ou télécharge toute la Bible depuis l\'accueil pour lire sans internet.</p>';});
  render();

  document.getElementById("ttsOpen").onclick=()=>{if(typeof ttsStart==="function")ttsStart(null);else toast("La voix se charge, réessaie dans un instant.");};
  renderPeres(b,it.c);

  app.querySelectorAll(".pillbtn").forEach(p=>p.onclick=()=>{state.orig=p.dataset.m==="1";save();app.querySelectorAll(".pillbtn").forEach(q=>q.classList.toggle("on",q===p));render();});
  document.getElementById("nextBtn").onclick=()=>{
    const k=ck(it); state.read[k]=1; state.lastRead=localDay(); save();
    if(isLast&&dayDone(d)) toast(d.local===s.days?`Étape ${s.n} terminée ! Bravo 🙏`:`Jour ${g} terminé, que Dieu te bénisse 🙏`);

function viewGuide(){
  setNav("guide");
  app.innerHTML=`<div class="dayhead"><h1>Guide</h1></div>
  <div class="card guide" style="text-align:center"><button class="btn main" onclick="showOnb()">👋 Revoir la présentation de départ</button></div>
  <div class="card guide"><h2>Nouveautés</h2>
  <ul><li><b>✠ Ce qu'en disent les Pères</b> : sous chaque chapitre, une courte explication d'un Père de l'Église (saint Cyrille d'Alexandrie, saint Athanase, saint Éphrem, saint Jean Chrysostome, les Pères du désert…), avec son nom et la source. Il y en a pour environ 1 130 chapitres sur 1 329. Touche « sur le verset… » pour aller au verset.</li>
  <li>Ces textes viennent de traductions anciennes libres de droits. Les livres du <b>pape Chenouda III</b> sont encore protégés par le droit d'auteur et on ne peut pas vérifier une citation de lui pour chaque chapitre : l'app n'invente donc aucune citation. Pour lire le pape Chenouda, demande ses livres à ton église.</li>
  <li><b>🔊 Écouter</b> : une voix lit le chapitre à voix haute, verset par verset (le verset lu est surligné). Tu peux choisir la vitesse et la voix. Pour écouter un seul passage, touche un verset puis « 🔊 Écouter ».</li>
  <li><b>📝 Notes</b> : la feuille de notes s'ouvre maintenant sur le côté droit, le long du texte, sans le cacher. Touche un verset puis « 📝 Noter » pour écrire sur ce verset.</li>
  <li><b>⏰ Rappel</b> : directement sur l'accueil (ou dans Paramètres), choisis une heure. Le rappel du calendrier sonne même quand l'app est fermée ; la notification de l'app marche quand elle est ouverte ou en arrière-plan.</li>
  <li><b>💭 Ce que j'ai compris</b> : à la fin de chaque chapitre, si tu veux, écris avec tes mots ce que tu as compris. L'app te montre ce que tu as bien retenu et ce qui peut compléter, sans jamais juger. Ça marche sans internet.</li>
  <li><b>Polices</b> : 30 polices, rangées par genre (livres, anciennes, modernes, faciles à lire, manuscrites).</li></ul></div>
  <div class="card guide"><h2>Comment fonctionne l'app</h2>
  <ul><li>Chaque jour, ouvre le jour proposé sur l'accueil.</li>
  <li>L'ordre suit une logique : Jésus d'abord, puis la prière (Psaumes), ensuite l'histoire du peuple de Dieu dans l'ordre (de la Genèse à l'exil), puis les prophètes qui ont parlé pendant cette histoire, le retour d'exil, les livres propres à la Bible copte qui mènent jusqu'à Jésus, et enfin les dernières lettres et l'Apocalypse.</li>
  <li><b>Les mots difficiles sont soulignés en pointillé</b> : touche-les pour voir leur explication ou un mot plus simple. Ce petit dictionnaire est dans l'app : il marche aussi sans connexion.</li>
  <li>Le texte s'affiche d'abord dans sa <b>version d'origine</b>. Le bouton « Mots d'aujourd'hui » remplace les mots anciens par des mots courants.</li>
  <li><b>Police et taille du texte</b> : dans les paramètres (⚙︎), choisis parmi 8 polices (classique, livre ancien, moderne, très lisible, spéciale dyslexie…) et 4 tailles.</li>
  <li><b>📝 Notes</b> : pendant la lecture, ce bouton ouvre un panneau sur le côté pour écrire ce que tu veux sur le chapitre (ce que tu retiens, une prière, une question). Ta note s'enregistre toute seule, s'affiche sous le chapitre, et toutes tes notes sont dans « Mes versets ».</li>
  <li><b>Pendant la lecture, touche un verset</b> (ou plusieurs) : tu peux l'enregistrer dans « Mes versets » ❤️, le surligner en couleur ou le copier. La loupe 🔍 en haut permet de chercher un chapitre ou une phrase.</li>
  <li>Au début de chaque <b>étape</b>, tu as son but ; au début de chaque <b>livre</b>, une présentation (de quoi il parle, comment le lire, ce qu'il représente pour les Coptes) ; avant chaque <b>chapitre</b>, un résumé de ce qui va se passer.</li>
  <li>« Lire le chapitre » ouvre une page de lecture avec le texte complet. En bas, « Chapitre suivant » valide automatiquement le chapitre lu et t'emmène au suivant, même d'un jour à l'autre. Ta progression reste enregistrée dans ce navigateur.</li>
  <li>Avec « Mots d'aujourd'hui », les mots anciens ou difficiles sont remplacés par des mots courants qui gardent le sens du message : « iniquité » → « faute », « glaive » → « épée », « nuée » → « nuage », « ne… point » → « ne… pas »…</li>
  <li>Si tu rates un jour, ce n'est pas grave : reprends simplement là où tu en es.</li></ul></div>
  <div class="card guide"><h2>Le texte que tu lis</h2>
  <p><b>Ancien Testament : la Septante.</b> C'est la traduction grecque de l'Ancien Testament faite à Alexandrie, en Égypte, avant Jésus-Christ. C'est la Bible citée par les apôtres et celle sur laquelle repose la tradition de l'Église copte. Tu la lis dans la traduction française de Pierre Giguet (1872), en version révisée.</p>
  <p><b>Nouveau Testament : la Louis Segond (1910)</b>, la traduction française la plus répandue, faite sur le texte grec original.</p>
  <p>Ces deux traductions sont anciennes : certains mots peuvent sembler vieillis. Les explications avant chaque chapitre sont là pour t'aider.</p></div>
  <div class="card guide"><h2>Ce que contient le parcours</h2>
  <p>Tous les livres de la Bible copte : les livres que l'on trouve dans toutes les Bibles, plus <b>Tobie, Judith, Sagesse, Siracide, Baruch (avec la Lettre de Jérémie), 1 et 2 Maccabées</b>, les passages grecs d'<b>Esther</b>, <b>Daniel 13 et 14</b> (Suzanne, Bel et le dragon), le cantique des trois jeunes gens et le <b>Psaume 151</b>.</p>
  <p>La Septante complète contient aussi quelques textes (1 Esdras, 3 et 4 Maccabées, les Odes…) qui ne font pas partie de la liste des livres lus par l'Église copte : ils ne sont pas dans le parcours.</p></div>
  <div class="card guide"><h2>Pourquoi les numéros diffèrent parfois</h2>
  <p><b>Psaumes</b> : la Septante (et l'Agpeya) ont souvent un numéro de moins que les Bibles traduites de l'hébreu. « Aie pitié de moi, ô Dieu » est le Psaume 50 ici, 51 ailleurs. L'app indique les deux.</p>
  <p><b>Jérémie</b> : dans la Septante, les chapitres 25 à 51 sont dans un autre ordre et le texte est un peu plus court.</p>
  <p><b>Rois</b> : la Septante appelle les livres de Samuel et des Rois les « quatre livres des Règnes », et les Chroniques les « Paralipomènes ».</p></div>
  <div class="card guide"><h2>Les lectures de la messe copte</h2>
  <p>À chaque messe on lit : le <b>Boulos</b> (une lettre de Paul), le <b>Katholikon</b> (Jacques, Pierre, Jean ou Jude), le <b>Praxis</b> (Actes), puis le <b>Psaume</b> et l'<b>Évangile</b>. Avec ce parcours, tu connaîtras tous ces livres.</p></div>
  <p class="small muted" style="text-align:center">Pour changer ton rythme de lecture ou remettre ta progression à zéro, ouvre les paramètres (⚙︎ en haut à droite).</p>`;
}

  const l=w.toLowerCase();
  if(GLOSS[l]) return GLOSS[l];
  for(const s of ["s","x","e","es"]) if(l.endsWith(s)&&GLOSS[l.slice(0,-s.length)]) return GLOSS[l.slice(0,-s.length)];

  return GLOSS_AUTO[l]||null;

    const c=await caches.open(OFF_CACHE);
    for(let i=0;i<files.length;i++){
      try{const r=await fetch(files[i],{cache:"reload"}); if(r.ok){await c.put(files[i],r);ok++;} else fail++;}catch(e){fail++;}
      bar.firstElementChild.style.width=((i+1)/files.length*100)+"%"; txt.textContent=`${i+1} / ${files.length}`;
    }
  }catch(e){fail++;}
  if(fail){txt.textContent=`${fail} fichier(s) n'ont pas pu être téléchargés. Vérifie ta connexion et réessaie.`;btn.disabled=false;btn.textContent="Réessayer";}
  else {toast("✓ Toute la Bible est disponible sans connexion");offlineCard();}
}
// ---------- UI utils ----------
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600);}
function confirmBox(t,b,yes){const m=document.getElementById("modal");document.getElementById("mt").textContent=t;document.getElementById("mb").textContent=b;m.classList.add("on");
  document.getElementById("mno").onclick=()=>m.classList.remove("on");document.getElementById("myes").onclick=()=>{m.classList.remove("on");yes();};}
// ---------- Router ----------
function route(){
  hideGloss(); if(typeof ttsStop==='function'&&TTS.on) ttsStop(); if(document.getElementById('notepanel').classList.contains('open')) closeNotes();
  if(typeof clearSel==='function'&&!/^#lire-/.test(location.hash)){curRead=null;clearSel();}
  const h=(location.hash||"").slice(1);
  let m;
  if((m=h.match(/^jour-(\d+)$/))) viewDay(+m[1]);
  else if((m=h.match(/^lire-(\d+)-(\d+)$/))) viewRead(+m[1],+m[2]);
  else if((m=h.match(/^etape-(\d+)$/))) viewStep(+m[1]);
  else if(h==="plan") viewPlan();
  else if(h==="guide") viewGuide();
  else if(h==="parametres") viewSettings();
  else if(h==="recherche") viewSearch();
  else if(h==="favoris") viewFavs();
  else viewHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
if(!state.onboarded) showOnb();
</script>
