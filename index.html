<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Sainte Bible copte</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1e2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe2; --paper:#fffaf1; --ink:#2b1d14; --muted:#7a6656; --line:#e6d9c3;
  --wine:#7b1e2b; --wine2:#5c1520; --gold:#b8862f; --gold2:#e9d29c; --green:#3f6b3a;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Source Sans 3",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(circle at 20% 0%,#fbf4e6 0,transparent 60%),radial-gradient(circle at 100% 100%,#f0e4cf 0,transparent 50%);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 90px}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,239,226,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
header.top a{color:var(--wine);text-decoration:none}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--wine2)}
.brand svg{width:26px;height:26px}
.nav{margin-left:auto;display:flex;gap:4px}
.nav a{font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px}
.nav a.on{background:var(--wine);color:#fff}
h1,h2,h3{font-family:var(--serif);color:var(--wine2);line-height:1.15;margin:0}
h1{font-size:34px}
h2{font-size:26px}
h3{font-size:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin:14px 0;box-shadow:0 1px 0 rgba(0,0,0,.02),0 6px 18px -12px rgba(80,40,10,.25)}
.hero{text-align:center;padding:28px 6px 8px}
.hero .cross{width:54px;height:54px;margin:0 auto 8px;display:block}
.hero p{margin:8px auto 0;max-width:520px}
.bar{height:8px;background:#efe3cd;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:999px;transition:width .4s}
.stat{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.stat b{font-family:var(--serif);font-size:30px;color:var(--wine2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 16px var(--sans);cursor:pointer;text-decoration:none;transition:transform .08s,background .2s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--wine);color:#fff;width:100%}
.btn.main:hover{background:var(--wine2)}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--gold2)}
.btn.ghost:hover{background:#fbf1dc}
.btn.done{background:var(--green);color:#fff;width:100%}
.continue{border:1.5px solid var(--gold2);background:linear-gradient(180deg,#fffaf1,#fbf0dc)}
.continue .k{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.steps a{display:block;text-decoration:none;color:inherit}
.step{display:flex;gap:14px;align-items:center}
.num{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--wine2);background:#f4e6c8;border:1px solid var(--gold2)}
.num.full{background:var(--green);color:#fff;border-color:var(--green)}
.step .t{flex:1;min-width:0}
.step .t h3{font-size:20px}
.step .t p{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:#f4e6c8;color:#7a5a1e;margin-right:6px}
.daylist{list-style:none;margin:0;padding:0}
.daylist li a{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.daylist li:last-child a{border-bottom:0}
.dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--gold2);display:grid;place-items:center}
.dot.ok{background:var(--green);border-color:var(--green)}
.dot.half{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}
.dot svg{width:13px;height:13px}
.daylist .dn{font-weight:600;width:70px;flex:0 0 70px}
.daylist .dr{flex:1;color:var(--muted);font-size:15px}
.sec-intro{border-left:4px solid var(--gold);background:linear-gradient(180deg,#fff7e6,#fffaf1)}
.sec-intro .k,.book .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.book{border:1.5px solid var(--gold2)}
.book h2{margin:4px 0 10px}
.book .blk{margin-top:12px}
.book .blk b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--wine)}
.book .blk p{margin:3px 0 0}
.book .copte{background:#f7ecda;border-radius:12px;padding:10px 12px}
.ch{display:flex;gap:14px;align-items:flex-start}
.ch .body{flex:1;min-width:0}
.ch h3{font-size:23px}
.ch .ag{font-size:13px;color:var(--gold);font-weight:600;margin-left:6px;font-family:var(--sans)}
.ch .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ch p.sum{margin:2px 0 12px;font-size:17px}
.ch .links{display:flex;gap:8px;flex-wrap:wrap}
.ch .links a{font-size:14px;padding:8px 12px}
.check{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:2px solid var(--gold2);background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:18px;height:18px;opacity:0}
.check.on svg{opacity:1}
.ch.read h3{color:var(--green)}
.readbtn{margin-top:2px}
.text{margin:14px 0 4px;padding:16px 16px 12px;border-radius:12px;background:#fdf6e9;border:1px solid var(--line);font-family:var(--serif);font-size:20px;line-height:1.6;color:#2b1d14}
.text p{margin:0 0 6px}
.text sup{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--gold);margin-right:3px}
.text .src{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.text .err{font-family:var(--sans);font-size:15px;color:var(--wine)}
.modebar{display:flex;gap:6px;margin:16px 0 0}
.pillbtn{border:1.5px solid var(--gold2);background:transparent;color:var(--wine);font:600 13px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer}
.pillbtn.on{background:var(--wine);border-color:var(--wine);color:#fff}
.alt{font-size:14px;color:var(--muted);margin:-6px 0 4px;font-style:italic}
.ps151{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f9f1e2;font-family:var(--serif);font-size:19px;line-height:1.5}
.ps151 sup{font-family:var(--sans);font-size:11px;color:var(--gold);margin-right:3px}
.pray{font-family:var(--serif);font-size:19px;font-style:italic;color:#4a3426}
.pager{display:flex;gap:10px;margin-top:16px}
.pager .btn{flex:1}
.dayhead{padding:22px 0 4px}
.dayhead .k{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
details summary{cursor:pointer;font-weight:600;color:var(--wine)}
.guide p,.guide li{margin:6px 0}
.guide h2{margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(40,20,10,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--wine2);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:30px}
@media (max-width:480px){h1{font-size:29px}.nav a{padding:6px 8px;font-size:13px}.brand span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#accueil"><img src="logo.svg" alt="" width="30" height="30" style="border-radius:8px"><span>La Sainte Bible copte</span></a>
  <nav class="nav"><a href="#accueil" data-n="accueil">Accueil</a><a href="#plan" data-n="plan">Plan</a><a href="#guide" data-n="guide">Guide</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="card"><h3 id="mt">Confirmer</h3><p id="mb"></p><div class="pager"><button class="btn ghost" id="mno">Annuler</button><button class="btn main" id="myes">Oui</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const SECTIONS=[];
function S(_,title,theme,days,intro){SECTIONS.push({n:SECTIONS.length+1,title,theme,days,intro,books:[]});}
function B(name,en,resume,cle,copte,ch,aelf){SECTIONS[SECTIONS.length-1].books.push({name,en,resume,cle,copte,ch,aelf});}
// Section 1 & 2
S(1,"Évangiles","La vie de Jésus, ce qu'il a fait et comment vivre comme lui",22,
"On commence par le cœur de tout : Jésus lui-même. Les quatre Évangiles racontent la même vie, chacun sous un angle différent. Ne cherche pas à tout retenir : regarde Jésus, ce qu'il dit, ce qu'il fait, comment il traite les gens.");
B("Matthieu","Matthew",
"Écrit par l'apôtre Matthieu, ancien collecteur d'impôts, surtout pour des lecteurs juifs. Il montre que Jésus est le Messie annoncé par les prophètes : tu verras souvent « afin que s'accomplisse ce qui avait été dit… ».",
"Repère les 5 grands discours de Jésus (ch. 5-7, 10, 13, 18, 24-25). Le Sermon sur la montagne (5-7) est le « mode d'emploi » de la vie chrétienne : lis-le lentement.",
"Matthieu 2 raconte la fuite de la Sainte Famille en Égypte. L'Église copte fête l'entrée du Christ en Égypte le 24 Bachans (1er juin) : beaucoup d'églises et de monastères sont construits sur les lieux de leur passage.",
["Généalogie de Jésus depuis Abraham ; l'ange rassure Joseph ; naissance de Jésus.",
"Les mages ; fuite de la Sainte Famille en Égypte ; massacre des enfants ; retour à Nazareth.",
"Jean-Baptiste appelle à la repentance ; baptême de Jésus, l'Esprit descend comme une colombe.",
"Jésus tenté au désert ; il commence à prêcher ; appel des premiers disciples ; guérisons.",
"Sermon sur la montagne (1) : les Béatitudes, le sel et la lumière, aimer ses ennemis.",
"Sermon (2) : l'aumône, la prière (le Notre Père) et le jeûne en secret ; ne pas s'inquiéter.",
"Sermon (3) : ne pas juger ; demandez, cherchez, frappez ; la porte étroite ; la maison sur le roc.",
"Un lépreux, le serviteur du centurion guéris ; la tempête apaisée ; les démoniaques de Gadara.",
"Un paralysé pardonné et guéri ; appel de Matthieu ; la fille de Jaïre ; une femme guérie ; deux aveugles.",
"Jésus envoie les Douze en mission et les prépare aux persécutions.",
"Questions de Jean-Baptiste ; « Venez à moi, vous tous qui êtes fatigués et chargés ».",
"Jésus, Seigneur du sabbat ; accusé d'agir par Béelzébul ; le signe de Jonas ; sa vraie famille.",
"Paraboles du Royaume : semeur, ivraie, grain de moutarde, levain, trésor, perle, filet.",
"Mort de Jean-Baptiste ; multiplication des pains (5000 personnes) ; Jésus marche sur l'eau.",
"La pureté vient du cœur ; la foi de la Cananéenne ; seconde multiplication (4000).",
"Pierre reconnaît Jésus comme le Christ ; première annonce de la Passion ; porter sa croix.",
"La Transfiguration ; un enfant guéri ; deuxième annonce de la Passion ; l'impôt du Temple.",
"Devenir comme un enfant ; la brebis perdue ; pardonner « soixante-dix fois sept fois ».",
"Le mariage ; Jésus bénit les enfants ; le jeune homme riche.",
"Les ouvriers de la dernière heure ; servir plutôt que dominer ; deux aveugles guéris.",
"Entrée à Jérusalem (les Rameaux) ; le Temple purifié ; le figuier ; paraboles des deux fils et des vignerons.",
"Le festin des noces ; l'impôt à César ; la résurrection ; le plus grand commandement.",
"Jésus dénonce l'hypocrisie des scribes et des pharisiens ; il pleure sur Jérusalem.",
"Discours sur la fin des temps : destruction du Temple, signes, « veillez ».",
"Les dix vierges, les talents ; le jugement dernier : « ce que vous avez fait au plus petit… ».",
"Onction à Béthanie ; trahison de Judas ; dernière Cène ; Gethsémani ; arrestation ; reniement de Pierre.",
"Jésus devant Pilate ; mort de Judas ; crucifixion, mort et mise au tombeau.",
"La Résurrection ; Jésus apparaît aux femmes et aux disciples ; « Allez, faites de toutes les nations des disciples »."]);
B("Marc","Mark",
"Le plus court et le plus rapide des Évangiles, écrit par saint Marc à partir de la prédication de Pierre. Jésus y agit beaucoup : le mot « aussitôt » revient sans cesse.",
"Lis-le comme un récit d'action. La question centrale est : « Qui est Jésus ? » La réponse éclate au ch. 8 (Pierre) et au pied de la croix (15,39, le centurion).",
"Saint Marc est le fondateur de l'Église d'Alexandrie et son premier patriarche, martyr en Égypte. Le pape copte est appelé « successeur de saint Marc ». C'est donc « l'Évangile de notre Église ».",
["Jean-Baptiste ; baptême et tentation de Jésus ; appel des disciples ; guérisons à Capharnaüm.",
"Un paralysé descendu par le toit ; appel de Lévi ; le jeûne ; Jésus, Seigneur du sabbat.",
"Une main paralysée guérie ; choix des Douze ; l'accusation de Béelzébul ; la vraie famille.",
"Paraboles : semeur, lampe, graine qui pousse seule, grain de moutarde ; la tempête apaisée.",
"Le démoniaque de Gérasa (« Légion ») ; une femme guérie en touchant son vêtement ; la fille de Jaïre ressuscitée.",
"Rejet à Nazareth ; envoi des Douze ; mort de Jean-Baptiste ; 5000 nourris ; marche sur l'eau.",
"Ce qui souille vraiment l'homme ; la foi de la Syro-phénicienne ; un sourd-muet guéri (« Ephphata »).",
"4000 nourris ; un aveugle guéri ; Pierre : « Tu es le Christ » ; première annonce de la Passion.",
"La Transfiguration ; un enfant possédé ; « qui est le plus grand ? ».",
"Le mariage ; les enfants ; l'homme riche ; « le Fils de l'homme est venu pour servir » ; l'aveugle Bartimée.",
"Entrée à Jérusalem ; le figuier ; le Temple purifié ; la foi qui déplace les montagnes.",
"Les vignerons ; l'impôt à César ; la résurrection ; le grand commandement ; l'offrande de la veuve.",
"Discours sur la fin des temps : « Veillez ! ».",
"Onction à Béthanie ; la Cène ; Gethsémani ; arrestation ; procès ; reniement de Pierre.",
"Pilate ; Barabbas ; crucifixion ; mort ; mise au tombeau par Joseph d'Arimathée.",
"Le tombeau vide ; apparitions ; envoi en mission ; Ascension."]);
B("Luc","Luke",
"Écrit par Luc, médecin et compagnon de saint Paul, après une enquête soignée. Il montre la tendresse de Jésus pour les pauvres, les femmes, les pécheurs et les étrangers.",
"Luc a les plus belles paraboles de miséricorde (ch. 10, 15, 18). Note aussi la place de la prière et de l'Esprit Saint. Il a écrit une suite : les Actes des Apôtres.",
"Luc raconte en détail l'Annonciation et le cantique de la Vierge Marie (ch. 1), très aimée dans l'Église copte qui l'appelle Théotokos, « Mère de Dieu ».",
["Annonce à Zacharie et à Marie ; Marie visite Élisabeth ; le Magnificat ; naissance de Jean-Baptiste.",
"Naissance de Jésus à Bethléem ; les bergers ; présentation au Temple (Siméon, Anne) ; Jésus à 12 ans.",
"Prédication de Jean-Baptiste ; baptême de Jésus ; généalogie jusqu'à Adam.",
"Tentation au désert ; Jésus lit Isaïe à la synagogue de Nazareth ; guérisons.",
"Pêche miraculeuse et appel de Pierre ; un lépreux ; un paralysé ; appel de Lévi.",
"Le sabbat ; choix des Douze ; Béatitudes ; aimer ses ennemis ; l'arbre et ses fruits.",
"Le serviteur du centurion ; le fils de la veuve de Naïn ressuscité ; la pécheresse pardonnée.",
"Les femmes qui suivent Jésus ; le semeur ; la tempête ; le démoniaque ; la fille de Jaïre.",
"Envoi des Douze ; 5000 nourris ; Pierre reconnaît le Christ ; Transfiguration ; départ vers Jérusalem.",
"Envoi des 72 disciples ; le bon Samaritain ; Marthe et Marie.",
"Le Notre Père et la prière persévérante ; le signe de Jonas ; reproches aux pharisiens.",
"Ne pas craindre ; le riche insensé ; ne pas s'inquiéter ; serviteurs vigilants.",
"Appel à la repentance ; une femme courbée guérie ; la porte étroite.",
"Choisir la dernière place ; le grand festin ; ce que coûte de suivre Jésus.",
"La brebis perdue, la pièce perdue et le fils prodigue : la joie de Dieu quand un pécheur revient.",
"L'intendant habile ; le riche et le pauvre Lazare.",
"Pardon et foi ; dix lépreux guéris, un seul revient remercier.",
"La veuve insistante ; le pharisien et le publicain ; l'homme riche ; l'aveugle de Jéricho.",
"Zachée ; parabole des pièces d'or ; entrée à Jérusalem ; Jésus pleure sur la ville.",
"L'autorité de Jésus ; les vignerons ; l'impôt à César ; la résurrection.",
"L'offrande de la veuve ; discours sur la fin des temps.",
"La Cène ; Gethsémani (sueur de sang) ; arrestation ; reniement de Pierre.",
"Devant Pilate et Hérode ; crucifixion ; le bon larron ; mort et mise au tombeau.",
"La Résurrection ; les disciples d'Emmaüs ; apparition aux Onze ; Ascension."]);
B("Jean","John",
"Écrit par l'apôtre Jean, « le disciple que Jésus aimait ». Plus méditatif que les trois autres, il insiste sur la divinité de Jésus : « Le Verbe était Dieu ».",
"Repère les 7 « Je suis » (le pain de vie, la lumière, la porte, le bon berger, la résurrection, le chemin, la vraie vigne) et les 7 signes (miracles). Jean écrit « pour que vous croyiez » (20,31).",
"Le début de Jean (1,1-17) est l'Évangile de la prière du matin (1re heure) de l'Agpeya, le livre des heures copte.",
["« Au commencement était le Verbe » ; témoignage de Jean-Baptiste ; premiers disciples.",
"Les noces de Cana (premier signe) ; Jésus chasse les marchands du Temple.",
"Nicodème : naître de nouveau ; « Dieu a tant aimé le monde… » (3,16).",
"La Samaritaine au puits : l'eau vive ; guérison du fils d'un officier.",
"Le paralysé de Béthesda guéri un sabbat ; Jésus parle de son unité avec le Père.",
"5000 nourris ; marche sur l'eau ; « Je suis le pain de vie » (l'Eucharistie).",
"Jésus à la fête des Tentes ; « des fleuves d'eau vive » ; les gens divisés à son sujet.",
"La femme adultère ; « Je suis la lumière du monde » ; « avant qu'Abraham fût, Je suis ».",
"Guérison de l'aveugle-né ; l'enquête des pharisiens ; l'aveuglement spirituel.",
"« Je suis le bon berger » ; « le Père et moi, nous sommes un ».",
"Résurrection de Lazare : « Je suis la résurrection et la vie ».",
"Marie verse le parfum ; entrée à Jérusalem ; le grain de blé qui meurt.",
"Jésus lave les pieds des disciples ; commandement nouveau : « aimez-vous les uns les autres ».",
"« Je suis le chemin, la vérité et la vie » ; promesse de l'Esprit Saint (le Paraclet).",
"La vigne et les sarments ; demeurer dans son amour.",
"L'œuvre de l'Esprit ; la tristesse changée en joie ; « J'ai vaincu le monde ».",
"La grande prière de Jésus pour ses disciples et pour leur unité.",
"Arrestation ; devant Anne et Caïphe ; reniement de Pierre ; devant Pilate.",
"Flagellation ; crucifixion ; Marie et Jean au pied de la croix ; mort et mise au tombeau.",
"Le tombeau vide ; Marie-Madeleine ; Thomas : « Mon Seigneur et mon Dieu ! ».",
"Apparition au bord du lac ; Pierre pardonné : « Pais mes brebis »."]);

S(2,"Actes et lettres de Paul","Les règles d'une vie chrétienne",31,
"Après la vie de Jésus, tu vois naître l'Église : l'Esprit Saint descend, les apôtres annoncent la Résurrection, puis saint Paul écrit aux premières communautés pour leur apprendre à vivre en chrétiens.");
B("Actes","Acts",
"La suite de l'Évangile de Luc : l'Esprit Saint descend à la Pentecôte et l'Église se répand de Jérusalem jusqu'à Rome. D'abord Pierre (ch. 1-12), puis Paul (ch. 13-28).",
"Suis le mouvement : Jérusalem → Judée et Samarie → jusqu'aux extrémités de la terre (1,8). Les ch. 13 à 28 suivent les voyages de Paul : une carte aide beaucoup.",
"À chaque messe copte, on lit un passage des Actes : c'est le « Praxis ».",
["Ascension ; les disciples attendent l'Esprit ; Matthias remplace Judas.",
"Pentecôte : l'Esprit Saint descend ; discours de Pierre ; 3000 baptisés ; la vie de la première Église.",
"Pierre et Jean guérissent un boiteux au Temple ; discours de Pierre.",
"Pierre et Jean arrêtés puis relâchés ; prière de l'Église ; tout est mis en commun.",
"Ananias et Saphira ; les apôtres arrêtés, libérés par un ange ; le conseil de Gamaliel.",
"Choix des sept diacres, dont Étienne ; Étienne accusé.",
"Discours d'Étienne ; il est lapidé, premier martyr ; Saul (Paul) est présent.",
"Persécution ; Philippe en Samarie ; baptême de l'eunuque éthiopien.",
"Conversion de Saul sur le chemin de Damas ; Pierre ressuscite Tabitha.",
"Vision de Pierre ; le centurion Corneille, premier païen baptisé.",
"Pierre s'explique ; à Antioche, on appelle les disciples « chrétiens » pour la première fois.",
"Martyre de l'apôtre Jacques ; Pierre libéré de prison par un ange.",
"Barnabé et Paul envoyés : premier voyage missionnaire.",
"Iconium, Lystre (Paul lapidé), Derbé ; retour à Antioche.",
"Concile de Jérusalem : les païens n'ont pas à suivre la loi de Moïse.",
"Deuxième voyage : Timothée ; Lydie ; prison de Philippes et conversion du gardien.",
"Thessalonique, Bérée ; discours de Paul à Athènes.",
"Corinthe avec Aquilas et Priscille ; début du troisième voyage ; Apollos.",
"Éphèse : miracles ; émeute des orfèvres de la déesse Artémis.",
"Eutyche ressuscité ; adieux émouvants de Paul aux anciens d'Éphèse.",
"Paul monte à Jérusalem malgré les avertissements ; il est arrêté au Temple.",
"Paul raconte sa conversion à la foule ; il est citoyen romain.",
"Paul devant le Sanhédrin ; complot pour le tuer ; transféré à Césarée.",
"Paul devant le gouverneur Félix ; deux ans de prison.",
"Devant Festus, Paul fait appel à César ; arrivée du roi Agrippa.",
"Paul témoigne devant Agrippa : « Encore un peu et tu me persuades de devenir chrétien ».",
"Voyage vers Rome ; tempête et naufrage ; tous sont sauvés.",
"Malte ; arrivée à Rome ; Paul annonce l'Évangile librement pendant deux ans."]);
B("Romains","Romans",
"La lettre la plus complète de Paul : comment Dieu sauve l'homme. Tous ont péché, mais Dieu nous rend justes par la foi en Jésus-Christ et nous donne une vie nouvelle dans l'Esprit.",
"C'est dense : lis lentement. Ch. 1-8 = le salut ; ch. 9-11 = Israël ; ch. 12-16 = la vie concrète. Le ch. 8 est un sommet à relire souvent.",
"Les lettres de Paul (14 avec Hébreux) sont lues à chaque messe copte : c'est la lecture du « Boulos ».",
["L'Évangile, puissance de Dieu ; l'humanité s'est détournée de Dieu.",
"Dieu juge sans favoritisme : Juifs et païens sont responsables.",
"Tous ont péché ; justifiés gratuitement par la foi en Jésus-Christ.",
"Abraham, rendu juste par sa foi.",
"La paix avec Dieu ; Adam et le Christ.",
"Morts au péché et vivants pour Dieu par le baptême.",
"La lutte intérieure : « je ne fais pas le bien que je veux ».",
"La vie selon l'Esprit ; « rien ne pourra nous séparer de l'amour de Dieu ».",
"La tristesse de Paul pour Israël ; la liberté de Dieu.",
"« Quiconque invoquera le nom du Seigneur sera sauvé. »",
"Israël n'est pas rejeté ; l'olivier et les branches greffées.",
"S'offrir à Dieu en sacrifice vivant ; les dons ; l'amour sincère.",
"Le respect des autorités ; l'amour accomplit la loi.",
"Ne pas juger son frère sur la nourriture et les jours.",
"S'accueillir les uns les autres ; projets de voyage de Paul.",
"Salutations ; mises en garde ; louange finale."]);
B("1 Corinthiens","1 Corinthians",
"Paul écrit à une Église pleine de dons mais aussi de problèmes : divisions, immoralité, procès, désordre dans la messe. Il répond à chaque question.",
"Très concret : chaque chapitre répond à un problème. Ne rate pas le ch. 13 (l'amour) et le ch. 15 (la résurrection).",
"Le ch. 11 sur la Cène fonde la manière de communier dignement, avec préparation et jeûne, très importante dans la tradition copte.",
["Divisions dans l'Église ; la croix, folie pour le monde et sagesse de Dieu.",
"Paul annonce le Christ crucifié ; la sagesse donnée par l'Esprit.",
"Le Christ seul fondement ; « vous êtes le temple de Dieu ».",
"Les apôtres, serviteurs du Christ ; Paul, père spirituel.",
"Un péché grave toléré dans l'Église ; un peu de levain fait lever toute la pâte.",
"Procès entre frères ; le corps, temple du Saint-Esprit.",
"Mariage, célibat et vie de couple.",
"Viandes offertes aux idoles : la connaissance et l'amour du frère.",
"Paul renonce à ses droits pour l'Évangile ; courir pour gagner le prix.",
"Leçons de l'histoire d'Israël ; fuir l'idolâtrie ; la communion au corps du Christ.",
"La tenue dans l'assemblée ; la Cène du Seigneur et communier dignement.",
"Les dons de l'Esprit : un seul corps, beaucoup de membres.",
"L'hymne à l'amour : « l'amour est patient… le plus grand, c'est l'amour ».",
"Prophétie et langues : tout doit se faire avec ordre.",
"La résurrection du Christ et la nôtre : « Ô mort, où est ta victoire ? ».",
"La collecte pour Jérusalem ; salutations."]);
B("2 Corinthiens","2 Corinthians",
"La lettre la plus personnelle de Paul : il ouvre son cœur, ses souffrances et ses faiblesses, et défend son ministère contre de faux apôtres.",
"Le thème central : la force de Dieu se manifeste dans notre faiblesse (12,9). Un livre consolant quand on traverse une épreuve.",
"",
["Le Dieu de toute consolation ; Paul explique ses changements de projet.",
"Pardonner celui qui a péché ; nous sommes le parfum du Christ.",
"Une lettre écrite dans les cœurs ; la gloire de la nouvelle alliance.",
"Un trésor dans des vases d'argile ; ne pas perdre courage.",
"Notre demeure céleste ; une nouvelle création ; réconciliés avec Dieu.",
"Les épreuves de Paul ; ne pas s'associer aux incroyants.",
"La tristesse qui mène à la repentance ; la joie de Paul.",
"La générosité des Macédoniens ; le Christ s'est fait pauvre pour nous.",
"« Dieu aime celui qui donne avec joie. »",
"Paul défend son autorité ; soumettre toute pensée au Christ.",
"Les faux apôtres ; Paul énumère ses souffrances.",
"Vision du paradis ; l'écharde dans la chair : « Ma grâce te suffit ».",
"Derniers avertissements ; bénédiction de la Trinité."]);
B("Galates","Galatians",
"Lettre enflammée : des prédicateurs voulaient imposer la loi de Moïse aux païens convertis. Paul défend la liberté chrétienne : on est sauvé par la foi au Christ.",
"Lis-la d'un coup si tu peux. Ch. 5 : les œuvres de la chair contre le fruit de l'Esprit (amour, joie, paix…) : un bon examen de conscience.",
"",
["Il n'y a pas d'autre Évangile ; Paul raconte son appel.",
"Paul reconnu à Jérusalem ; il reprend Pierre à Antioche.",
"La foi d'Abraham ; la loi conduisait au Christ ; tous un en Christ.",
"Enfants et héritiers, plus esclaves ; Agar et Sara.",
"La liberté chrétienne ; le fruit de l'Esprit.",
"Porter les fardeaux les uns des autres ; on récolte ce qu'on sème."]);
B("Éphésiens","Ephesians",
"Lettre écrite en prison : le plan de Dieu de réunir tout en Christ, l'Église comme corps du Christ, et la vie nouvelle qui en découle.",
"Ch. 1-3 = ce que Dieu a fait pour nous ; ch. 4-6 = comment vivre en réponse. Finis par « l'armure de Dieu » (ch. 6).",
"",
["Toutes les bénédictions spirituelles en Christ ; prière pour connaître Dieu.",
"Sauvés par grâce, par la foi ; Juifs et païens réunis en un seul corps.",
"Le mystère révélé ; prière pour connaître l'amour du Christ.",
"L'unité du corps ; vieil homme et homme nouveau.",
"Vivre en enfants de lumière ; mari et femme, image du Christ et de l'Église.",
"Enfants et parents ; l'armure de Dieu."]);
B("Philippiens","Philippians",
"La lettre de la joie, écrite par Paul en prison à une Église qu'il aimait beaucoup.",
"Compte combien de fois revient le mot « joie ». Le ch. 2 contient un hymne sur l'humilité du Christ.",
"",
["La joie de Paul en prison : « pour moi, vivre c'est le Christ ».",
"Le Christ qui s'est abaissé (hymne) ; Timothée et Épaphrodite.",
"Tout perdre pour connaître le Christ ; courir vers le but.",
"« Réjouissez-vous toujours » ; « je peux tout en celui qui me fortifie »."]);
B("Colossiens","Colossians",
"Paul montre la grandeur du Christ, au-dessus de toute création, contre des enseignements qui voulaient y ajouter d'autres « sagesses ».",
"Le ch. 1 (15-20) est un des plus beaux textes sur qui est Jésus.",
"",
["Le Christ, image du Dieu invisible, premier-né de toute création.",
"Toute la plénitude en Christ ; attention aux fausses philosophies.",
"Chercher les choses d'en haut ; revêtir l'homme nouveau ; la famille chrétienne.",
"La prière persévérante ; salutations (Luc, Marc, Onésime)."]);

S(3,"Psaumes et Proverbes","Construire une relation avec Dieu et développer ta sagesse",45,
"Les Psaumes t'apprennent à parler à Dieu dans toutes les situations : joie, peur, colère, repentance. Les Proverbes t'apprennent la sagesse du quotidien. Essaie de prier un verset qui te touche chaque jour.");
B("Psaumes","Psalms",
"150 prières et chants, dont beaucoup écrits par le roi David. C'était le livre de prière de Jésus lui-même, et c'est encore celui de l'Église.",
"Ne lis pas les Psaumes comme une histoire : prie-les. Si un psaume exprime une émotion que tu ne vis pas, prie-le pour quelqu'un qui la vit. Repère les annonces du Christ (Ps 2, 15, 21, 109, 117).",
"Les Coptes prient les Psaumes chaque jour dans l'Agpeya (prière des heures). L'app suit la numérotation de la Septante, la même que l'Agpeya : « Aie pitié de moi, ô Dieu » est le Psaume 50 (51 dans les Bibles traduites de l'hébreu). Le Psaume 151 fait partie de la Bible copte. Tu remarqueras aussi les titres anciens des psaumes, comme « Jusqu'à la fin », qui viennent de la Septante.",
["Les deux chemins : le juste est comme un arbre planté près de l'eau.",
"Le Seigneur et son Messie face aux nations révoltées.",
"Confiance au milieu des ennemis (David fuyant son fils Absalom).",
"Prière du soir : « en paix je me couche et je dors ».",
"Prière du matin pour être guidé.",
"Supplication dans la détresse (psaume de repentance).",
"Appel à Dieu, juge juste.",
"« Qu'est-ce que l'homme pour que tu penses à lui ? » La grandeur de Dieu dans la création.",
"Action de grâce pour la justice de Dieu.",
"Pourquoi Dieu semble-t-il loin quand le méchant triomphe ?",
"Confiance : le Seigneur est dans son saint temple.",
"La parole de Dieu est pure face au mensonge des hommes.",
"« Jusqu'à quand, Seigneur ? » De l'angoisse à la confiance.",
"L'insensé dit dans son cœur : « Il n'y a pas de Dieu ».",
"Qui peut habiter chez le Seigneur ?",
"« Tu ne laisseras pas ton fidèle voir la corruption » (annonce de la Résurrection).",
"Prière d'un innocent : « garde-moi comme la prunelle de l'œil ».",
"Chant de victoire de David : « Je t'aime, Seigneur, ma force ».",
"Les cieux racontent la gloire de Dieu ; la loi du Seigneur est parfaite.",
"Prière pour le roi avant la bataille.",
"Joie du roi après la victoire.",
"« Mon Dieu, mon Dieu, pourquoi m'as-tu abandonné ? » Le psaume de la Passion.",
"« Le Seigneur est mon berger, je ne manquerai de rien. »",
"Le Roi de gloire entre : « Portes, élevez vos linteaux ! ».",
"Prière pour être guidé et pardonné.",
"Vivre avec intégrité devant Dieu.",
"« Le Seigneur est ma lumière et mon salut, de qui aurais-je peur ? »",
"Cri vers Dieu, mon rocher.",
"La voix du Seigneur dans l'orage.",
"Action de grâce après la guérison : « le soir, les pleurs ; le matin, la joie ».",
"« Entre tes mains je remets mon esprit. »",
"Le bonheur de celui dont la faute est pardonnée.",
"Un chant nouveau pour le Créateur.",
"« Goûtez et voyez combien le Seigneur est bon. »",
"Appel à l'aide contre des accusateurs injustes.",
"La méchanceté humaine et la bonté de Dieu, source de vie.",
"Ne t'irrite pas contre les méchants ; confie-toi au Seigneur.",
"Psaume de repentance dans la souffrance.",
"La brièveté de la vie.",
"« J'ai attendu le Seigneur » ; « me voici, je viens faire ta volonté ».",
"Heureux qui pense au faible ; la trahison d'un ami.",
"« Comme une biche soupire après l'eau » : la soif de Dieu.",
"« Envoie ta lumière et ta vérité, qu'elles me guident. »",
"Lamentation du peuple vaincu malgré sa fidélité.",
"Chant des noces du roi (lu pour le Christ et l'Église, et pour la Vierge).",
"« Dieu est notre refuge et notre force. »",
"Dieu, roi de toute la terre.",
"Sion, la ville du grand Roi.",
"Les richesses ne rachètent pas la vie.",
"Dieu veut un cœur reconnaissant plus que des sacrifices.",
"« Aie pitié de moi, ô Dieu » : la repentance de David. Le psaume prié à chaque heure de l'Agpeya.",
"Le méchant arraché ; le juste comme un olivier vert.",
"L'insensé nie Dieu (proche du Ps 13).",
"Prière dans la menace.",
"La trahison d'un ami ; « remets ton fardeau au Seigneur ».",
"« Quand j'ai peur, je me confie en toi. »",
"À l'abri de tes ailes.",
"Contre les juges injustes.",
"Délivrance face aux ennemis.",
"Prière après une défaite.",
"« Conduis-moi sur le rocher trop haut pour moi. »",
"« Mon âme se repose en Dieu seul. »",
"« Dès l'aurore je te cherche » : soif de Dieu au désert.",
"Protection contre les complots.",
"Louange pour la pluie et les moissons.",
"Toute la terre, louez Dieu pour ses œuvres.",
"Que les peuples te louent : bénédiction.",
"La marche triomphale de Dieu.",
"« Les eaux me montent jusqu'à l'âme » ; le vinaigre de la Passion est annoncé.",
"Appel urgent : « Dieu, viens à mon aide ».",
"Prière d'un vieil homme, fidèle depuis sa jeunesse.",
"Le règne juste et universel du roi-Messie.",
"Jaloux des méchants qui réussissent, le juste comprend dans le sanctuaire.",
"Lamentation sur le sanctuaire détruit.",
"Dieu juge au moment fixé.",
"Dieu redoutable et victorieux.",
"Dans la détresse, se souvenir des œuvres passées de Dieu.",
"Leçons de l'histoire d'Israël : les infidélités du peuple et la fidélité de Dieu.",
"Lamentation sur Jérusalem dévastée.",
"« Dieu, fais-nous revenir » : la vigne de Dieu.",
"Appel à écouter Dieu.",
"Dieu juge les juges.",
"Prière contre une coalition ennemie.",
"« Que tes demeures sont aimables » : le désir de la maison de Dieu.",
"L'amour et la vérité se rencontrent, la justice et la paix s'embrassent.",
"Prière d'un pauvre : « enseigne-moi ta voie ».",
"Sion, mère de tous les peuples (l'Égypte y est nommée).",
"La prière la plus sombre du psautier.",
"L'alliance avec David ; lamentation.",
"Prière de Moïse : « apprends-nous à compter nos jours ».",
"« Celui qui demeure à l'abri du Très-Haut » : la protection de Dieu.",
"Il est bon de louer le Seigneur ; le juste pousse comme un palmier.",
"Le Seigneur règne, vêtu de majesté.",
"Le Dieu juste défend le faible.",
"« Venez, crions de joie » ; n'endurcissez pas vos cœurs.",
"Chantez un chant nouveau : Dieu vient juger la terre.",
"Le Seigneur règne : que la terre exulte.",
"Un chant nouveau pour les merveilles de Dieu.",
"Saint est le Seigneur.",
"« Acclamez le Seigneur, toute la terre. »",
"L'engagement du roi à vivre avec intégrité.",
"Prière d'un affligé ; Dieu demeure pour toujours.",
"« Bénis le Seigneur, ô mon âme » : sa miséricorde.",
"Hymne au Créateur.",
"Les merveilles de Dieu, d'Abraham à la sortie d'Égypte.",
"Confession des péchés d'Israël au fil de l'histoire.",
"Rendez grâce : Dieu délivre ceux qui crient vers lui.",
"Un cœur affermi ; la victoire (reprise des Ps 56 et 59).",
"Contre l'accusateur injuste (cité pour Judas en Actes 1).",
"« Assieds-toi à ma droite » : le Messie, roi et prêtre selon Melchisédek.",
"Grandes sont les œuvres du Seigneur.",
"Bonheur de celui qui craint Dieu.",
"Louez le nom du Seigneur, qui relève le pauvre.",
"La sortie d'Égypte : la mer voit et s'enfuit.",
"« Non pas à nous, Seigneur, mais à ton nom la gloire » ; la vanité des idoles.",
"Action de grâce d'un homme délivré de la mort.",
"Le plus court psaume : toutes les nations, louez le Seigneur.",
"« La pierre rejetée est devenue la pierre d'angle » ; « Voici le jour que fit le Seigneur ».",
"Le plus long psaume (176 versets) : l'amour de la Parole de Dieu, en 22 strophes. Prends ton temps, tu peux le lire en deux fois.",
"Premier « cantique des montées » (chants des pèlerins) : appel dans la détresse.",
"« Mon secours vient du Seigneur. »",
"La joie d'aller à la maison du Seigneur.",
"Les yeux levés vers Dieu.",
"« Si le Seigneur n'avait pas été pour nous… »",
"Ceux qui se confient en Dieu sont comme la montagne de Sion.",
"« Ceux qui sèment dans les larmes moissonnent dans la joie. »",
"« Si le Seigneur ne bâtit la maison… »",
"Le bonheur de la famille qui craint Dieu.",
"Israël opprimé mais jamais vaincu.",
"« Des profondeurs je crie vers toi, Seigneur » (psaume de repentance).",
"L'humilité : comme un petit enfant contre sa mère.",
"Dieu choisit Sion et David.",
"« Qu'il est bon et agréable pour des frères de vivre ensemble ! »",
"Bénédiction de nuit dans le temple.",
"Louange au Dieu de l'histoire ; la vanité des idoles.",
"« Car éternel est son amour » : chanté comme 2e Hoos de la Tasbeha copte.",
"« Au bord des fleuves de Babylone » : la douleur de l'exil.",
"Action de grâce de tout cœur.",
"« Tu me sondes et tu me connais » : Dieu présent partout.",
"Délivrance face aux violents.",
"« Que ma prière monte comme l'encens devant toi. »",
"Cri depuis la caverne.",
"« Enseigne-moi à faire ta volonté » (psaume de repentance).",
"Prière du roi pour la victoire et la paix.",
"La grandeur et la bonté de Dieu pour tous.",
"Ne vous confiez pas aux puissants ; Dieu soutient l'orphelin et la veuve.",
"Dieu guérit les cœurs brisés et compte les étoiles.",
"Que toute la création loue le Seigneur.",
"Un chant nouveau pour Israël.",
"« Que tout ce qui respire loue le Seigneur ! »",
"Psaume 151 (Bible copte) : David, le plus petit de ses frères, choisi par Dieu et vainqueur de Goliath."]);
B("Proverbes","Proverbs",
"Recueil de conseils de sagesse, en grande partie attribués au roi Salomon. Thème central : « La crainte du Seigneur est le commencement de la sagesse » (1,7).",
"Ch. 1-9 = de longs discours d'un père à son fils ; à partir du ch. 10 = des proverbes courts. Ne lis pas trop vite : choisis UN proverbe par chapitre et garde-le pour ta journée. 31 chapitres = un par jour du mois, si tu veux le relire plus tard.",
"Les Proverbes font partie des lectures de prophéties du Grand Carême copte. Les Pères de l'Église ont vu dans la Sagesse du ch. 8 une image du Christ.",
["But du livre ; « la crainte du Seigneur est le commencement de la connaissance » ; la Sagesse appelle.",
"Chercher la sagesse comme un trésor caché.",
"« Confie-toi au Seigneur de tout ton cœur » ; honorer Dieu avec ses biens.",
"Acquérir la sagesse ; « garde ton cœur, car de lui viennent les sources de la vie ».",
"Mise en garde contre la femme séductrice ; la fidélité dans le couple.",
"La fourmi et le paresseux ; sept choses que Dieu déteste.",
"Le jeune homme imprudent qui se laisse séduire.",
"La Sagesse parle : elle était avec Dieu à la création (image du Christ selon les Pères).",
"Le banquet de la Sagesse contre celui de la Folie.",
"Début des proverbes de Salomon : le juste et le méchant ; le pouvoir des paroles.",
"Honnêteté, humilité, générosité.",
"Le travail, la vérité, les paroles qui guérissent.",
"Prudence, discipline ; « qui fréquente les sages devient sage ».",
"La sagesse bâtit, la folie détruit.",
"« Une réponse douce calme la colère. »",
"« L'homme fait des projets, mais c'est le Seigneur qui dirige ses pas » ; l'orgueil précède la chute.",
"La paix, l'amitié ; « un cœur joyeux est un bon remède ».",
"La langue a pouvoir de vie et de mort ; un ami plus proche qu'un frère.",
"Pauvreté honnête, patience, discipline.",
"Le vin trompeur ; l'intégrité.",
"Le cœur du roi est dans la main de Dieu ; la justice vaut mieux que les sacrifices.",
"Une bonne réputation ; éduquer l'enfant ; les paroles des sages.",
"La mesure à table ; ne pas envier les pécheurs ; les dangers du vin.",
"Ne pas envier les méchants ; secourir les autres ; le champ du paresseux.",
"Proverbes copiés sous le roi Ézéchias ; nourrir son ennemi.",
"L'insensé, le paresseux, les querelles.",
"Ne pas se vanter du lendemain ; « le fer aiguise le fer ».",
"Le juste est hardi comme un lion ; avouer ses fautes.",
"Discipline, justice, crainte de Dieu.",
"Paroles d'Agur : humilité ; « ne me donne ni pauvreté ni richesse ».",
"Conseils au roi Lemuel ; portrait de la femme vertueuse."]);

S(8,"Genèse et Exode","Comment le monde a été créé, la traversée du désert et les histoires de nos ancêtres",30,
"Retour aux origines : la création, la chute, les patriarches (Abraham, Isaac, Jacob, Joseph), puis Moïse et la libération d'Égypte. Maintenant que tu connais Jésus, tu verras partout des « figures » qui l'annoncent.");
B("Genèse","Genesis",
"Le livre des commencements : création du monde et de l'homme, le péché, le déluge, puis l'histoire d'Abraham et de sa famille, jusqu'à Joseph en Égypte.",
"Ch. 1-11 = les origines de l'humanité ; ch. 12-50 = les patriarches. Cherche les figures du Christ : Melchisédek (pain et vin), le sacrifice d'Isaac, Joseph trahi puis sauveur de ses frères.",
"Une grande partie de la Genèse se passe en lien avec l'Égypte (Abraham, Agar, Joseph). La Genèse fait partie des lectures de prophéties du Grand Carême copte.",
["La création en six jours ; l'homme créé à l'image de Dieu.",
"Le septième jour ; Adam dans le jardin d'Éden ; création d'Ève.",
"La chute : le serpent, le fruit défendu ; la promesse d'un Sauveur (3,15).",
"Caïn tue son frère Abel.",
"D'Adam à Noé ; Hénoch enlevé auprès de Dieu.",
"La corruption du monde ; Noé construit l'arche.",
"Le déluge.",
"Fin du déluge ; la colombe ; le sacrifice de Noé.",
"L'alliance avec Noé : l'arc-en-ciel.",
"Les descendants de Noé et les peuples (Mitsraïm = l'Égypte).",
"La tour de Babel ; les ancêtres d'Abram.",
"Appel d'Abram : « en toi seront bénies toutes les familles de la terre » ; Abram en Égypte.",
"Abram et Lot se séparent.",
"Abram délivre Lot ; Melchisédek offre le pain et le vin.",
"Alliance avec Abram : « compte les étoiles » ; sa foi lui est comptée comme justice.",
"Agar l'Égyptienne et la naissance d'Ismaël.",
"Abram devient Abraham ; la circoncision ; la promesse d'Isaac.",
"Trois visiteurs chez Abraham ; il intercède pour Sodome.",
"Destruction de Sodome ; la femme de Lot.",
"Abraham et le roi Abimélek.",
"Naissance d'Isaac ; Agar et Ismaël au désert, Dieu les protège.",
"Le sacrifice d'Isaac : « Dieu pourvoira » (figure de la croix).",
"Mort de Sara.",
"Une épouse pour Isaac : Rébecca.",
"Mort d'Abraham ; Ésaü et Jacob ; Ésaü vend son droit d'aînesse.",

B("Exode","Exodus",
"Les descendants de Jacob sont devenus esclaves en Égypte. Dieu appelle Moïse, frappe l'Égypte de dix plaies, libère son peuple à travers la mer, lui donne la loi au Sinaï et vient habiter au milieu de lui.",
"Ch. 1-18 = la libération (récit) ; ch. 19-24 = l'alliance et les dix commandements ; ch. 25-40 = le tabernacle (plus descriptif, lis tranquillement). La Pâque (ch. 12) annonce Jésus, l'Agneau de Dieu.",
"Le cantique de Moïse après la mer Rouge (ch. 15) est la 1re Hoos de la Tasbeha copte. Le buisson ardent qui brûle sans se consumer (ch. 3) est chanté comme image de la Vierge Marie qui porte Dieu sans être consumée.",

S(9,"De Lévitique à Ruth","Histoires de la Bible",48,
"La fin des livres de Moïse (lois, désert, dernier discours), puis l'entrée en Terre promise avec Josué, l'époque troublée des Juges, et la belle histoire de Ruth. Certains chapitres de lois sont arides : lis-les sans te décourager, ils expliquent le sens des sacrifices accomplis par le Christ.");
B("Lévitique","Leviticus",
"Le manuel des prêtres (de la tribu de Lévi) : sacrifices, pureté, fêtes, sainteté. Thème : « Soyez saints, car je suis saint ».",
"Ne cherche pas à tout comprendre. Chaque sacrifice annonce l'unique sacrifice du Christ (l'épître aux Hébreux l'explique). Ne rate pas le ch. 16 (Jour des Expiations) et le ch. 19 (« Tu aimeras ton prochain comme toi-même »).",
"Les mots de la messe copte « sacrifice », « encens », « autel » viennent de ce monde du Lévitique, accompli dans l'Eucharistie.",

B("Nombres","Numbers",
"Le voyage de 40 ans dans le désert, du Sinaï jusqu'aux portes de la Terre promise. Son nom vient des deux recensements. Le peuple se plaint et se révolte souvent, mais Dieu reste fidèle.",
"Les récits (ch. 11-25) sont les plus vivants. Le serpent de bronze (ch. 21) est cité par Jésus pour annoncer sa croix (Jean 3,14).",
"Le bâton d'Aaron qui fleurit sans racine (ch. 17) est chanté dans la Théotokie copte comme image de la Vierge Marie qui enfante sans semence d'homme.",

B("Deutéronome","Deuteronomy",
"Les derniers discours de Moïse avant sa mort, au bord du Jourdain. Il rappelle l'histoire, répète la loi et appelle le peuple à aimer Dieu de tout son cœur.",
"Jésus a cité le Deutéronome pour répondre au diable dans le désert (ch. 6 et 8). Le ch. 6 (« Écoute, Israël ») et le ch. 30 (« choisis la vie ») sont essentiels.",
"Le « prophète comme Moïse » annoncé au ch. 18 est compris par l'Église comme le Christ (Actes 3,22).",

B("Josué","Joshua",
"Josué, successeur de Moïse, conduit le peuple dans la Terre promise : traversée du Jourdain, chute de Jéricho, partage du pays entre les tribus.",
"Ch. 1-12 = la conquête (récits) ; ch. 13-21 = le partage (listes, lis-les vite). Josué porte le même nom que Jésus (« Dieu sauve ») : il fait entrer le peuple dans la promesse.",

B("Juges","Judges",
"Après Josué, le peuple oublie Dieu. Un cycle se répète : péché → oppression → cri vers Dieu → Dieu envoie un « juge » libérateur (Débora, Gédéon, Samson…) → paix → nouveau péché.",
"Repère le cycle à chaque histoire. Les juges sont imparfaits : Dieu agit malgré leurs faiblesses. Les derniers chapitres (17-21) sont durs : ils montrent ce que devient un peuple sans Dieu.",

B("Ruth","Ruth",
"Ruth, une étrangère, reste fidèle à sa belle-mère Noémi et à son Dieu. Booz la rachète et l'épouse : elle devient l'arrière-grand-mère du roi David et une ancêtre de Jésus.",
"Une histoire de fidélité et de bonté au milieu de l'époque sombre des Juges. Booz, le « rédempteur », est une figure du Christ.",

S(10,"Samuel, Rois, Chroniques","L'histoire du roi David et les premiers prophètes",55,
"De Samuel au roi Saül, puis David, Salomon et le Temple ; la division du royaume, les prophètes Élie et Élisée, et enfin l'exil. Les Chroniques racontent la même histoire du point de vue du Temple et de la prière.");

"Compare Saül et David : Dieu « regarde au cœur » (16,7). L'amitié de David et Jonathan (ch. 18-20) est un modèle.",

B("2 Samuel","2 Samuel",
"Le règne de David : roi de tout Israël, il prend Jérusalem et y amène l'arche. Dieu lui promet un trône éternel. Puis vient son grand péché avec Bethsabée, sa repentance, et les drames de sa famille.",
"Le ch. 7 (promesse à David) annonce le Christ, « fils de David ». Le ch. 12 montre la vraie repentance : lis ensuite le Psaume 50 (51 dans les Bibles hébraïques), écrit à ce moment.",

B("1 Rois","1 Kings",
"Salomon reçoit la sagesse et construit le Temple, mais finit par se détourner de Dieu. Le royaume se divise en deux : Israël au nord, Juda au sud. Puis le prophète Élie affronte le roi Achab et la reine Jézabel.",

B("2 Rois","2 Kings",
"Élie est enlevé au ciel et Élisée fait de nombreux miracles. Puis la décadence : le royaume du nord tombe sous l'Assyrie, et Juda sous Babylone malgré les réformes d'Ézéchias et de Josias.",
